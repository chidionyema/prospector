# Vale — the MARKETING copy lane (storefront .tsx, docs, kill log).
#
# Pack copy is gated in Python on the publish path (prospector/copy_lint.py,
# prospector/register_lint.py, prospector/house_style.py). This file covers the copy that
# never passes through that gate: hardcoded storefront prose.
#
# Rule numbers are HOUSE_WRITING_SPEC.md's. The pack lane and this lane cite the SAME ids,
# so "R9" means one thing across the platform even though two different pieces of code
# enforce it. Vale reads files; a pack is assembled in memory and zipped, and materialising
# it to lint would put a /usr/local/bin binary on the daemon's critical path, which launchd
# does not have on its PATH. That is why the pack lane is Python, not Vale.
#
# THE STOCK PACKS ARE DELIBERATELY ABSENT. A trial on 2026-08-08 ran write-good and
# proselint over 312,886 words of engine prose and measured 12,524 findings, of which
# 11,980 (95.7%) were noise:
#
#   write-good.E-Prime   6,831   objects to the word "is"
#   write-good.Passive   2,211   passive voice in analytical prose is correct
#   Vale.Spelling        1,866   549 distinct tokens, dominated by brand names
#                                (Deliveroo, Checkatrade, Xero), UK institutions
#                                (HMRC's, DWP's, DVSA's) and UK spellings (anonymised)
#   proselint.GenderBias    95   wanted "Ombudsman" -> "ombuds". That is the legal name
#                                of a UK statutory body; on a source-or-die storefront
#                                rewriting it corrupts a cited fact.
#
# HOUSE_WRITING_SPEC.md Part Six asks for `Packages = proselint, write-good`. It is not
# set here, and the measurement above is the reason: 95.7% noise buries the 4.3% that is
# real. Re-add a stock pack only with a measurement showing its precision on THIS corpus.
#
# Only rules with a demonstrated buyer-visible failure are enabled. Per-format scoping
# below is measured, not assumed — 2026-08-15, over store_platform/src/Store.Web/src:
#
#   rule            findings on .tsx   verdict
#   Semicolon                    560   every one a TypeScript statement terminator. OFF.
#   OrphanClause                  28   every non-test hit is a code comment opening
#                                      "That is ...". OFF on code, ON for markdown.
#   SentenceLength                 0   structurally inert: `scope: sentence` needs prose
#                                      segmentation, which Vale does not do for .tsx. OFF.
#   Register                      38   real buyer copy among them -- "Unlock" x6 in
#                                      PackBuyButton.tsx, "at scale" in
#                                      HeroEvidenceStrip.tsx, "leverage" in copyConfig.ts.
#                                      ON, accepting identifier false positives
#                                      (`moat` in config.ts) as the price.
#   VagueQuantity                  0   ON anyway: zero findings is the state worth keeping.
#   HouseDashes                    2   ON, unchanged.

StylesPath = styles
MinAlertLevel = error
Vocab = Mumchimp

# Prose. Every rule applies, because these files are read as English.
[*.md]
BasedOnStyles = Mumchimp

# Code carrying buyer-visible strings. Three rules are switched off above on measured
# false-positive rates, not on taste.
[*.{tsx,ts}]
BasedOnStyles = Mumchimp
Mumchimp.Semicolon = NO
Mumchimp.OrphanClause = NO
Mumchimp.SentenceLength = NO
