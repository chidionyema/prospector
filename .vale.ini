# Vale — the MARKETING copy lane (storefront .tsx, docs, kill log).
#
# Pack copy is gated in Python on the publish path (prospector/copy_lint.py). This file
# covers the copy that never passes through that gate: hardcoded storefront prose.
#
# THE STOCK PACKS ARE DELIBERATELY ABSENT. A trial on 2026-08-08 ran write-good and
# proselint over 312,886 words of engine prose and measured 12,524 findings, of which
# 11,980 (95.7%) were noise:
#
#   write-good.E-Prime   6,831   objects to the word "is"
#   write-good.Passive   2,211   passive voice in analytical prose is correct
#   Vale.Spelling        1,866   549 distinct tokens, dominated by brand names
#                                (Deliveroo, Checkatrade, Xero), UK institutions
#                                (HMRC's, DWP's, DVSA's) and UK spellings (anonymised)
#   proselint.GenderBias    95   wanted "Ombudsman" -> "ombuds". That is the legal name
#                                of a UK statutory body; on a source-or-die storefront
#                                rewriting it corrupts a cited fact.
#
# Only rules with a demonstrated buyer-visible failure are enabled. Re-add a stock pack
# only with a measurement showing its precision on THIS corpus.

StylesPath = styles
MinAlertLevel = error
Vocab = Mumchimp

[*.{tsx,ts,md}]
BasedOnStyles = Mumchimp
