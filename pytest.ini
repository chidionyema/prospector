[pytest]
# `pythonpath` (pytest >= 7) puts the repo root on sys.path for collection, so
# `.venv/bin/pytest tests/unit -q` works on its own. Without it every invocation needed
# PYTHONPATH=<repo> or died at tests/conftest.py:5 with
# `ModuleNotFoundError: No module named 'prospector'` — a failure that reads like a broken
# test suite rather than a missing environment variable, and one that every new checkout,
# worktree and CI job hits before it runs a single assertion.
#
# Not an editable install: `pip install -e .` would need a pyproject/setup.py this repo does
# not have, and would put a second, stale copy of the package on the path of every process
# that shares this .venv — including the live daemon.
pythonpath = .
testpaths = tests

# RUN IN PARALLEL BY DEFAULT. `pytest-xdist` has been in this .venv the whole time and nothing
# ever asked for it, so every invocation — CI, the POPDD gate, a human checking one change —
# paid the serial number on a 12-core machine.
#
# Measured 2026-08-15 on the full tree: 3689 passed, 4 skipped in 493s (8m13s) at `-n 8`,
# against the ~3185s serial figure on record. That serial number is the whole reason the
# pre-commit gate is disabled (CLAUDE.md: ~3185s against the gate's 2400s ceiling, so every
# commit paid ~40 minutes to be REFUSED). It is now comfortably inside that ceiling; whether
# to re-arm the gate is a separate decision and deliberately not taken here.
#
# `--dist loadfile`, not the default `load`: it keeps every test in a file on ONE worker.
# This suite has module-scoped fixtures and, more importantly, PROCESS-GLOBAL state that is
# real production behaviour rather than a test smell — `operator._MOAT_PRIMARY` is written by
# `config.load_config` and read by every trust decision (operator.py:1362-1396). Splitting a
# file across workers would turn that into phantom reds that reproduce nowhere, which is the
# expensive kind of flake: it accuses the component instead of the harness. `loadfile` gives
# the parallelism without changing what any single file observes.
#
# `-n auto` rather than a pinned 8, so a 2-core CI box does not spawn 8 workers and thrash.
# Measured on this 12-core machine: 493s at `-n 8`, 324s at `-n auto`.
#
# Turning this on found one real defect rather than merely going faster, and it is worth
# knowing about before adding another: `test_a_huge_page_is_selected_in_reasonable_time`
# asserted a CPU-cost property using `time.monotonic()`, so it passed serially and at 8
# workers and FAILED at 12 — on identical code, purely from being descheduled. It now measures
# `time.process_time()`. Any test that asserts a duration must measure CPU, not wall clock, or
# parallelism will make it a coin toss and the fix will look like "raise the budget".
#
# ORIGIN, and the reason this line is here rather than only in the checkout that wrote it:
# a concurrent session measured all of the above and left it UNCOMMITTED in the main
# checkout's working tree, where it made exactly one tree fast. Every other worktree, every
# agent, every CI job and this branch went on paying the serial number — this session lost 40
# minutes to it before looking. An uncommitted config enforces nothing; committing it is the
# enforcement. If that session commits the identical block, git resolves it as the same patch.
addopts = -n auto --dist loadfile

# Delete a passing test's `tmp_path` as soon as it passes, instead of keeping the last three
# WHOLE SESSIONS' worth (pytest's default `all` + `tmp_path_retention_count = 3`).
#
# Measured 2026-08-13, and it is why the POPDD commit gate looked like a hang: the suite had
# accumulated eight session roots under `$TMPDIR/pytest-of-<user>/`, two of them holding 4,296
# and 3,339 directories, and every new session begins by DELETING the roots that fall off the
# end of the retention window. A `sample` of the wedged process showed it in
# `os_scandir`/`os_unlink`/`os_stat` with 9m48s of CPU against 66m of wall clock — not
# computing, just unlinking, before a single test had run (stdout was still 0 bytes). The
# gate then reported `step 'pytest' exceeded 2400s`, which reads as a slow test suite and is
# not one.
#
# `failed` keeps exactly what a human would want to look at — the tmp tree of a test that
# failed — and pays the cleanup incrementally per test rather than in one unbounded sweep at
# the start of the next run.
tmp_path_retention_policy = failed
