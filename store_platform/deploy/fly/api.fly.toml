# Store.Api on Fly.io. See store_platform/deploy/PROD_DEPLOY.md for the full runbook.
#
# Deploy from store_platform/ so the build context (the `.`) includes local-feed/ + Store.Catalog:
#   fly deploy . --config deploy/fly/api.fly.toml
# `dockerfile` below is relative to THIS file's directory (deploy/fly/), hence the ../../ climb
# back to the context root — the same convention as web.fly.toml and api.staging.fly.toml.
#
# Do not "fix" this path from a deploy error alone. On 2026-08-01 CI failed with
#   dockerfile '/home/runner/work/prospector/src/Store.Api/Dockerfile' not found
# and this value was changed to match, which changed nothing: the real fault was that flyctl had
# loaded NO config file at all (it resolves --config relative to the working-directory argument)
# and was building from the app's REMOTE config. The log line that says so is
#   Validating --config path unset--
# Check for that line before believing an error is about this value. CI now also passes
# --dockerfile explicitly, so what gets built comes from the checkout, not from Fly's copy.
#
# Secrets (Stripe keys, R2, internal keys) are set with `fly secrets set ...`, NOT here.
# This file holds only non-secret config.

app = "prospector-store-api"          # rename to your Fly app name
primary_region = "lhr"                # pick your region

[build]
  dockerfile = "../../src/Store.Api/Dockerfile"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  ConnectionStrings__DefaultConnection = "Data Source=/data/store.db"
  payments__active_provider = "stripe"
  # The STOREFRONT base that user-facing links are built from: the email verification,
  # password-reset and resend links (EmailOptions.WebBaseUrl, src/Store.Api/Common/EmailOptions.cs)
  # and the post-consent OAuth landing (SafeRedirect in Auth/ExternalAuthEndpoints.cs).
  #
  # It lives HERE and not in `fly secrets` because it is a public URL with a DANGEROUS default:
  # unset, the code falls back to http://localhost:3000. On 2026-08-01 production ran that way —
  # every verification and reset email pointed at the buyer's own machine, and because order
  # history is gated on EmailConfirmed, nobody who signed up could ever reach their orders. It
  # failed silently: the API is healthy, the mail sends, only the link is wrong. A hand-set secret
  # is exactly the thing a fresh environment forgets, so the correct value ships with the config.
  #
  # Not the API host — that is STORE_PUBLIC_URL, which serves /orders/{token}.
  # Changing domains: scripts/switch_domain.sh sets this as a secret, which overrides this line.
  Email__WebBaseUrl = "https://mumchimp.com"

# Persistent SQLite catalogue/orders db. SQLite is a SINGLE-WRITER store, so this app must run
# exactly ONE machine — do not scale the count above 1.
[mounts]
  source = "store_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Always-on: Stripe webhooks must reach a live machine, and SQLite cannot be shared across
  # several machines. Keep one machine up; never autoscale to many.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "get"
    path = "/catalog"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
