# Store.Web on Fly.io. See store_platform/deploy/PROD_DEPLOY.md for the full runbook.
#
# Deploy from src/Store.Web (its own self-contained build context = the `.`):
#   fly deploy . --config ../../deploy/fly/web.fly.toml \
#     --build-arg NEXT_PUBLIC_API_URL=https://prospector-store-api.fly.dev
# The `.` sets the build context to src/Store.Web; `dockerfile` below is resolved relative to THIS
# config file's directory (deploy/fly/), hence the ../../ climb back to the Store.Web Dockerfile.
#
# NEXT_PUBLIC_API_URL is baked into the bundle at build time, so it is passed as a --build-arg
# on every deploy (use your real Store.Api public URL), not stored as a runtime secret.

app = "prospector-store-web"          # rename to your Fly app name
primary_region = "lhr"                # match the API region

[build]
  dockerfile = "../../src/Store.Web/Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  # Stateless front end, so scaling to zero is SAFE -- but it was not free, and the bill was paid
  # by the visitor, not by us. Measured on prod 2026-08-14, immediately after the v146 deploy:
  #
  #   first hit after idle   ttfb 9.216s
  #   every hit after that   ttfb 1.118s   (of which the SERVER is 0.086s -- the rest is
  #                                         DNS+TCP+TLS setup, identical on api.mumchimp.com,
  #                                         i.e. distance to lhr, not our code)
  #
  # 9.2 seconds is a cold machine boot, and it lands on exactly the visitor who matters most: the
  # one arriving from a link, on a shop whose whole proposition is that it did the work already.
  # No amount of bundle trimming touches it -- the JS had not been asked for yet.
  #
  # One warm machine costs ~$2/month at this size. `auto_stop_machines` stays on so the SECOND
  # machine still parks itself when traffic is thin; `min_machines_running = 1` only forbids the
  # last one from going down. Revert to 0 and the 9.2s comes straight back.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
