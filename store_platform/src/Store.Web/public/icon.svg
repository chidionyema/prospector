<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 26 26" role="img" aria-label="Mumchimp">
  <!-- The brand mark, mirroring Logo.tsx's `BrandMark` stratum for stratum: the same three path
       strings, so the tab-strip icon and the header lockup cannot drift apart.

       THE SHAPE IS THE ONE IN THE BRIEF (2026-08-18). Both files used to carry a 100x100 redrawing
       of the funnel whose edges ran (3,6)-(97,6) down to (37,94)-(63,94). The mockups
       (docs/design/mumchimp-build-bundle/mockups/*.html, all twelve, header and footer) draw a
       different funnel: three trapezoids on a 26-wide canvas, tapering to a point rather than
       finishing on a bar. Same idea, and not the same drawing, which is the only thing a logo has
       to get right.

       SQUARE BOX, SAME DRAWING. The lockup's box is 26x24, the mark's own proportions. A favicon is
       rendered into a square slot, so this file pads the box to 26x26 and translates the drawing
       0.75 down, which centres it exactly. The three `d` strings are byte-identical to BrandMark's
       and the parity test compares them directly; only the padding differs, and it has to.

       SOLID SLABS, NOT KNOCKOUTS. An earlier tile knocked its bands out in white, which is only
       correct on a white ground; in a favicon those white bars would show against a dark browser
       tab strip. Three closed paths in one colour have no dependency on the surface behind them.

       TEAL, NOT INK (founder review, 2026-08-16, viewing the live tab next to Gmail and Mail). At
       16px, three near-black slabs on a white tab carry no hue at all, so the tab read as a grey
       smudge and two Mumchimp tabs were indistinguishable from each other. The teal is on screen
       nowhere else on first paint, so it is the one thing that identifies the product before a
       word is read. The value is #14706A, the mockups' fill and the same teal as the survived
       verdict; it was #0F766E, a shade off, invisible alone and obvious side by side. -->
  <g transform="translate(0 .75)">
    <path d="M1 2h24l-4.1 5H5.1L1 2Z" fill="#14706A" />
    <path d="M6.2 9.5h13.6l-3.3 5H9.5l-3.3-5Z" fill="#14706A" />
    <path d="M10.7 17h4.6L13 22.5 10.7 17Z" fill="#14706A" />
  </g>
</svg>
