<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Mumchimp">
  <!-- The brand mark, mirroring Logo.tsx's `BrandMark` EXACTLY: same viewBox, same radius, same
       three band rects, so the tab-strip icon and the header lockup cannot drift apart. It was a
       white "M" on the ink field; a single letter is shared with several thousand other sites,
       and the strata tile is the one shape this brand owns. Ink is #171717 (bg-text) and the
       bands are knocked out in white, which is the page ground the lockup sits on. -->
  <rect width="100" height="100" rx="22" fill="#171717" />
  <rect x="18" y="24" width="64" height="12" rx="3" fill="#ffffff" />
  <rect x="18" y="44" width="40" height="12" rx="3" fill="#ffffff" />
  <rect x="18" y="64" width="56" height="12" rx="3" fill="#ffffff" />
</svg>
