# The product's entry in the estate catalogue (crew#282, founder 2026-08-26: "every interface
# /ui needs exposure"). The platform's Backstage reads this file by URL from the repo, so the
# product carries its own entity and the platform is never edited to add a product. The links
# are the hostnames of deploy/k8s/base/edge.yaml; tests/unit/test_catalog_info_names_every_edge_hostname.py
# refuses a hostname the edge serves that this file does not name.
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: prospector
  description: Mumchimp store and the prospector research engine behind it
spec:
  owner: user:default/chidionyema
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: prospector-store-web
  description: The storefront a buyer sees
  annotations:
    github.com/project-slug: chidionyema/prospector
  links:
    - title: Open
      url: https://${ESTATE_ZONE}
    - title: Open (www)
      url: https://www.${ESTATE_ZONE}
spec:
  type: website
  lifecycle: production
  owner: user:default/chidionyema
  system: prospector
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: prospector-store-api
  description: The store API, catalogue, checkout, entitlements and delivery
  annotations:
    github.com/project-slug: chidionyema/prospector
  links:
    - title: Open
      url: https://api.${ESTATE_ZONE}
spec:
  type: service
  lifecycle: production
  owner: user:default/chidionyema
  system: prospector
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: prospector-scheduler
  description: Re-verification scheduler (run_scheduled --daemon) on the cluster; ticks land in store/scheduler/ticks.jsonl
  annotations:
    github.com/project-slug: chidionyema/prospector
spec:
  type: service
  lifecycle: production
  owner: user:default/chidionyema
  system: prospector
