; The engine's process table. This file replaces five launchd plists, one for one.
;
; It is provider-neutral on purpose. Fly runs it, `docker compose up` runs it, and a
; third provider will run it, because it names commands and intervals and nothing about
; where the machine is.
;
; Why one supervisor rather than five Fly process groups: Fly gives each process group
; its own MACHINE, and a machine gets its own volume. The store is single-writer SQLite
; plus append-only JSONL. Five machines would mean five stores, a forked spend ledger and
; a daily cap that counts a fifth of the spend. One machine, one volume, one supervisor.

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
; supervisord refuses to run as root without this, and the container has no other user.
user=root

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; `supervisorctl status` is how the ops console will ask what is running, replacing
; `launchctl list | grep com.prospector`.
[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; Every program logs to the container's stdout/stderr. On Fly that is `fly logs`; under
; compose it is `docker compose logs`. The launchd version wrote to files under store/,
; which put log growth on the same volume as the catalogue.
[program:scheduler]
command=python -m prospector.scheduler.run_scheduled --daemon --interval 7200 --config /app/config.yaml
directory=/app
autostart=true
autorestart=true
startsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; Priority orders STARTUP only. The scheduler comes up first so that a cold machine
; establishes the PAUSE/backlog state before the consumer starts draining.
priority=10

[program:consumer]
command=python -m prospector.run --config /app/config.yaml consume --publish
directory=/app
autostart=true
autorestart=true
startsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

; launchd ran this at StartInterval=900 with RunAtLoad=1. Same shape here.
[program:watchdog]
command=/usr/local/bin/periodic.sh 900 /usr/local/bin/receipt.sh prospector.scheduler.run_scheduled python -m prospector.scheduler.run_scheduled --watchdog --config /app/config.yaml
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30

; launchd ran both backups on a StartCalendarInterval (03:40 and 03:50). A daily loop is
; not the same thing — it drifts with restarts — and that is acceptable here and stated
; rather than hidden: what matters is a backup every ~24h and an offsite copy shortly
; after it, not the wall-clock hour. The offsite job's own dated R2 key is what makes a
; drifted run harmless.
;
; ENGINE_BACKUPS_ENABLED gates BOTH, as the literal string `true` or `false` (supervisor
; parses autostart as a boolean, so `1` is not accepted; the entrypoint normalises it).
; It defaults to false so that a second copy of this image — a laptop failback, a staging
; box, a `docker compose up` on a developer machine — cannot write to the same R2 bucket
; as production. Exactly one side sets it true.
[program:backup]
command=/usr/local/bin/periodic.sh 86400 /usr/local/bin/receipt.sh backup_store.py python scripts/backup_store.py
directory=/app
autostart=%(ENV_ENGINE_BACKUPS_ENABLED)s
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=40

; This one is not just the engine's own backup. Its declaration
; (ops/config/offsite_backup.yaml) also pulls /data/store.db and the ASP.NET key ring off
; prospector-store-api — the only record of who bought what. That job runs on the FOUNDER'S
; LAPTOP today, so switching the laptop off after the migration would have switched the
; only backup of the money database off with it, silently. It moves here for that reason.
;
; It shells out to `fly ssh sftp`, so this container needs flyctl (installed in the
; Dockerfile) and FLY_API_TOKEN in its environment. Without the token the money-db source
; fails and `check` goes red, which is the correct loud failure rather than a silent gap.
[program:offsite-backup]
command=/usr/local/bin/periodic.sh 86400 python -m ops.automations.offsite_backup --fix
directory=/app
autostart=%(ENV_ENGINE_BACKUPS_ENABLED)s
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=50

; The drill is the only thing that turns a backup into a recovery. It was written, wired into
; the Data screen and never scheduled anywhere, so `store/ops/restore_drill.json` did not exist
; and that screen read "the restore has never been proven end to end" — correctly.
;
; Weekly, not quarterly. `prospector/ops/data.py` goes amber at DRILL_STALE_DAYS=90; a weekly
; cadence keeps a fresh receipt with twelve chances to notice before the screen turns.
;
; It is deliberately NOT gated on ENGINE_BACKUPS_ENABLED. That flag exists to stop a second copy
; of this image writing to the production R2 bucket; the drill takes a local snapshot into a
; temp directory and touches no bucket, so a staging box proving its own restore is a good thing.
;
; The receipt.sh key `restore_drill.py` matches no capability in ~/.hermes/capabilities.json
; today, so Hermes does not grade it. The wrapper is still worth it: the receipt is a durable
; exit code on the volume, and the screen's own answer comes from store/ops/restore_drill.json,
; which the script writes itself.
[program:restore-drill]
command=/usr/local/bin/periodic.sh 604800 /usr/local/bin/receipt.sh restore_drill.py python scripts/restore_drill.py
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=55

; ---------------------------------------------------------------------------
; The admin dashboard. Founder, 2026-08-18: "they need to move to fly, nothing business
; critical can run off this laptop."
;
; It reads the store as a DIRECTORY, so it has to sit on the machine that holds it. Left
; on the laptop it would have gone on rendering a store that had stopped changing and
; never said so.
;
; There is no `control-center` program here. The Streamlit console is being deleted —
; founder, 2026-08-18: "streamlit control centre needs to be deleted permanently, both
; code and everything". The Next.js ops console replaces it and is the only dashboard.
;
; It binds 0.0.0.0, and that is safe here rather than sloppy: the app has NO public IP
; (deploy/engine/fly.toml has no [http_service]), so the only route in is the private
; Bind `::`, not `0.0.0.0`. Fly's private network is IPv6 only, so a socket on the IPv4
; wildcard accepts nothing from `fly proxy`. Measured 2026-08-18: the console answered
; HTTP 200 on 127.0.0.1:8611 inside the container while every proxied request timed out,
; and /proc/net/tcp6 had no listener on 8611 at all. `::` is dual stack on Linux.
; network — `fly proxy 8611:8611 -a prospector-engine`. Binding 127.0.0.1 instead would
; break that, because fly proxy connects to the machine's private address, not its
; loopback. On a plain Docker host the equivalent fence is publishing the port to
; 127.0.0.1 on the host, which deploy/targets/sshdocker.sh does.
; ---------------------------------------------------------------------------
[program:ops-console]
command=node node_modules/next/dist/bin/next start -H :: -p 8611
directory=/app/store_platform/src/Ops.Console
autostart=true
autorestart=true
startsecs=10
environment=NODE_ENV="production",PROSPECTOR_PYTHON="/usr/local/bin/python",PROSPECTOR_ROOT="/app"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=70
