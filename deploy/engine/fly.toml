# The engine on Fly. Addresses and sizes only — every behaviour is in the image, which is
# the property that makes this repeatable to a third provider. Moving hosts means writing
# the equivalent 40 lines for the new provider, not porting the engine.
#
# `[http_service]` publishes ONE port: 8611, the ops console. Nothing else in this image
# listens on a public port. The scheduler, consumer, watchdog and both backups only make
# outbound calls and write a volume.
#
# It was deliberately absent until 2026-08-18, and the console was reached over
# `fly proxy` from the founder's laptop instead. Founder, 2026-08-18: "relying on a tunnel
# on this macbook to run operations is not smart". That is right, and the old arrangement
# contradicted the point of the migration: a dashboard whose only door runs on the laptop
# goes dark the moment the laptop does. The engine had moved and the ability to SEE it had
# not.
#
# What stands between the internet and a console that can restart the daemon and publish to
# the shelf: TLS terminated by Fly with force_https; one shared password compared
# timing-safely on the server; an HttpOnly, SameSite=Strict, Secure session cookie signed
# with that password as the HMAC key; and a five-strikes-per-address limiter on the sign-in
# route (Ops.Console/src/lib/ratelimit.ts). With no password set the console refuses
# everything — it fails closed, never open.

app = "prospector-engine"
primary_region = "lhr"

# HOW LONG THE MACHINE GETS TO STOP. Both keys were absent until 2026-08-21, so Fly's
# defaults applied: SIGINT, then SIGKILL five seconds later.
#
# Five seconds is shorter than the shutdown this image asks for. PID 1 is supervisord,
# which forwards the signal to eleven programs and waits `stopwaitsecs` for each; the
# consumer alone is given 30 (supervisord.conf, [program:consumer]). So the graceful path
# could never finish, and every deploy ended with SIGKILL to the whole microVM.
#
# What that cost: prospector.jsonl is the spend ledger, written by a stdlib logging
# handler that flushes to the OS and never calls fsync. A SIGKILLed VM never syncs its
# page cache, but the inode size has already grown, so the filesystem returns NUL bytes
# for the extent that never reached disk. Measured 2026-08-21 on the restored R2 copy:
# 43 NUL holes, every one of them immediately followed by a `consumer: starting` line.
# Zero holes on 16-17 August, 15 in 18 starts today. The machine was created
# 2026-08-18T02:09:03Z and the first hole is 08:47:09 the same day.
#
# 45s, not longer: `[deploy] strategy = "immediate"` means a deploy replaces the machine
# without waiting for health, so this timeout is the whole of the deploy's stop budget.
# It must exceed the consumer's 30s and leave room for the other ten programs.
kill_signal = "SIGTERM"
kill_timeout = "45s"

[build]
  dockerfile = "Dockerfile"

[env]
  PROSPECTOR_STORE_DIR = "/data/store"
  PROSPECTOR_USAGE_WALL_MARKER = "/data/state/claude_usage_limit.json"
  CLAUDE_CONFIG_DIR = "/data/state/claude"
  # Production is the one side that writes the R2 bucket. The laptop failback leaves this
  # unset, so a machine brought back up for a drill cannot overwrite the offsite copy of
  # the store it is being restored FROM.
  ENGINE_BACKUPS_ENABLED = "true"
  # The storefront API. On the laptop this defaulted to http://localhost:5291
  # (prospector/bridge.py:610), which in a container resolves to the container itself and
  # would fail every publish with a connection refused that reads like an API outage.
  # STORE_API_URL is api.<ESTATE_ZONE>; the zone is declared once in the platform and Fly is retired
# (founder ruling R1), so this file carries no live hostname (crew#796). The compose and Kubernetes
# manifests set it from ${ESTATE_ZONE}.
  # Our own metasearch, deployed by deploy/searxng/. It has NO public IP; .internal is Fly's
  # private 6PN network, so only apps in this org can reach it. It is declared here rather than
  # left as a hand-set `fly secrets` value because a hostname is not a secret, and because a
  # rebuild of this app from the repo has to bring grounding back with it. Without this the
  # provider falls back to localhost:8080 (retrieval.py:1388), which in a container is the
  # container itself, and every search dies with a connection refused.
  SEARXNG_URL = "http://prospector-searxng.internal:8080"

# The ops console, and nothing else.
[http_service]
  internal_port = 8611
  force_https = true
  # The engine is a cadence, not a request-driven service. A stopped machine does not
  # generate, so whether anyone is looking at the console must never decide whether the
  # engine runs. Both autoscaling switches are off and one machine always stays up.
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 50
    soft_limit = 25

[mounts]
  source = "prospector_store"
  destination = "/data"

# ONE machine. Not a preference — the store is single-writer SQLite plus append-only
# JSONL, and the daily spend cap is computed by reading that ledger. Two machines would
# each have their own volume, each count their own share of the spend against the same
# $100 cap, and each publish to the same live Stripe account. `bridge.py` mints a Price
# and writes the catalogue row in one decision; two engines means two Prices for one
# product.
[[vm]]
  size = "shared-cpu-2x"
  memory = "4gb"

# auto_stop would suspend the machine between requests. There are no requests: the
# scheduler is a cadence, not a service. A stopped machine simply does not generate.
[deploy]
  strategy = "immediate"
