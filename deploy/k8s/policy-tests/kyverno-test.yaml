# Kyverno's own test format, run by `kyverno test`. Not a script this estate wrote.
#
# WHY THIS EXISTS. Until 2026-08-24 the policy set had been proved to BUILD - 26 policies,
# all Enforce, both overlays identical - and never once proved to DECIDE. A policy that
# builds is a policy nobody has watched refuse anything. This file is the difference, and it
# needs no cluster: the Kyverno CLI runs the same admission engine offline, so the decision
# is made by the thing that will make it in production rather than by a reading of the YAML.
#
# The CLI is pinned to the version the cluster installs (v1.16.1, `KYVERNO_VERSION` in
# deploy/rehearse_cluster.sh), NOT to latest. A CLI on a different engine version answers a
# different question than the one the cluster will be asked.
#
# WHAT IT STILL DOES NOT PROVE. That the admission webhook is reachable, that the policies
# were actually installed, that the cluster is not running them in Audit. Those need a live
# API server and stay open as register row F-47. This is one angle of the two LAW 15 wants,
# and it is the cheap one.
#
# Each row below is a pairing: this resource, refused by this rule of this policy. The
# pairing is the assertion. A test that only checked "something refused it" would still pass
# on the day the intended policy stopped loading and an unrelated one caught it by accident.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: prospector-standards
policies:
  # Generated by the gate immediately before this runs, with
  #   kubectl kustomize deploy/k8s/policies
  # rather than committed, so the test can never drift from the policy set that ships. The
  # policies kustomization is used and not an overlay, because an overlay also emits the
  # Namespace, and the CLI silently loads ZERO rules from a file carrying a non-policy
  # document - reporting `pass: 0, fail: 0, error: 0`, which reads exactly like success.
  # That was measured on 2026-08-24 and it is why the gate asserts a rule count.
  - policies.generated.yaml
resources:
  - refused.yaml
results:
  - policy: disallow-latest-tag
    rule: autogen-validate-image-tag
    resources: [latest-tag]
    kind: Deployment
    result: fail

  - policy: require-requests-limits
    rule: autogen-validate-resources
    resources: [no-resources]
    kind: Deployment
    result: fail

  - policy: require-pod-probes
    rule: autogen-validate-probes
    resources: [no-probes]
    kind: Deployment
    result: fail

  # Two policies catch this one, and both are asserted rather than one being dropped as
  # duplication. `disallow-capabilities-strict` arrives with pod-security/restricted and
  # `drop-all-capabilities` with best-practices. The overlap is deliberate: it is the
  # difference between a rule being enforced and a rule happening to be enforced by a
  # library that could drop it in a future release.
  - policy: disallow-capabilities-strict
    rule: autogen-require-drop-all
    resources: [keeps-caps]
    kind: Deployment
    result: fail

  - policy: drop-all-capabilities
    rule: autogen-require-drop-all
    resources: [keeps-caps]
    kind: Deployment
    result: fail

  - policy: require-ro-rootfs
    rule: autogen-validate-readOnlyRootFilesystem
    resources: [writable-rootfs]
    kind: Deployment
    result: fail

  - policy: disallow-privileged-containers
    rule: autogen-privileged-containers
    resources: [privileged]
    kind: Deployment
    result: fail

  - policy: require-run-as-nonroot
    rule: autogen-run-as-non-root
    resources: [runs-as-root]
    kind: Deployment
    result: fail

  # The two estate rules. No upstream library can know that this business has one SQLite
  # writer and a daily spend cap, so these are the two that stayed hand-written when the
  # other five were retired in favour of upstream.
  - policy: money-rail-single-writer
    rule: single-writer-workloads-run-exactly-one-replica
    resources: [two-writers]
    kind: Deployment
    result: fail

  - policy: money-rail-single-writer
    rule: single-writer-deployments-recreate-never-rollingupdate
    resources: [rolling-writer]
    kind: Deployment
    result: fail

  - policy: secrets-not-from-env-vars
    rule: autogen-secrets-not-from-envfrom
    resources: [secret-in-env]
    kind: Deployment
    result: fail

  # `optional-secret` trips both, and both are asserted because that is what happens. A
  # secret cannot be optional without first being an environment variable, so upstream's
  # rule fires too. The estate's rule is therefore unreachable while upstream's is enforced,
  # which is written down here rather than discovered by someone deleting it as dead.
  - policy: no-optional-secret-references
    rule: autogen-envfrom-secretref-must-not-be-optional
    resources: [optional-secret]
    kind: Deployment
    result: fail

  - policy: secrets-not-from-env-vars
    rule: autogen-secrets-not-from-envfrom
    resources: [optional-secret]
    kind: Deployment
    result: fail
