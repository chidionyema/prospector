# Eleven manifests, each one copy of admitted.yaml with exactly one thing wrong.
#
# One violation per manifest is the point. A fixture that breaks five rules at once proves
# only that SOMETHING refused it, and would still pass on the day four of the five policies
# silently stopped loading. Each resource below names the single policy that must catch it,
# and kyverno-test.yaml asserts that pairing rule by rule.
#
# Two of these break two rules and it is recorded rather than hidden: `optional-secret`
# trips the estate's own rule AND upstream's, because a secret cannot be optional without
# first being an environment variable. That makes the estate's rule unreachable while
# upstream's is enforced. It is kept anyway - it costs nothing, it names the incident in its
# own message, and it is the one that still stands if upstream ever relaxes.
---
# latest-tag: an image tag that moves, so the manifest stops describing what runs
apiVersion: apps/v1
kind: Deployment
metadata:
  name: latest-tag
  namespace: prospector
  labels:
    prospector.estate/single-writer: 'true'
  annotations:
    prospector.estate/violation: an image tag that moves, so the manifest stops describing
      what runs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: money-rail
  template:
    metadata:
      labels:
        app: money-rail
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: secrets
        secret:
          secretName: engine-secrets
          optional: false
      - name: tmp
        emptyDir: {}
      containers:
      - name: engine
        image: ghcr.io/chidionyema/prospector-engine:latest
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
        env:
        - name: PROSPECTOR_SECRETS_DIR
          value: /var/run/secrets/prospector
        volumeMounts:
        - name: secrets
          mountPath: /var/run/secrets/prospector
          readOnly: true
        - name: tmp
          mountPath: /tmp

