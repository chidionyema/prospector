# What is true in EVERY environment. An overlay may change an image tag, a hostname, a replica count
# or which Secret is referenced. An overlay may never change a policy: staging with softer rules
# proves nothing about production.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml

# NOT YET HERE, and not pretended otherwise. The engine, shop, api, web and edge workloads are still
# generated by deploy/targets/k8s.sh rather than declared. Register row F-39 in
# docs/MIGRATION_AND_DR_PROGRAM.md carries the move; until it lands, this base declares the
# namespace and its security level and nothing else.
