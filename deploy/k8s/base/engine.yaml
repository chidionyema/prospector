# The engine, declared. This replaces the Deployment that deploy/targets/k8s.sh writes inline at
# t_start. Register row F-39.
#
# WHY IT MOVED. The adapter's version was measured against this estate's own 26 admission policies
# on 2026-08-24 and refused by ten of them:
#
#   disallow-latest-tag            disallow-privilege-escalation   drop-all-capabilities
#   require-pod-probes             require-requests-limits         require-ro-rootfs
#   require-run-as-nonroot         restrict-seccomp-strict         secrets-not-from-env-vars
#   (pass: 19, fail: 10)
#
# The only Kubernetes deployment path the estate had would not have been admitted to the cluster
# the estate is building. That is not a manifest bug; it is what happens when the standards are
# written after the deploy script. This file is written from
# deploy/k8s/policy-tests/admitted.yaml, which is the shape proved to pass, and the CI gate grades
# this build the same way so it cannot drift back.
#
# WHAT IS STILL NOT TRUE. Read this before applying it anywhere:
#
#   1. CLOSED 2026-08-24. The engine reads these secrets. prospector/file_secrets.py copies
#      every file in $PROSPECTOR_SECRETS_DIR into os.environ from prospector/__init__.py, before
#      any module in the package runs, so the 30 files that read os.environ for a credential
#      needed no change. It refuses to start on a missing mount, an empty mount, an unreadable
#      file or a name no shell could read, because half a credential set is the incident it
#      exists to prevent. Proved by tests/test_incident_secrets_mounted_as_files.py.
#      The writer side already existed: deploy/targets/k8s.sh:115 creates this Secret with
#      --from-env-file, which is one key per variable, which mounts as one file per variable.
#   2. THE IMAGE DOES NOT RUN AS NON-ROOT YET, and the drill has now said exactly why. Run
#      2026-08-24 against prospector-engine:local with --user 10001:10001 --read-only, an
#      emptyDir at /tmp and the secrets mounted as files. Three blockers, each measured:
#        a. supervisord refused outright: "Error: Can't drop privilege as nonroot user", because
#           deploy/engine/supervisord.conf sets user=root. No program ever started. THIS IS AN
#           IMAGE CHANGE AND IT IS NOT MADE YET — see the note in supervisord.conf.
#        b. HOME=/, which uid 10001 cannot write. Fixed here by the HOME env var below.
#        c. .next/cache is root-owned and mode 755, and a read-only root filesystem means no
#           chown in the image can help. Fixed here by the console-cache emptyDir below.
#      With all three worked around, supervisord and eight of its nine programs reached RUNNING
#      as uid 10001 with a read-only root, and the log carried no permission, EACCES, EROFS or
#      read-only error of any kind.
#   2a. THE CONSOLE UNDER THESE CONSTRAINTS IS NOW PROVED, and it was NOT on 2026-08-24 morning.
#      The earlier drill started `next start` from a shell inside the container and saw an empty
#      log, nothing listening and no process, which is why this comment used to read "NOT
#      proved". Re-run 2026-08-24 with node as the container's PID 1 -- `docker run --user
#      10001:10001 --read-only`, tmpfs at /tmp and at .next/cache, HOME=/tmp, TMPDIR=/tmp --
#      against a freshly built prospector-engine:local:
#        Next.js 16.3.1 / Network: http://[::]:8611 / Ready in 2.7s
#        Running=true ExitCode=0 OOMKilled=false
#        GET / on the published port -> 307
#      A control arm of the SAME image and command with NO --user and NO --read-only answered
#      307 as well, in 2.1s. The two arms agree, so the 307 is what this app answers on `/`
#      and not a symptom of the constraints (LAW 29: attribute before you repair). A
#      Kubernetes httpGet probe succeeds on any status from 200 to 399, so 307 is a PASS for
#      both probes below, which ask for exactly this path on exactly this port.
#   2b. WHAT IS STILL NOT PROVED IS THE PATH THE POD ACTUALLY TAKES. The pod does not run
#      `next start`; Dockerfile:127-128 makes PID 1 tini -> entrypoint.sh -> supervisor, and
#      supervisord.conf:219 starts the console. Drilled 2026-08-24 with the image's own
#      entrypoint under this file's securityContext: ExitCode=2, log
#      "Error: Can't drop privilege as nonroot user". That is blocker (a) above, unchanged and
#      now measured twice. So the process is proved and the supervision is not, and (a) is the
#      only thing between them.
#   3. NO CLUSTER HAS EVER APPLIED THIS. The build is green; there is no cluster.
#
# Both gaps are real work with a named shape, which is the point of writing the manifest first:
# the standard is now the thing the code has to meet, rather than the other way round.
#
# `namespace: prospector` is written on all three objects rather than left to the overlay's
# namespace transformer. disallow-default-namespace refuses a pod controller that names no
# namespace, so a base without it is refused when graded on its own — measured 2026-08-24, fail 1
# of 31, then pass 31 of 31 with it. Naming it here means base/ is admissible standing alone, and
# the overlays set the same value, which is a no-op rather than a correction.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prospector-data
  namespace: prospector
  labels:
    app.kubernetes.io/name: prospector-engine
    app.kubernetes.io/part-of: prospector
spec:
  # ReadWriteOnce on purpose, and it is the same rule as the Recreate strategy below. One writer is
  # the contract. Asking for ReadWriteMany on a default StorageClass gets a PVC that stays Pending
  # forever with no obvious reason why — the note deploy/targets/k8s.sh already carries.
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prospector-engine
  namespace: prospector
  labels:
    app: prospector-engine
    app.kubernetes.io/name: prospector-engine
    app.kubernetes.io/part-of: prospector
    # This label is what money-rail-single-writer keys on. It makes the two settings below
    # (replicas 1, strategy Recreate) enforced by admission rather than by whoever edits the file
    # next. SQLite has exactly one writer, and two engines is two spend ledgers each honouring the
    # daily cap separately, so a $100 cap silently becomes $200.
    prospector.estate/single-writer: "true"
spec:
  replicas: 1
  strategy:
    # NOT the default. A Deployment's default RollingUpdate starts the replacement pod BEFORE the
    # old one terminates, which breaks the single-writer rule on every single release, and which
    # also deadlocks against a ReadWriteOnce volume with "Multi-Attach error" until the rollout
    # times out. One setting, two failures.
    type: Recreate
  selector:
    matchLabels:
      app: prospector-engine
  template:
    metadata:
      labels:
        app: prospector-engine
        app.kubernetes.io/name: prospector-engine
        prospector.estate/single-writer: "true"
    spec:
      # The engine never calls the Kubernetes API. A mounted token it does not use is a credential
      # sitting in the pod for anything that gets a shell in it.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # Without fsGroup the PVC is owned by root and a non-root process cannot write to /data,
        # which fails as a permission error deep inside the store rather than at startup.
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: engine
          # Never a moving tag. You cannot roll back to a tag that moves, and disallow-latest-tag
          # refuses one anyway. The real tag is set per environment in the overlay's `images:`
          # block, by commit SHA, which makes the git history the deployment audit log. This
          # placeholder is deliberately unpullable so that applying base/ directly fails loudly
          # with ImagePullBackOff instead of quietly running whatever was there before.
          image: ghcr.io/chidionyema/prospector-engine:set-by-an-overlay
          imagePullPolicy: IfNotPresent
          env:
            # Paths and flags only. No secret value appears in this file, in the pod spec, in etcd,
            # or in `kubectl describe pod`.
            - name: PROSPECTOR_SECRETS_DIR
              value: /var/run/secrets/prospector
            - name: PROSPECTOR_STORE_DIR
              value: /data/store
            # With a read-only root filesystem Python cannot write .pyc files next to the source,
            # and it does not need to: they are already in the image.
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            # prospector/claude_cli.py, prospector/pack_data.py, prospector/copy_lint.py and
            # prospector/cli_governor.py all call tempfile.gettempdir(). With readOnlyRootFilesystem
            # that is only writable because of the emptyDir mounted at /tmp below.
            - name: TMPDIR
              value: /tmp
            # MEASURED, not assumed. Running the image as uid 10001 on 2026-08-24 printed
            # `HOME=/`, and uid 10001 cannot write `/`. node and next both write under HOME,
            # so the ops console would fail on a path nothing in this file names. Pointing HOME
            # at the emptyDir below costs one line and needs no second volume.
            - name: HOME
              value: /tmp
          ports:
            - name: console
              containerPort: 8601
            - name: ops
              containerPort: 8611
          # HONEST LIMIT: this probes the Next.js ops console (supervisord.conf:219 runs
          # `next start -H :: -p 8611`). It proves the console answers. It does NOT prove the
          # scheduler, the consumer or the moat are healthy — there is no /healthz on this port to
          # ask, and inventing a path that 404s would CrashLoop the pod while looking like a
          # health check. A real engine health endpoint is the follow-up.
          livenessProbe:
            httpGet:
              path: /
              port: ops
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: ops
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /data
            - name: secrets
              mountPath: /var/run/secrets/prospector
              readOnly: true
            - name: tmp
              mountPath: /tmp
            # `next start` writes its runtime cache here. MEASURED as uid 10001 on 2026-08-24:
            # /app and every directory under it is owned by root and mode 755, so this path is
            # not writable, and a read-only root filesystem means no chown in the image can make
            # it writable either. The build output the console SERVES is in .next/, not
            # .next/cache, so covering the cache directory hides nothing `next start` reads.
            - name: console-cache
              mountPath: /app/store_platform/src/Ops.Console/.next/cache
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: prospector-data
        - name: secrets
          secret:
            secretName: prospector-engine-env
            # optional: false, and no-optional-secret-references enforces it. The 2026-08-24
            # incident written as a setting: compose's `required: false` let a box start carrying
            # none of its 24 settings while the deploy script reported success.
            optional: false
        - name: tmp
          emptyDir: {}
        - name: console-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prospector-engine
  namespace: prospector
  labels:
    backstage.io/kubernetes-id: company-prospector
    app.kubernetes.io/name: prospector-engine
    app.kubernetes.io/part-of: prospector
spec:
  # ClusterIP: reachable inside the cluster and nowhere else. The operator reaches it with
  # `kubectl port-forward`, which is this platform's `fly proxy`. Exposure is an Ingress decision
  # made once, in the open, not a side effect of a Service type.
  type: ClusterIP
  selector:
    app: prospector-engine
  ports:
    - name: console
      port: 8601
      targetPort: console
    - name: ops
      port: 8611
      targetPort: ops
