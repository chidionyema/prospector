# The store's manners at the edge (crew#307 follow-up, founder 2026-08-29): a customer on
# mumchimp.com or a client of api.mumchimp.com must never read Traefik's raw "no available
# server" while a pod restarts, and no response may name the web server behind the door
# (api.mumchimp.com answered `server: Kestrel`, measured 02:40Z). Two of Traefik's built-in
# middlewares, attached to both store routes in edge.yaml; the platform's doors carry the same
# pair (idp platform/*/edge-manners.yaml) and the status page they answer with lives in the
# platform's edge namespace (idp platform/edge/status-page.yaml).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: friendly-errors
  namespace: prospector
  labels:
    app.kubernetes.io/part-of: prospector
spec:
  errors:
    status: ["502-504"]
    service:
      name: status-page
      namespace: edge
      port: 80
    query: "/{status}.html"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: edge-headers
  namespace: prospector
  labels:
    app.kubernetes.io/part-of: prospector
spec:
  headers:
    stsSeconds: 63072000
    stsIncludeSubdomains: true
    stsPreload: true
    contentTypeNosniff: true
    # The storefront already answers DENY; the edge repeats it so the API and any future route
    # on these hostnames get it too. The app's own Content-Security-Policy is left to the app.
    frameDeny: true
    referrerPolicy: strict-origin-when-cross-origin
    customResponseHeaders:
      Server: ""
      X-Powered-By: ""
