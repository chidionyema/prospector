# The estate's standards, as something a machine refuses rather than something an agent remembers.
#
# Founder, 2026-08-24: "we dont eforce stadard adbest practices, this is a new funxtion, we need to
# be ready fron day 0 thats why ii asked for research, stop naking ecuses". This file is the answer
# in the form he asked for: day 0, enforced, not written down.
#
# WHY KYVERNO AND NOT A SCRIPT. Measured 2026-08-24 against two sources that can disagree, the CNCF
# landscape.yml and the CLOMonitor API: Kyverno is CNCF GRADUATED, graduated 2026-03-24, CLOMonitor
# 93.75, Apache-2.0. The alternative, OPA Gatekeeper, is also graduated and also Apache-2.0, and it
# wins on exactly one axis -- Rego also runs against Terraform and plain HTTP APIs, so a
# cross-platform estate should prefer it. This estate's policies are all about Kubernetes objects,
# and Kyverno policies are ordinary Kubernetes YAML with no second language to learn. If the estate
# later needs one policy engine covering Terraform as well, Gatekeeper is the named replacement.
#
# EVERY RULE BELOW IS AN INCIDENT, NOT A BEST PRACTICE. A generic hardening bundle copied off a blog
# is the thing that gets an exemption on its first Friday. These seven each name the date the estate
# was bitten and the file that carries the scar, which is what makes them survivable when one of them
# is inconvenient at 2am.
#
# ENFORCE, NOT AUDIT, AND THAT IS DELIBERATE. LAW 38 says a guard that refuses correct work is an
# outage, so each rule states what it permits as narrowly as it states what it refuses, and every one
# of them is proved BOTH WAYS by deploy/rehearse_cluster.sh -- a refusal and a pass, in the same run.
# A gate with only refusal tests is a gate nobody has shown is safe to install.

---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: money-rail-single-writer
  annotations:
    policies.kyverno.io/title: One engine, one spend ledger
    policies.kyverno.io/severity: critical
    policies.kyverno.io/description: >-
      deploy/PORTABILITY.md item 1 is "run one container, and only one", because two engines keep two
      spend ledgers and can each spend the full $100 daily cap against config.yaml spend.daily_cap_usd.
      deploy/targets/k8s.sh:48 already refuses to NAME a pod when it finds two, but that check runs at
      query time and cannot stop the second pod being created. This one can.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: single-writer-workloads-run-exactly-one-replica
      match:
        any:
          - resources:
              kinds: [Deployment, StatefulSet]
              selector:
                matchLabels:
                  prospector.estate/single-writer: "true"
      validate:
        message: >-
          This workload is labelled prospector.estate/single-writer, which means it owns the SQLite
          store and the spend ledger. Two replicas is two writers: SQLite permits exactly one, and two
          spend ledgers each honour the daily cap separately, so the cap doubles silently. Set
          replicas to 1. If you genuinely need to scale this, the store has to leave SQLite first.
        pattern:
          spec:
            replicas: 1

    - name: single-writer-deployments-recreate-never-rollingupdate
      match:
        any:
          - resources:
              kinds: [Deployment]
              selector:
                matchLabels:
                  prospector.estate/single-writer: "true"
      validate:
        message: >-
          A Deployment's DEFAULT strategy is RollingUpdate, which starts the replacement pod BEFORE
          the old one terminates. On a single-writer workload that means two engines for the length of
          every handover, and against a ReadWriteOnce volume it means the new pod sits Pending on
          "Multi-Attach error for volume" until the rollout times out -- which reads like a broken
          image rather than a wrong strategy. One setting, two failures. Set strategy.type to Recreate.
          The same note is at deploy/targets/k8s.sh:133.
        pattern:
          spec:
            strategy:
              type: Recreate

---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: no-optional-secret-references
  annotations:
    policies.kyverno.io/title: A missing secret stops the pod, it does not start one half-configured
    policies.kyverno.io/severity: critical
    policies.kyverno.io/description: >-
      THIS IS THE 2026-08-24 INCIDENT, WRITTEN AS A POLICY. In compose the same trap is spelled
      `required: false`. deploy/compose/docker-compose.yml pointed env_file at ../../.env, which is
      correct in the repository and resolves to /srv/.env on a shipped box, where nothing has ever
      been. `required: false` swallowed that without a word, so the box came up carrying NONE of the
      24 settings the file holds. Measured inside the running container: `printenv | grep -i stripe`
      returned exactly one name. The API refused to start, correctly, naming Stripe:WebhookSecret --
      and the deploy script reported success anyway. The safety valve that lets a stack parse before
      its secrets arrive is the same thing that hid the fact that no secrets ever arrived.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: envfrom-secretref-must-not-be-optional
      match:
        any:
          - resources:
              kinds: [Pod]
      # The system's own namespaces run controllers this estate did not write and does not get to
      # re-specify. LAW 38: a fence that stops correct work is an outage, and refusing kube-system
      # would take the cluster's own components down rather than the shop's.
      exclude:
        any:
          - resources:
              namespaces: [kube-system, kube-public, kube-node-lease, kyverno, cert-manager]
      validate:
        message: >-
          `optional: true` on a secretRef is the Kubernetes spelling of compose's `required: false`.
          It means the pod starts whether or not it was given its credentials, so the first thing that
          fails is something downstream and the deploy reports success. Drop the field, or set it to
          false, and let the pod stay Pending naming the Secret it wants. A pod that will not start is
          an operator being told the truth.
        foreach:
          - list: "request.object.spec.containers[]"
            deny:
              conditions:
                any:
                  - key: "{{ element.envFrom[].secretRef.optional || `[]` }}"
                    operator: AnyIn
                    value: [true]

---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: no-literal-credentials-in-pod-spec
  annotations:
    policies.kyverno.io/title: LAW 21, enforced by the API server
    policies.kyverno.io/severity: critical
    policies.kyverno.io/description: >-
      LAW 21: "A secret value never appears anywhere it can be read again -- not a transcript, not a
      log line, not a commit, not a message, not a screenshot, for any reason including debugging."
      A pod spec is all five: it is in git, it is in `kubectl get -o yaml`, it is in the audit log, it
      is in every controller's cache, and it is in the screenshot somebody pastes into a ticket. This
      estate has already lost a day to that class -- `docker compose config` without --quiet expanded
      env_file inline and wrote 12,688 occurrences of live credential values across 1,314 files, one
      of them under iCloud.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: credential-shaped-env-names-must-use-valuefrom
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              namespaces: [kube-system, kube-public, kube-node-lease, kyverno, cert-manager]
      validate:
        message: >-
          An environment variable whose NAME says it carries a credential must arrive through
          valueFrom.secretRef, never as a literal `value:`. A literal here is committed to git and
          readable by anything that can run `kubectl get pod -o yaml`. Move it into a Secret. If the
          name is a false positive -- an issuer, an audience, a public key id, a URL -- rename it so
          the next reader is not left deciding whether the estate leaks credentials.
        foreach:
          - list: "request.object.spec.containers[].env[] || `[]`"
            preconditions:
              all:
                - key: "{{ element.value || '' }}"
                  operator: NotEquals
                  value: ""
            deny:
              conditions:
                any:
                  - key: "{{ to_upper(element.name) }}"
                    operator: AnyIn
                    value:
                      - "*SECRET*"
                      - "*PASSWORD*"
                      - "*PRIVATE_KEY*"
                      - "*SIGNINGKEY*"
                      - "*_TOKEN"
                      - "*APIKEY*"
                      - "*API_KEY*"

---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: images-must-be-traceable
  annotations:
    policies.kyverno.io/title: An image tag has to say which build it is
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      `:latest` cannot be rolled back, cannot be diffed and does not say what is running. This estate
      has already had the shape of that failure without Kubernetes: production ran 32-hour-old code
      while a roadmap read "live", which is why CLAUDE.md now says the live answer is a command and
      never a sentence. A tag that names a build is what makes `kubectl get pod -o yaml` a command
      that answers.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: no-latest-and-no-bare-tag
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              namespaces: [kube-system, kube-public, kube-node-lease, kyverno, cert-manager]
      validate:
        message: >-
          Use an image tag that names a build -- a commit sha, a date, a version -- not `:latest` and
          not a bare name with no tag at all. `:latest` means the running code cannot be identified
          from the cluster and cannot be rolled back to what it was an hour ago.
        pattern:
          spec:
            containers:
              - image: "!*:latest & *:*"

---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: workloads-declare-what-they-need
  annotations:
    policies.kyverno.io/title: Resource requests and limits, so one pod cannot take the node
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Measured on this laptop 2026-08-24: running the pytest suite and the rehearsal box at the same
      time took the load average to 113 and Docker's own daemon stopped answering, which surfaced
      three layers away as `Connection timed out during banner exchange` and was read as a dead
      storefront. On a one-node cluster, an unbounded pod does exactly that to the shop, and the
      symptom appears somewhere else entirely.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: every-container-states-its-memory
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              namespaces: [kube-system, kube-public, kube-node-lease, kyverno, cert-manager]
      validate:
        message: >-
          Every container needs resources.requests.memory and resources.limits.memory. Without a
          request the scheduler cannot know whether this fits; without a limit one leak takes the node
          and the failure shows up as something else being broken. CPU is deliberately not required:
          a CPU limit throttles rather than protects, and on a one-node shop it makes a slow request
          slower instead of making a bad pod stop.
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    memory: "?*"
                  limits:
                    memory: "?*"

---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: secure-by-default
  annotations:
    policies.kyverno.io/title: LAW 21, the default is closed
    policies.kyverno.io/severity: critical
    policies.kyverno.io/description: >-
      LAW 21: "The default is closed." A privileged container is root on the node, so it can read
      every other pod's secrets off the filesystem and the blast radius of one bad dependency becomes
      the whole box. This is the rule most likely to be inconvenient, which is why the escape hatch is
      an explicit label rather than an argument at 2am -- and LAW 37 says that label being used is
      data about this policy, not a defect in the workload.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: no-privileged-containers
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              namespaces: [kube-system, kube-public, kube-node-lease, kyverno, cert-manager]
          # The escape hatch, named honestly and countable. LAW 38: leave one, and count it. A run of
          # `kubectl get pods -A -l prospector.estate/needs-privileged=true` is the review list.
          - resources:
              selector:
                matchLabels:
                  prospector.estate/needs-privileged: "true"
      validate:
        message: >-
          privileged: true is root on the node, which means read access to every other pod's mounted
          secrets. Nothing in this shop needs it. If something genuinely does, label the pod
          prospector.estate/needs-privileged=true so it appears on the review list instead of
          disappearing into the cluster.
        pattern:
          spec:
            =(containers):
              - =(securityContext):
                  =(privileged): "false"

---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: serving-workloads-must-be-probed
  annotations:
    policies.kyverno.io/title: Self-healing starts at a probe, and nothing else supplies one
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Founder, 2026-08-24, asked for "total self healing prod ready". Layer 1 of that is entirely free
      and entirely conditional: Kubernetes restarts a container that fails its liveness probe and
      keeps traffic off one that fails its readiness probe. A container with NEITHER is one Kubernetes
      cannot heal, because a hung process that still holds its socket open looks identical to a
      healthy one. The estate has the exact shape of this already -- ship_shop.sh printed "the shop
      answered through the edge" over two HTTP 000s, because nothing was actually asking.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: containers-that-listen-declare-a-readiness-probe
      match:
        any:
          - resources:
              kinds: [Pod]
              selector:
                matchLabels:
                  prospector.estate/serving: "true"
      validate:
        message: >-
          This pod is labelled prospector.estate/serving, so something sends it traffic. Every
          container needs a readinessProbe, or the cluster will route requests to a process that is
          still starting, and a livenessProbe, or it will never restart one that has hung. Those two
          probes are the whole of what "self-healing" means at layer 1; without them the word is
          decoration.
        pattern:
          spec:
            containers:
              - readinessProbe:
                  "?*": "?*"
                livenessProbe:
                  "?*": "?*"
