# HOW MUCH OF THIS MACHINE CI IS ALLOWED TO TAKE.
#
# CI runs on self-hosted runner processes on the same Mac that runs the production scheduler and
# consumer. Nothing used to connect the two numbers that decide the load: how many runner
# processes are registered (a `config.sh` run nobody records) and how wide each pytest job runs
# (`PYTEST_XDIST_AUTO_NUM_WORKERS` in ci.yml). Neither knew about the other, and neither knew the
# box also runs the daemons. Measured 2026-08-18 with four runners busy: load average 110 on a
# 12-CPU box, roughly nine times oversubscribed.
#
# `scripts/ci_capacity.py` checks these numbers against the workflow files and, with --live,
# against the runners actually registered on GitHub. Change a number here and the check tells you
# what else has to move.
#
# This is a contract for a temporary arrangement. The engine is being moved to hosted capacity;
# until it is, CI has to share this box without stalling it.

box:
  # THE RUNNER MACHINE, not the founder's laptop. Rewritten 2026-08-18 when CI moved to Fly.
  #
  # Everything this section used to say was about sharing one 12-core Mac with the production
  # scheduler and consumer: 12 cpus, 2 reserved for the daemons, 3 heavy jobs landing at once.
  # None of it is true any more. CI runs on `prospector-ci` Fly machines, `shared-cpu-4x` with
  # 8 GB each (deploy/runner/fly.toml), and production runs in its own Fly apps. Nothing CI does
  # can stall the engine now, and nothing the engine does slows CI.
  #
  # So the budget is per MACHINE. A GitHub Actions runner takes one job at a time, so the widest
  # single job has to fit one machine: heavy_slots is 1 and reserved_cpus is 0. The old numbers
  # kept passing while the ground moved, which is the failure this contract exists to catch and
  # did not.
  cpus: 4
  ram_gb: 8
  reserved_cpus: 0
  # One job per runner process. This is a property of GitHub Actions, not a tuning knob.
  heavy_slots: 1

# How many processes each heavy job actually runs. `python` says `-n 6` on its pytest command
# line; the rest are one build or one suite at the file's default width. At most `heavy.runners`
# of these run at once, so the check sums the widest that many and compares against the budget.
# A number here that ci.yml does not agree with is itself a failure: the point is that the two
# cannot drift.
job_cpus:
  python: 4
  engine: 3
  dotnet: 1
  nextjs: 1
  ops-console: 1

pools:
  # Jobs that check out, install a toolchain and run a suite: python, engine, dotnet, nextjs,
  # ops-console. heavy_runners x workers_per_heavy_job must fit in cpus - reserved_cpus.
  # `nextjs` and `ops-console` were in here, and that was the throughput defect.
  #
  # They cost one CPU each, the same as a light job, but sitting in a three-runner pool they
  # competed for a slot with the six-CPU pytest suite. Five heavy jobs on three runners means a
  # single pull request cannot even start its own lanes at once: it serialises them, three at a
  # time, and every other pull request queues behind that.
  #
  # Measured 2026-08-18 07:5x UTC: mumchimp-mac, -2 and -3 all busy, seven runs queued, and
  # mumchimp-mac-4 idle -- it carries `self-hosted` but not `heavy`, so a quarter of the estate
  # could not touch the backlog.
  #
  # Moving them changes nothing about the CPU budget. The check sums the widest `runners` jobs,
  # and the widest three are still python 6 + engine 3 + dotnet 1 = 10, exactly `cpus -
  # reserved_cpus`. What it changes is that those three now start together instead of queueing
  # behind a node build.
  #
  # `runners` is the PERSISTENT instances -- the launchd runners on this Mac, always registered.
  # `ephemeral` is how many more may be registered at any moment: the Fly containers added on
  # 2026-08-18 (deploy/runner/fly.toml RUNNER_LABELS), so that a heavy job has somewhere to run
  # that is not the founder's laptop.
  #
  # They are counted separately because an ephemeral runner registers, takes one job, deregisters
  # and is restarted by Fly. It is legitimately absent between jobs, so --live checks a RANGE:
  # at least `runners`, at most `runners + ephemeral`. An exact count flakes on its own fleet.
  # Only `runners` bears on the CPU budget; see box.heavy_slots.
  heavy:
    # THE FLY FLEET. Three `prospector-ci` machines carry every label; the four Mac runners are
    # registered but have been offline since the estate moved, and an offline runner is not
    # capacity. `scripts/ci_capacity.py --live` counts ONLINE runners for exactly that reason.
    #
    # 2 persistent + 1 ephemeral = a range of 2-3 against a fleet of 3. The tolerance is one
    # machine, and it is needed: these runners are `--ephemeral`, so each one deregisters when a
    # job ends and re-registers when Fly restarts it about two seconds later. A blink is normal;
    # two machines down at once is not.
    # AUTOSCALE SETS THIS RANGE NOW, not a hand-counted fleet (founder chose max 6 on
    # 2026-08-19). `runners` is autoscale_min -- the machines kept started at all times, and the floor that
    # turns a dark runner into a failing row -- and
    # `ephemeral` is the headroom up to autoscale_max. scripts/ci_capacity.py --live checks
    # between the two, which is exactly the band autoscale is allowed to move in.
    #
    # A stopped machine bills no CPU and no RAM, so the headroom costs pennies and is only paid
    # for while it is running jobs. box.heavy_slots, not this number, is what bounds the CPU
    # arithmetic, so widening the band does not oversubscribe anything.
    runners: 2
    ephemeral: 10
    variable: CI_HEAVY_RUNS_ON
    # LABEL `fly`, NOT `heavy` OR `self-hosted`, SINCE 2026-08-19. mumchimp-mac-4 was online
    # carrying `self-hosted`, the same label the Linux fleet carries, so GitHub scheduled
    # Linux jobs onto macOS at random and they died in actions/setup-python. The error names
    # the action, not the routing. `fly` is carried only by the prospector-ci machines
    # (deploy/runner/fly.toml RUNNER_LABELS), so it names the fleet and nothing else. The
    # repository variables CI_HEAVY_RUNS_ON, CI_LIGHT_RUNS_ON and CI_RUNS_ON were set to
    # `fly` at 12:01 on 2026-08-19; this file has to agree or scripts/ci_capacity.py fails
    # the guard job on every branch.
    label: fly
    jobs: [python, engine, dotnet]
  # Short jobs: a checkout, a doc lint, a shell loop over already-computed results. They must
  # never wait behind a suite -- `ci-ok` queueing behind a 24-minute python job is what left runs
  # reading `queued` after every job in them had finished.
  #
  # This said one runner, on the reasoning that a light job holds a slot for seconds. It does not.
  # `changes` checks the repository out and `guard` runs two linters, so each is closer to a
  # minute, and every run needs three of them. Measured 2026-08-18 04:22 UTC with five runs queued
  # (32095268259, 32096489333, 32097323948, 32097903595, 32098911603): #314's `guard` and
  # `changes` had waited 25 minutes with no runner assigned, because one instance was serving
  # about twenty light jobs.
  #
  # The pool is every self-hosted instance now. The reservation the split was for still holds from
  # the other side: heavy jobs ask for `heavy`, and mumchimp-mac-4 does not carry that label, so a
  # suite can never take the instance a finalising job needs.
  #
  # Every self-hosted instance: four persistent Macs, plus up to three Fly containers.
  light:
    # The same three machines. They carry `self-hosted` as well as `heavy`, so the light pool is
    # not a separate fleet any more -- the reservation the split existed for came from the Macs,
    # where mumchimp-mac-4 deliberately lacked `heavy`. Keep the split declared: it costs
    # nothing, and it is how a light job gets its own capacity again the moment one is added.
    # Same band, same fleet: these machines carry both labels.
    runners: 2
    ephemeral: 10
    variable: CI_LIGHT_RUNS_ON
    # Same fleet, same label, same reason as heavy above.
    label: fly
    jobs: [changes, guard, ci-ok, nextjs, ops-console]

# HOW MANY MACHINES MAY BE RUNNING AT ONCE, AND HOW FEW.
#
# Priced 2026-08-19 from https://fly.io/docs/about/pricing/. A `shared-cpu-4x` machine is
# $8.08/month of CPU; extra RAM is about $5/GB/month, so the 8 GB in deploy/runner/fly.toml is
# roughly $40 more. Call it ~$48/month per machine left started around the clock, ~$145/month
# for the fleet of three. A STOPPED machine bills no CPU and no RAM -- only rootfs storage at
# $0.15 per GB per 30 days.
#
# That price shape is why `deploy/runners.sh autoscale` starts and stops machines instead of
# creating and destroying them, and why the ceiling can be raised without raising the bill: an
# idle machine in the pool costs pennies, so capacity for a busy afternoon is nearly free and is
# only paid for while it is actually running jobs.
#
# autoscale_min  machines kept started at all times. 2, not 0: a cold start costs a job about a
#                minute, and the first job of the morning should not pay it. Set 0 to pay
#                nothing overnight and accept that delay.
# autoscale_max  the ceiling, 12 since 2026-08-19. Raising it does not raise the bill: Fly
#                charges per second a machine is RUNNING and the job count is fixed, so twelve
#                runners burn the same machine-seconds as six and finish in half the wall
#                clock. Idle machines are stopped and bill only rootfs storage. The queue that
#                forced this was ten branches deep across several concurrent sessions, against
#                six runners. Never higher than the
#                machines the pool actually holds --
#                `deploy/runners.sh up <n>` is what creates them; autoscale only starts and
#                stops what is already there, and says so when it wants more than exists.
autoscale_min: 2
autoscale_max: 12
