# Offsite backup — this startup's declaration.
#
# Every business fact for the `offsite_backup` automation lives here. The engine
# (`ops/automations/offsite_backup.py`) contains none of it. Moving this check to another
# startup means writing a new copy of THIS file and nothing else.
#
# The rule this encodes: a provider snapshot is not a backup. Fly's snapshots of
# vol_4ql6dzwjylqeygnr live in the same Fly account as the volume, keep 5 days, and have
# never been restored. Everything listed below is copied OUT of that account, into storage
# on a different provider, and opened to prove it is readable before it counts.

storage:
  # Cloudflare R2, S3-compatible. Same bucket and credentials as scripts/backup_store.py,
  # which already backs up the ENGINE store (dossiers, ledger, index) — a different bucket
  # from the delivery bucket R2_BUCKET on purpose, because the delivery bucket is reachable
  # by the storefront's own credentials and can have a public r2.dev domain attached.
  endpoint: "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
  access_key_env: R2_ACCESS_KEY_ID
  secret_key_env: R2_SECRET_ACCESS_KEY
  bucket: prospector-backup
  prefix: "offsite/"
  region: auto

# How old the newest copy may be before the monitor goes red. A day, because the daemon
# publishes and sells continuously and a lost day is a lost day of orders.
max_age_hours: 24

sources:
  - name: money-db
    why: >-
      Orders, entitlements, grant tokens and download counts. This is the only record of who
      bought what. It lives at /data/store.db on a single 1 GB Fly volume in lhr, and until
      this automation existed nothing in this repo ever pulled it off Fly.
    fetch:
      # An authenticated HTTPS GET, not `fly ssh sftp get`. The engine container carries no
      # platform CLI on purpose, so the old command could not run from where this job actually
      # lives and the money database was fetched by hand from the laptop instead. curl works
      # on Fly, on a rented Linux box and on a laptop, unchanged.
      #
      # The endpoint runs VACUUM INTO before it answers, so what arrives is a consistent
      # snapshot rather than a live file that can be torn mid-page. `--fail` matters: without
      # it curl writes the error body to {dest} and exits 0, and a 401 page would be recorded
      # as the night's backup.
      - curl
      - --fail
      - --silent
      - --show-error
      - --max-time
      - "300"
      - --header
      - "X-Internal-Key: ${STORE_INTERNAL_API_KEY}"
      - --output
      - "{dest}"
      - https://api.mumchimp.com/internal/backup/database
    key: money-db/store.db
    # Opened with PRAGMA integrity_check before it is allowed to count. A live SQLite file
    # copied byte-for-byte can be torn; a torn copy fails this check and no backup is
    # recorded, which is the correct outcome — a bad copy must never displace a good one.
    verify: sqlite
    keep: 30

  - name: data-protection-keys
    why: >-
      The ASP.NET Data Protection key ring at /data/keys. Losing it does not lose data, it
      makes data unreadable: anything the API encrypted with it (grant tokens, cookies)
      cannot be decrypted by a restored instance holding a fresh key. A restore of the
      database alone would look successful and hand every buyer a broken download link.
    fetch:
      # Same .tar.gz the old two-step `fly ssh` command produced, built by the API itself, so
      # everything already in the bucket and the restore procedure stay one format.
      - curl
      - --fail
      - --silent
      - --show-error
      - --max-time
      - "120"
      - --header
      - "X-Internal-Key: ${STORE_INTERNAL_API_KEY}"
      - --output
      - "{dest}"
      - https://api.mumchimp.com/internal/backup/keyring
    key: data-protection-keys/keyring.tgz
    # Opened as a tar archive, and its index read, before it counts. This said `nonempty`
    # until 2026-08-19: a size cannot tell a whole key ring from a download that stopped
    # halfway, and the half-download is the copy you find out about during a restore.
    verify: tgz
    keep: 30

  - name: agent-estate
    why: >-
      ~/.claude — the agent estate. Memory files, hooks, skills, the state probes, every
      checkpoint and the founder-directive archive. It is how six sessions know what this
      business is, which traps have already cost time, and why each decision was taken. None of
      it is in git and, until this entry, it existed in exactly one copy on one laptop disk:
      the only thing here with no second copy anywhere. 1,127 files, 13.0 MiB, measured
      2026-08-20 — the rest of the 7.2 GB under ~/.claude is session transcripts, telemetry and
      caches, and rebuilds itself.
    fetch:
      # `{repo}` is this checkout: /app in the engine container, prospector-live on the laptop.
      # The command runs with cwd set to a scratch directory, so a relative path cannot work and
      # an absolute one cannot be written down once.
      #
      # The script takes an ALLOW-LIST, not a tar of the whole directory, and it reads the bytes
      # before it packs them. It has to: measured on the allow-listed set alone, ~/.claude held a
      # private key in a checkpoints directory and a 93-character GitHub token pasted into the
      # directive archive. Key material is dropped whole, an embedded credential is redacted in
      # place, and both are recorded by path and line in AGENT_ESTATE_MANIFEST.json inside the
      # archive. ~/.hermes/.gitignore already carries the verdict on doing this by filename
      # patterns instead: 26 live keys reached a GitHub remote through exactly that control.
      - "{repo}/scripts/backup_agent_estate.py"
      - --out
      - "{dest}"
    key: agent-estate/claude.tgz
    # Opened as a tar archive and its index read, same as the key ring above.
    verify: tgz
    # Only the laptop has an agent estate. The engine container skips this source and still
    # GRADES it, which is the arrangement that matters: the always-on host is the one that
    # notices when the laptop stops taking the copy.
    only_where: "~/.claude"
    # 72 hours, not 24 or 30. This job runs at 03:50 on a laptop, and a laptop with its lid shut
    # over a long weekend is not a backup failure. A week of silence is. The two hosts that write
    # every other source here are always on; this one is not, and the threshold says so rather
    # than going red every Monday until somebody mutes it.
    max_age_hours: 72
    keep: 30
  - name: hermes-state
    why: >-
      ~/dev/code/hermes-v2/state.db — The Architect's durable memory. Sessions, every message,
      the full-text index over them, system prompts, routing and delegation state. 23 tables,
      1.1 MiB measured 2026-08-23. This file is the ONLY record of what the agent has been told
      and what it has said; the repository holds the code and none of the memory. Until this
      entry existed it had one copy on one laptop disk. `bin/backup-state.sh` in that repo wrote
      a local .gz that held ONE of the 23 tables and never left the machine, and the requirement
      that graded it (REQ-020) passed on `test -s`, which proves a file is present and nothing
      more. That is the false green this entry replaces. The note above under `watch:` said
      "Hermes state is genuinely NOT backed up; that is the open M4 work" — this closes it.
    fetch:
      # SQLite's online backup API, not `cp` and not a shell redirect. The gateway
      # (launchd ai.architect.gateway) holds this database open and writes to it continuously,
      # so a byte copy can be torn mid-page. `.backup()` takes a consistent snapshot of a live
      # database, carries every table, and does not need the writer stopped. The source is
      # opened read-only so this job can never be the thing that corrupts the memory it exists
      # to protect.
      - python3
      - -c
      - |-
        import sqlite3, sys
        src, dest = sys.argv[1], sys.argv[2]
        source = sqlite3.connect("file:%s?mode=ro" % src, uri=True)
        target = sqlite3.connect(dest)
        with target:
            source.backup(target)
        target.close()
        source.close()
        print("copied %s" % src)
      # Literal, for the same reason /data/logs is literal above: `_expand` raises on an unset
      # variable, HERMES_HOME is not set in this job's environment, and an unset variable would
      # take the WHOLE run to unknown — the money database included.
      - /Users/chidionyema/dev/code/hermes-v2/state.db
      - "{dest}"
    key: hermes-state/state.db
    # PRAGMA integrity_check before it counts, the same grade the money database gets. A torn
    # copy must never displace a good one.
    verify: sqlite
    # Only the laptop runs the gateway. The engine container skips the fetch and still GRADES
    # the prefix, which is the arrangement that matters: the always-on host notices when the
    # laptop stops taking the copy.
    only_where: /Users/chidionyema/dev/code/hermes-v2/state.db
    # 72 hours, not 24, for the same reason as agent-estate: this is a laptop, and a shut lid
    # over a weekend is not a backup failure. A week of silence is.
    max_age_hours: 72
    keep: 30
  - name: maestro-experience
    why: >-
      ~/.maestro — the autonomous operator's experience graph and its intent record. The
      database holds 109 episodes and 7 invariants: every incident Maestro has seen, what it
      decided, and the rules it has been given. Alongside it, intents/ holds 82 JSON files, one
      per thing it was asked to do. Neither is in git and neither has ever left this laptop, so
      until this entry the whole of what Maestro has learned sat in one copy on one disk. Losing
      it does not just lose history: the invariants table is the rail that bounds what the
      operator is allowed to do, and an operator restored without its invariants is an operator
      with no limits.
    fetch:
      # SQLite's online backup API, then a tar, for one measured reason. On 2026-08-23 the
      # database on disk was 102,400 bytes and its write-ahead log was 1,314,312 bytes — twelve
      # times the size of the file a `cp` would have copied. The launchd job
      # com.chidionyema.maestro holds this database open in WAL mode and checkpoints rarely, so
      # a byte copy takes an almost-empty file and reports success. `.backup()` reads through
      # the WAL and produces the whole database. The source is opened read-only so this job can
      # never corrupt the memory it exists to protect.
      #
      # intents/ goes in the same archive because it is not in the database. The episode ids are
      # CRISIS-*, the intent files are INTENT-*, and nothing joins them: a restore of the
      # database alone would come back knowing what Maestro concluded and not what it was asked.
      - python3
      - -c
      - |-
        import os, sqlite3, sys, tarfile, tempfile
        home, dest = sys.argv[1], sys.argv[2]
        db = os.path.join(home, "experience_graph.db")
        with tempfile.TemporaryDirectory() as tmp:
            snap = os.path.join(tmp, "experience_graph.db")
            source = sqlite3.connect("file:%s?mode=ro" % db, uri=True)
            target = sqlite3.connect(snap)
            with target:
                source.backup(target)
            target.close()
            source.close()
            with tarfile.open(dest, "w:gz") as tar:
                tar.add(snap, arcname="experience_graph.db")
                intents = os.path.join(home, "intents")
                if os.path.isdir(intents):
                    tar.add(intents, arcname="intents")
        print("packed %s" % dest)
      # Literal, for the same reason the hermes-state path above is literal: `_expand` raises on
      # an unset variable, and an unset MAESTRO_HOME would take the WHOLE run to unknown — the
      # money database included.
      - /Users/chidionyema/.maestro
      - "{dest}"
    key: maestro-experience/maestro.tgz
    # Opened as a tar archive and its index read. That is weaker than the integrity_check the
    # money database gets, and it is the right grade here: the sqlite verifier opens {dest}
    # directly, and {dest} is an archive. The consistency guarantee for the database inside it
    # comes from `.backup()` refusing to produce a torn snapshot in the first place.
    verify: tgz
    # Only the laptop runs Maestro. The engine container skips the fetch and still GRADES the
    # prefix, which is the arrangement that matters: the always-on host notices when the laptop
    # stops taking the copy.
    only_where: /Users/chidionyema/.maestro/experience_graph.db
    # 72 hours, not 24, for the same reason as agent-estate and hermes-state: this is a laptop,
    # and a shut lid over a weekend is not a backup failure. A week of silence is.
    max_age_hours: 72
    keep: 30
  - name: secret-store
    why: >-
      deploy/secrets.env.age — the age-encrypted file holding all 25 secrets the stack needs to
      authenticate anywhere: the Stripe live keys, the R2 keys, the Fly token, the store's
      internal API key and every model provider key. It is what makes the difference between a
      restored machine that runs and a restored machine that runs and cannot authenticate, which
      is exactly the failure of 2026-08-17 that deploy/secrets.sh was written to end. It was
      created on 2026-08-23 and until this entry it had one copy, on the laptop whose loss is the
      disaster the whole programme exists to survive.

      It does NOT go in git, and that is a correction rather than an omission. deploy/secrets.sh
      instructed in its own header that the file be committed, on the reasoning that ciphertext
      is useless without the key. That holds for a private repository. chidionyema/prospector is
      PUBLIC, so a commit would publish every live credential to an internet that keeps clones
      after a deletion, with one X25519 key on one laptop as the only protection, permanently.
      This bucket is private and already holds the money database, so the store is no more
      exposed here than the thing it protects — and it arrives already encrypted, so even losing
      the bucket does not lose the values.
    fetch:
      # It uploads the CIPHERTEXT, and it decrypts only into memory, only to prove the file is
      # whole. `verify: nonempty` is the only kind that fits an opaque blob and a byte count
      # cannot tell a good store from a truncated one, so the real verification happens here,
      # before anything leaves: the file must decrypt with the laptop's key and must yield at
      # least as many assignments as the store had when this was written. A truncated or
      # key-mismatched store fails at this step and never displaces the good copy in the bucket.
      #
      # No plaintext is written to disk and no value is printed, only a count. The subprocess
      # output is held in a variable and dropped when the process exits.
      - python3
      - -c
      - |-
        import shutil, subprocess, sys
        store, key, dest = sys.argv[1], sys.argv[2], sys.argv[3]
        out = subprocess.run(["age", "-d", "-i", key, store],
                             capture_output=True, check=True).stdout.decode()
        n = sum(1 for line in out.splitlines() if "=" in line and not line.startswith("#"))
        del out
        if n < 20:
            sys.exit("the store decrypted to %d assignments, which is short of the 25 it held "
                     "on 2026-08-23: refusing to overwrite a good backup with a damaged one" % n)
        shutil.copyfile(store, dest)
        print("copied an encrypted store holding %d secrets" % n)
      # Literal, for the same reason every other path in this file is literal: `_expand` raises
      # on an unset variable and would take the WHOLE run to unknown, the money database with it.
      - /Users/chidionyema/Documents/code/prospector-live/deploy/secrets.env.age
      - /Users/chidionyema/.config/prospector/age-key.txt
      - "{dest}"
    key: secret-store/secrets.env.age
    # The fetch above already refused a store that does not decrypt, so what reaches here is
    # known-good and this only confirms bytes landed.
    verify: nonempty
    # Only the laptop holds the key, so only the laptop can prove the store is whole. The engine
    # container skips the fetch and still GRADES the prefix, which is the arrangement that
    # matters: the always-on host notices when the laptop stops taking the copy.
    only_where: /Users/chidionyema/.config/prospector/age-key.txt
    # 72 hours, the same as the other laptop-scoped sources. A shut lid over a weekend is not a
    # backup failure; a week of silence is.
    max_age_hours: 72
    # 30 copies, so a secret rotated by mistake can be recovered from a store taken before it.
    keep: 30
  - name: architect-code
    why: >-
      A `git bundle` of every ref in ~/dev/code/hermes-v2 — the Architect's source. Its memory
      is already covered by the `hermes-state` source above, and that is the half that misleads:
      a restore that brings back 388 messages and 23 sessions with no code to run them against
      is not a restore. `mirror_repo()` in scripts/backup_store.py makes exactly this argument
      for the prospector repository and states the reason in its own docstring — "the only git
      remote is GitHub, if that account is lost every branch, tag and commit goes with it" —
      and then bundles one repository. The Architect is not that repository, so losing the
      GitHub account today loses its code while its memory sits safely in this bucket.

      1.0 MiB over 11 refs, measured 2026-08-23, so 30 copies is about 30 MiB.
    fetch:
      # Bundle, then CLONE IT, before anything is uploaded. Cloning is the check and
      # `git bundle verify` is not: measured 2026-08-23, verify accepted a bundle truncated to
      # its first 300 bytes, because it reads the header and confirms the prerequisite commits
      # exist locally without ever reading the pack. A clone reads the whole pack, and the same
      # truncated file failed it with exit 128. `git bundle create` can write a short file on a
      # full disk and exit 0, so this is the failure that actually happens. Doing it here rather
      # than in `verify:` is deliberate: the engine's verifiers know sqlite and tar and nothing
      # about git.
      - python3
      - -c
      - |-
        import os, subprocess, sys, tempfile
        repo, dest = sys.argv[1], sys.argv[2]
        subprocess.run(["git", "-C", repo, "bundle", "create", dest, "--all"], check=True)
        with tempfile.TemporaryDirectory() as tmp:
            probe = os.path.join(tmp, "probe.git")
            subprocess.run(["git", "clone", "--bare", "--quiet", dest, probe], check=True)
            refs = subprocess.run(["git", "-C", probe, "show-ref"],
                                  capture_output=True, text=True, check=True).stdout
        n = len(refs.splitlines())
        if n < 1:
            sys.exit("the bundle of %s cloned to %d refs: refusing to upload it" % (repo, n))
        print("bundled %s and cloned it back to %d refs" % (repo, n))
      - /Users/chidionyema/dev/code/hermes-v2
      - "{dest}"
    key: architect-code/hermes-v2.bundle
    # The fetch already refused a bundle that will not verify, so this only confirms bytes
    # landed. There is no git verifier in the engine and adding one to grade a file the fetch
    # has already opened would be a second implementation of the same check.
    verify: nonempty
    only_where: /Users/chidionyema/dev/code/hermes-v2/.git
    # 72 hours, the same as every other laptop-scoped source. A shut lid is not a failure.
    max_age_hours: 72
    keep: 30
  - name: maestro-code
    why: >-
      A `git bundle` of every ref in ~/dev/code/maestro — the autonomous operator's source, and
      the other half of the pair the `maestro-experience` source above only half covers. The
      experience graph holds what Maestro learned and the invariants that bound what it may do;
      this holds the code that reads them. Restoring the invariants without the engine that
      enforces them gives you a record of the rails and nothing standing on them.

      516 KiB over 9 refs, measured 2026-08-23, so 30 copies is about 15 MiB.
    fetch:
      # Identical to architect-code above, and deliberately a second copy rather than a shared
      # anchor. `_expand` reads this file literally, the two differ only in a path, and a YAML
      # anchor would put the one thing a reader needs to check behind an indirection.
      - python3
      - -c
      - |-
        import os, subprocess, sys, tempfile
        repo, dest = sys.argv[1], sys.argv[2]
        subprocess.run(["git", "-C", repo, "bundle", "create", dest, "--all"], check=True)
        with tempfile.TemporaryDirectory() as tmp:
            probe = os.path.join(tmp, "probe.git")
            subprocess.run(["git", "clone", "--bare", "--quiet", dest, probe], check=True)
            refs = subprocess.run(["git", "-C", probe, "show-ref"],
                                  capture_output=True, text=True, check=True).stdout
        n = len(refs.splitlines())
        if n < 1:
            sys.exit("the bundle of %s cloned to %d refs: refusing to upload it" % (repo, n))
        print("bundled %s and cloned it back to %d refs" % (repo, n))
      - /Users/chidionyema/dev/code/maestro
      - "{dest}"
    key: maestro-code/maestro.bundle
    verify: nonempty
    only_where: /Users/chidionyema/dev/code/maestro/.git
    max_age_hours: 72
    keep: 30
  - name: logs
    why: >-
      Yesterday's ingested logs, every service, one file per service per day. They are the only
      record of what the platform DID -- what a buyer was served, which provider was down, why a
      tick produced nothing. `ops/config/log_rotation.yaml` deletes `/data/logs/*.jsonl` at 14
      days, and that is a data-protection bound, not a storage one, so the deletion is not
      optional and the hot window cannot be widened to compensate. Fourteen days is therefore the
      ENTIRE margin: if this source stops depositing and nobody notices for two weeks, the logs
      are gone from both places at once. That coupling is why this is a `source` with its own
      freshness grade rather than a line in the retention sweeper.
    fetch:
      # No curl, because unlike the money database these files are already on the machine this
      # job runs on. No `tar` and no shell glob either: `date -u -d yesterday` is GNU-only and
      # this repo's tests run on the Mac as well as on Linux, so a shell one-liner would pass on
      # CI and fail on a developer's laptop. Python is the one interpreter both have, and it is
      # what the whole container already is.
      #
      # It exits NON-ZERO when yesterday matched no file, and that is deliberate. `[program:
      # log-ingest]` runs continuously and the scheduler ticks every 7200s, so a day with no log
      # file at all does not mean a quiet day, it means the ingest died. A silent empty archive
      # would be uploaded, graded fresh, and would hide exactly the outage this exists to record.
      - python3
      - -c
      - |-
        import datetime, glob, os, sys, tarfile
        src, dest = sys.argv[1], sys.argv[2]
        day = (datetime.datetime.now(datetime.timezone.utc).date()
               - datetime.timedelta(days=1)).isoformat()
        files = sorted(glob.glob(os.path.join(src, "*-%s.jsonl" % day)))
        if not files:
            sys.exit("no log file for %s in %s: the ingest wrote nothing yesterday" % (day, src))
        with tarfile.open(dest, "w:gz") as archive:
            for path in files:
                archive.add(path, arcname=os.path.basename(path))
        print("archived %d file(s) for %s" % (len(files), day))
      # Literal, not ${PROSPECTOR_LOG_DIR}. `_expand` raises CannotEstablish on an unset
      # variable, the engine image sets only PROSPECTOR_STORE_DIR, and an unset variable here
      # would take the WHOLE run to unknown -- the money database included. The cost is that this
      # path restates what `log_ingest.log_dir()` derives; the same trade is made and documented
      # in ops/config/log_rotation.yaml, and a test fails if the two ever disagree.
      - /data/logs
      - "{dest}"
    key: logs/engine-logs.tgz
    # Opened as a tar archive and its index read, the same check the key ring gets. A gzip stream
    # that ends mid-member fails here rather than sitting in the bucket looking like a backup.
    verify: tgz
    # The mirror image of `agent-estate` above, and it was missing until 2026-08-21. /data/logs is
    # a Fly volume mount that exists in the engine container and on no other host, so the laptop's
    # 03:50 launchd run reached this source, found nothing, and exited saying "the ingest wrote
    # nothing yesterday" -- a claim about the ENGINE made by a host that cannot see it. Measured
    # that day: /data/logs held four 2026-08-20 files totalling 62 MB while the laptop said they
    # did not exist. `only_where` skips the fetch on the laptop and still GRADES the prefix there,
    # so a real stall on the engine is still caught from both hosts.
    only_where: /data/logs
    # 90 days of cold retention, and it is `keep:` rather than an R2 lifecycle rule on purpose.
    # A lifecycle rule lives in Cloudflare's console, where it cannot be read from a clone, does
    # not move with the estate, and nothing in this repo can grade it. `keep:` is enforced by
    # this job's own prune on every run, from a number that is in git. One daily object, so 90
    # copies is 90 days.
    keep: 90
    # 30, not 24, for the same reason as the watch entries below: an 86400s timer graded against
    # a 24h ceiling flickers red on ordinary drift, and a check that cries wolf gets muted.
    max_age_hours: 30

# ---------------------------------------------------------------------------------------------
# Prefixes ANOTHER job writes. Graded for freshness only: never fetched, never verified, never
# pruned, never deleted. `scripts/backup_store.py` writes the engine store's only offsite copy,
# and until 2026-08-19 nothing graded the result. The whole of the evidence was the job's exit
# code in its receipt, and an exit code says the job RAN, not that bytes LANDED — the same
# defect as the `verify: nonempty` default removed from this file the same day.
#
# Measured when this was written (2026-08-19T18:30Z), newest object per prefix:
#   ledger/    17 objects   0.7h old   29,027,771 B   ledger/prospector-2026-08-19.jsonl.gz
#   db/         9 objects   0.7h old      975,183 B   db/prospector-2026-08-19.db.gz
#   repo/       9 objects   0.4h old   66,664,795 B   repo/2026-08-19T180648Z.bundle
#
# TWO PREFIXES ARE DELIBERATELY ABSENT, and the reasons are the whole point:
#
#   dossiers/ — 4,480 objects, a content mirror keyed by dossier id, NOT a dated series. Its
#     newest-object age tracks ENGINE OUTPUT, not backup health: on a quiet day, or while the
#     moat is blind and nothing is being vetted, no new dossier is written, the newest object
#     stops moving, and this check would go red while the backup is perfectly healthy. A check
#     that goes red for the wrong reason gets muted, and a muted check is worse than none.
#
#   hermes/ — holds exactly one object, `leader.json`, 313 bytes: leader-election state that is
#     rewritten constantly and is not a backup of anything. Watching it would report GREEN
#     forever off a file that has nothing to do with Hermes state being recoverable. A false
#     green is the worst grade there is. Hermes state is genuinely NOT backed up; that is the
#     open M4 work, and it stays open rather than being papered over by this list.
#
# The three below ARE dated series — one new object per run — so "age of the newest object" is
# exactly "when did this backup last deposit bytes", which is the question.
watch:
  # 30 hours, not 24. These jobs run on an 86400s timer (deploy/engine/supervisord.conf), so a
  # 24h ceiling against a 24h period flickers red on ordinary drift and teaches everyone to
  # ignore it. 30h tolerates the drift and still catches a MISSED RUN, which reaches 48h.
  - name: engine-ledger
    prefix: ledger/
    writer: scripts/backup_store.py, supervisord [program:backup], daily
    why: >-
      The spend ledger, store/prospector.jsonl. It is what the daily spend cap is computed from,
      so losing it does not just lose history — it loses the rail that stops the daemon spending
      without limit. 29 MB compressed as of 2026-08-19.
    max_age_hours: 30

  - name: engine-store-db
    prefix: db/
    writer: scripts/backup_store.py, supervisord [program:backup], daily
    why: >-
      The engine's own catalogue database: which ideas exist, which passed, which are published
      and priced. Distinct from the money database at /data/store.db, which is fetched by the
      money-db source above.
    max_age_hours: 30

  - name: repo-mirror
    prefix: repo/
    writer: scripts/backup_store.py mirror_repo(), supervisord [program:backup], daily
    why: >-
      A `git bundle` of the whole repository, so the SOURCE survives losing GitHub as well as
      losing Fly. This is the half of DR that a database backup does not cover: restoring data
      with no code to run against it is not a restore.
    max_age_hours: 30

  - name: engine-logs
    prefix: logs/
    writer: scripts/backup_store.py archive_logs(), supervisord [program:backup], daily
    why: >-
      Every log line the estate has ever collected lives on one Fly volume,
      vol_42kyqo6g0kdzew14, and ops/automations/log_rotation.py deletes it at 14 days. So
      without this prefix, losing the volume loses the whole record and keeping the volume
      loses it anyway after a fortnight. One object per service per day,
      logs/<svc>-<day>.jsonl.gz, kept 90 days.
    # Same 30h as the three above, and the reason it is safe here is worth stating because the
    # `dossiers/` entry was REFUSED on exactly this ground. A content mirror's newest-object age
    # tracks engine output, so it goes red on a quiet day. This is a dated series: one new object
    # per service per day, uploaded the day after the file closes. The only way it stops moving
    # is that no service in the estate wrote a single line all day, and on a machine running the
    # scheduler, the consumer and the API that means the estate stopped, which is worth a red.
    max_age_hours: 30
