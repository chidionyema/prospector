# MOAT CHAIN (Part 9 failover): TRUSTED brains only. There is no cheap tail here any more.
#   claude_cli = TRUSTED moat (subscription CLI; rules kills/passes normally).
# When it cannot answer, verification raises ProviderExhaustedError and the candidate DEFERS,
# to be finished by `vet --resume` when the moat is back.
#
# minimax RE-ADDED 2026-08-08 (founder directive: "veridt should also have fallback", after
# being shown the 2026-08-06 arithmetic below and reaffirming). It is the "guardrailed
# emergency tail": a ruling it serves is stamped `provisional` by `is_provisional_provider`
# (`prospector/operator.py`), is refused by the publish gate (`run.py:528`, `not dossier.provisional`),
# and is auto re-vetted by the drain. Nothing untrusted can ever reach a customer.
#
# The 2026-08-06 arithmetic that removed it is UNCHANGED and still true — it is now an
# accepted cost, not a refuted claim:
#     provisional = one full verdict run now (minimax) + one full re-vet later (moat) = 2x
#     defer       = nothing now                        + one vet later (moat)         = 1x
# Both reach the SAME final answer, because a provisional ruling can never publish. Measured
# 2026-08-06: 38 provisional passes were queued behind a `vet --resume` drain, and the drain's
# own CLI load was implicated in the moat flapping that minted them.
#
# What the re-add buys, and it is the thing the arithmetic does not price: a DEFER stops the
# line. On 2026-08-08 claude_cli hit a monthly spend limit and every candidate in flight
# deferred, so the daemon produced nothing rulable for the duration. A 2x answer that arrives
# today beats a 1x answer that arrives whenever the subscription resets.
#
# The rails that keep this safe, all pre-existing and now under test:
#   * publish gate         run.py:528          — a provisional PASS never publishes
#   * drain preflight      run.py:1533         — TRUSTED-only; the drain refuses to re-vet into
#                                                a chain that can only re-stamp provisional
#   * generation preflight health.py           — un-blinded for the provisional tail (see
#                                                `trusted_only`), which is what makes the
#                                                fallback reach the daemon at all
# Known cost, stated as such: minimax is NON-DETERMINISTIC on structured routing at
# temperature 0 (4 of 6 candidates changed tier across 3 repeat runs; claude_cli 18/18
# identical). A provisional ruling it serves is a placeholder, not a second opinion.
#
# cursor_cli REMOVED 2026-08-06 (founder directive: "we need to get rid of cursor_cli"). It led
# this chain from 2026-07-30 and was measured DEAD on 2026-08-06 — a live probe of every
# configured brain, one JSON call each:
#     deepseek    RuntimeError: DeepSeek call failed: HTTP Error 402: Payment Required
#     cursor_cli  ProviderExhaustedError: cursor cli exit 1: ActionRequiredError:
#                 You've hit your usage limit
#     minimax     OK
#     claude_cli  OK
# The fallbacks did their job — nothing crashed — which is exactly why this went unnoticed: a
# chain whose first tier is dead looks identical to a healthy one from the outside, it just pays
# a guaranteed failure (and, until its breaker trips, a full timeout) before every single call.
# The adapter is deleted, not demoted; `_build_operator` raises an explicit error on the name so
# a stale config fails loudly instead of quietly building a shorter chain.
#
# PROMOTION GATE (to make a cheap model a TRUSTED primary, not just a fallback): see
# specs/offline-moat-validation.md and run, recording a clearance:
#   python -m prospector.golden --operator deepseek --fixtures fixtures/golden_fixtures.json --runs 3
#
# MINIMAX LEADS 2026-08-15 (founder: "ship with MiniMax running the whole show and claude a
# fallback"). Order IS call order, so this is the line that moves cost and latency: measured this
# day, minimax rules a check in ~6s at ~$0.0004 against claude_cli's ~15s at ~$0.14. claude_cli
# stays on the chain as the failover, not as the default payer.
operator: [minimax, claude_cli]
#
# WHICH of those tiers may rule FINALLY. Anything on `operator:` but NOT here is stamped
# `provisional` when it rules: it keeps throughput up during a moat outage, but never publishes on
# PASS and is auto re-vetted. Blank/absent => operator.MOAT_PRIMARY_DEFAULT (`claude_cli`), the
# single definition of the default. `PROSPECTOR_MOAT_PRIMARY=minimax` overrides for one process
# without touching this file (an experiment, not a promotion).
#
# CONFIG-DECLARED 2026-08-15. It was a hardcoded frozenset in operator.py with no config key —
# the only tier knob in the engine that needed a source edit and a daemon re-exec to move, while
# `operator:` / `noncritical_operator:` / `artifact_operator:` / `marketing_operator:` were all
# config lines. That is what made MiniMax's throughput unusable at any concurrency: widening the
# cheap chain cannot help while everything it rules is unpublishable by construction.
#
# CHANGING THIS LINE DECIDES WHAT MAY BE SOLD. The gate for adding a cheap brain is the PROMOTION
# GATE above (specs/offline-moat-validation.md), measured on the current parser — not a judgement
# that it "looked good in a run".
# PROMOTED 2026-08-15 (founder: "either we trust minimax or we don't, the aim is to replace
# claude basically"). minimax's rulings now publish on PASS instead of being stamped
# `provisional` and re-vetted by claude_cli — which is the whole point: its throughput was
# unusable at any concurrency while everything it ruled was unpublishable by construction.
# REVERT = delete `minimax` from this line. That stops FUTURE publishes immediately; packs
# already listed under the looser fence stay listed until unlisted deliberately.
moat_primary: [minimax, claude_cli]
# standardcompute REMOVED from this chain 2026-08-15 (founder directive), along with its adapter.
# It sat between claude_cli and minimax from 2026-08-08 ("fall back for claude ahead of minimax"),
# but STANDARDCOMPUTE_API_KEY is unset here and the free trial is spent — the tier answered live
# calls with an out-of-allowance upsell body instead of a completion, so it was a guaranteed
# failure paid before every fall-through rather than a failover. `_build_operator` now raises an
# explicit ValueError on the name; a stale plist or config fails at startup instead of quietly
# building a shorter chain. The paid Anthropic API tier `claude` went the same day, for the same
# reason (no ANTHROPIC_API_KEY) — `claude_cli`, the SUBSCRIPTION CLI, is a different tier and is
# untouched.
#
# WHAT THE FENCE IS NOW, so this comment cannot be read against the line above it: MOAT_PRIMARY is
# `[minimax, claude_cli]` — BOTH are trusted-final as of 2026-08-15, so neither stamps its rulings
# `provisional`. The fence has not been removed, it has been moved: `is_provisional_provider`
# (operator.py:1451) still stamps ANY ruler outside that list, and such a ruling never publishes on
# PASS (run.py:864) and is auto re-vetted. That is what keeps a future cheap tail safe. To promote
# a NEW cheap brain to trusted-final, the gate is the one named above
# (specs/offline-moat-validation.md), run against that provider on the current parser.
#
# The CHEAP chain: divergent generation, prescreen, scoring. Never rules a verdict — anything of
# its that reaches a ruling is stamped `provisional` (operator.py:1071), so the fence above does
# not apply here and the head may be the cheapest live brain rather than a trusted one. It lived
# in `run.py` as a module constant until 2026-08-10, which made the one knob whose entire subject
# is "what does the ancillary work cost" the only one that needed a source edit and a daemon
# re-exec to move, while every throughput knob beside it was a config line. Its head changed
# three times in two weeks (deepseek → claude_cli → standardcompute, all three since removed
# from it), each time by editing code
# to express a billing fact. Blank/absent => the historical default, byte for byte.
# 2026-08-14 — claude_cli REMOVED, not demoted (founder: "we are over using claude cli and we
# have Minimax, claude should never be used for non-critical"). This line had it at the HEAD as
# of 2026-08-13. A failover still runs: measured on the 2026-08-08 republish of 34 packs,
# claude_cli took 36 calls and 3227s of CLI wall-clock, ~90s each, at full moat price, for work
# that never rules a verdict. `prospector/run.py::_noncritical_order` also STRIPS claude_cli when
# it builds the chain, so editing this line back cannot quietly reinstate it.
#
# 2026-08-15 — standardcompute REMOVED too (founder directive), so this chain is minimax alone.
# It had been kept as the failover tier on the reasoning that "a chain of one is not a chain", but
# the tier was measurably out of allowance the whole time it sat here
# (store/provider_health_noncritical.json: strikes 4, last_error "You've used up your free trial"),
# so the chain was already one deep in practice and the second name only bought a guaranteed
# failed call. A name that cannot serve is not depth. If a real second cheap tier is funded, add
# it here — the key is config-driven precisely so that costs a config line, not a deploy.
# The residual exposure, stated so it is not discovered during an outage: if minimax fails,
# non-critical work raises ProviderExhaustedError and the signal is parked for `generate --resume`,
# rather than silently promoting a trusted brain into ancillary work. That is the intended
# behaviour, not a gap — but it does mean a minimax outage stops generation, not just slows it.
# NOTE: the moat (`operator:`) and the pack prose (`artifact_operator:`) are UNCHANGED — this
# directive is about ancillary work, and the £49 deliverable is not ancillary.
# DEPTH ADDED 2026-08-15. The line above described the residual exposure exactly, and the log
# then measured it: 231 terminal `Generation chain EXHAUSTED` against 67 for the two-tier moat
# chain over 2026-08-06..08-15. The difference is chain DEPTH, not model behaviour. `minimax_m27`
# is the second tier — the same MiniMax account and adapter, pinned to a DIFFERENT model, so an
# M3 stall does not imply it. It is slower (M3 8.1s vs M2.7 29.5s) and so must stay SECOND: it
# is a failover tier, never a routing choice. `minimax_fast` is NOT a name that can go here —
# it is a model_defaults FIELD, and `_build_operator` would raise `unknown operator`.
noncritical_operator: [minimax, minimax_m27]
model: ""                            # verdict brain model pin (blank = each CLI's default).
model_fast: ""                   # cheap model for query-gen/prescreen; blank = each provider's
                                 # own fast default (model_defaults.fast). Was deepseek-v4-flash.
model_version_tag: ""            # filled at runtime for audit

# Quality chain for the customer-facing £49 deliverable (build_spec / gtm_plan / ops_plan
# and the storefront listing_page). Subscription CLIs first, cheap tail behind them.
# Falls back to the moat operator if none are available.
artifact_operator: [claude_cli, minimax]

# Shelf and marketing copy — SPLIT off artifact_operator 2026-08-14 (founder: "isplit it but we
# needd strong guardrails to keep minimax. in check"). Measured live on 2026-08-13 the daemon ran
# four concurrent `claude -p` calls at ~90s each and three were writing listing/marketing copy: a
# card line and a headline, billed at the price of the £49 deliverable itself.
#
# THE GUARDRAIL IS NOT THIS LINE. `run.py::_generate_pack_content` grades what this chain writes
# against the SAME shelf bar `bridge.py` applies at publish time (`pack_linter.check_shelf_copy`,
# gated by `listing.shelf_copy_block_on_breach`), and a breach REGENERATES the copy on
# `artifact_operator` instead of publishing the pack UNLISTED. Cheap gets first refusal, never the
# last word — and a breach costs a rewrite, not a dead pack.
marketing_operator: [minimax, claude_cli]
                                  # cursor_cli removed 2026-08-06 (founder directive; it was at
                                  # its usage limit per the probe above, so it answered none of
                                  # the pack prose and every artifact call paid its failure
                                  # first). This chain runs against the NON-CRITICAL health
                                  # file, so a hiccup here can never blind the moat.
                                  #
                                  # minimax added 2026-08-08 (founder directive: "we can use
                                  # minimax for cheap vetting"). It REVERSES this file's earlier
                                  # "cheap non-critical tail is not used for pack prose" rule,
                                  # deliberately and with a narrower claim: claude_cli still
                                  # LEADS, so normal-path prose quality is unchanged; minimax
                                  # only answers when claude_cli is walled, where the previous
                                  # behaviour was that no pack was regenerated AT ALL. Measured
                                  # 2026-08-08: 9 packs sat unlisted on content defects while a
                                  # single-entry chain had nothing to fall back to.
                                  #
                                  # This is safe to make cheap ONLY because the pack lint is a
                                  # backstop that runs after generation and before minting
                                  # (bridge.py:820 content_ok, since 967457f): a weak minimax
                                  # pack fails currency/citation/completeness and stays UNLISTED
                                  # rather than reaching a buyer. Generation is non-critical by
                                  # the standing rule; NO VERDICT moves here. Regenerating a pack
                                  # re-uses the STORED verdict and never re-rules, so this chain
                                  # cannot change what a pack was judged to be — that, not the
                                  # identity of the brain, is why cheap copy is safe here.
                                  #
                                  # This clause used to read "safe because minimax is outside
                                  # MOAT_PRIMARY, so anything it RULES is provisional". That
                                  # became FALSE on 2026-08-15 when minimax was promoted into
                                  # `moat_primary:` above — and the safety argument was never
                                  # really about who minimax was. It is about this chain not
                                  # being on the verdict path at all. Stated the old way, the
                                  # comment would now read as "the fence is gone", which is the
                                  # wrong lesson: the fence (operator.py:1451) is intact and
                                  # still stamps every ruler outside the roster.

# --- Model defaults (Part: HARDCODED_MODEL_AUDIT_TICKET) ---
# Per-provider default model identifiers. Used as FALLBACK when model:/model_fast:
# are empty or unset for a given provider context.
model_defaults:
  # `claude` (the paid Anthropic API tier) removed 2026-08-15 with its adapter — see
  # prospector/operator.py. `claude_cli` takes no model pin from here.
  deepseek:     "deepseek-v4-pro"       # DeepSeekOperator default
  minimax:      "MiniMax-M3"           # MiniMaxOperator (full reasoning)
  minimax_fast: "MiniMax-M3"           # MiniMaxOperator (fast — also M3 per standing order)
  minimax_m27:  "MiniMax-M2.7"         # the `minimax_m27` operator kind — SECOND non-critical
                                       # tier only. Different model, NOT a faster one: measured
                                       # 2026-08-15 M3 8.1s vs M2.7 29.5s on a generation prompt.
  ollama:       "qwen2.5-coder:7b"     # OllamaOperator default
  # `standardcompute` removed 2026-08-15 with its adapter — see prospector/operator.py.
  search:
    deepseek:    "deepseek-v4-flash"
    minimax:     "MiniMax-M3"

retrieval:
  # Grounding chain — infra-controlled providers (re-verified live 2026-07-31):
  #   1. ddg         — DuckDuckGo real web search, FREE, no API key (needs `pip install ddgs`).
  #                    Fast primary (5.7s mean over 81 calls, audit 2026-07-30); rate-limits at
  #                    batch scale (15/96 errors that day) → falls through to (2).
  #   2. exa         — real web search API, ~2-4s, EXA_API_KEY. Credits are BACK: the
  #                    "402 NO_MORE_CREDITS" note below was true on 2026-07-02 and is no longer.
  #                    Live probe 2026-07-31: 5/5 queries, 3 results each, 2.1-4.2s.
  #   3. claude_cli  — real web search via the Claude Code SUBSCRIPTION (no key, no credits).
  #                    Guaranteed-available backstop; kept LAST so grounding coverage is
  #                    unchanged if both (1) and (2) are down. It is correct but SLOW.
  #
  # Why exa was inserted at position 2 (job 20260730T212901866, generate k=5, FAILED at 1731s):
  # 112 grounding calls; 81 resolved on ddg costing 460s total, but the 31 that fell through to
  # claude_cli cost ~3028s — 87% of all grounding time on 28% of the calls, 97.7s mean, 262s max.
  # At claude_concurrency=2 that queue alone is ~1514s of the 1731s wall, and the run finally died
  # on "claude cli slot acquire timed out after 45s (grounding queue saturated)". Replaying the
  # five most expensive of those queries through exa: 14.0s total vs 900s on claude_cli (64x),
  # identical result counts. This changes only HOW FAST the passages arrive — same real web
  # search, same results_per_query, same verdict rules, same publish gate. The moat is untouched.
  #
  # STILL DEAD on this machine (do NOT reintroduce without restoring the dependency):
  #   brave  → no BRAVE_API_KEY
  #   searxng→ not running (localhost:8888 refused)
  # deepseek/minimax_search/openrouter are LLM-synthesis, NOT real search — they hallucinate
  # URLs that _resolve() drops → every check "unverifiable". Never use them for grounding.
  # Options: ddg | claude_cli | exa | brave | searxng | fixture
  provider: [ddg, exa, claude_cli]
  queries_per_check: 2              # LLM query-gen: 2 distinct queries per check for grounding depth
  results_per_query: 3             # 3 sources per query (~6 passages/check) so checks can reach 'supported'
  max_passage_chars: 1500
  # FETCH THE PAGE, DON'T RULE ON THE SNIPPET (2026-08-13).
  # `_resolve()` sends a HEAD — it proves the host is real and never reads the body — so every
  # provider stored the search engine's ~220-char result blurb as "the passage". MEASURED over
  # 11,857 grounding passages since 2026-08-08: mean 222 chars, median 217, p90 281, 94.7%
  # under 300 chars. `max_passage_chars: 1500` above has therefore NEVER ONCE BOUND, and
  # `verify.VERDICT_PASSAGE_TRUNCATE = 600` means we were filling 37% of a per-passage budget
  # that was already sitting there. Consequence, from the dossiers: 67.5% of all checks ruled
  # `unverifiable`; grounding failures (moat_ungrounded + source_or_die) rose from 43.9% to
  # 54.6% of every kill; the PASS rate fell from ~19% (2026-08-01) to ~1% (2026-08-13). The
  # engine had never read a web page.
  # This can only ADD: a failed fetch keeps the snippet, so it cannot cost a source and cannot
  # manufacture an `unverifiable`. Uses `requests` + `lxml`, both already in the venv — no new
  # dependency. Never runs under fixtures (golden-set determinism).
  fetch_pages: true
  fetch_timeout_s: 8.0
  fetch_max_workers: 8
  # Only replace a snippet when the page yields materially more than we already had, so a
  # bot-wall answering 200 with an "enable JavaScript" shim cannot overwrite a real snippet
  # with less than it replaced.
  fetch_min_gain_chars: 400
  fetch_max_bytes: 400000
  # Rank what search returned instead of taking DuckDuckGo's first 3 (2026-08-14).
  # 3 x 3 = 9 results fetched per query, best 3 by query-term coverage kept. One wider
  # search call; no extra page fetch (ranking runs on the snippet, before the fetch) and
  # no LLM call. Measured lift on the ten worst live queries: 25.9% -> 36.8% coverage.
  relevance_overfetch: 3
  # Escalate to the NEXT provider when a result set barely mentions the query (2026-08-14).
  # Ranking picks the best of what one provider returned; it cannot rescue nine off-topic
  # pages. MEASURED over the 1,622 passages written since the page-fetch fix: 183 (11.3%)
  # share ZERO content words with their own query, and mean coverage by verdict is
  # supported 0.488 / refuted 0.447 / unverifiable 0.300. 0.35 sits between the
  # unverifiable median (0.298) and the supported p25 (0.400).
  # Paired replay of the 15 worst live queries, identical stack, cache off:
  # ddg 0.359 -> exa 0.525, exa better on 12/15 (ddg answered `4A's ANA agency members AI
  # content guidelines California` with fire.ca.gov; `UK AI Bill parliamentary progress
  # AISI` with two Wikipedia pages and visitbritain.com — exa returned bills.parliament.uk
  # and aisi.gov.uk). COSTS one extra metered Exa search on a below-floor query; the best
  # set seen is always returned, so it can never reduce a check's sources or DEFER it.
  min_relevance: 0.35
  cache: true
  cache_ttl_s: 1209600   # 14 days; cached grounding older than this is re-fetched (0 = never expire)
  # BATCHED LLM query-gen on the fast/non-critical tier (deepseek→minimax). ONE call per
  # candidate decomposes the idea into real-world domain queries for all checks at once.
  # Replaces the deterministic templates, which were PROVEN to restate the product pitch
  # ("productized transforms tenant answers adversarial") → search returns off-topic junk
  # (cambridge.org dictionary, web.whatsapp.com, diy.com) → ~93% unverifiable at batch scale.
  # The moat VERDICT brain is untouched (query-gen is a search string, not a ruling).
  llm_query_gen: true
  # template_checks stays populated: it is the GRACEFUL FALLBACK when the batched call fails
  # or omits a check (fast chain down) — those checks then use _DISCONFIRM/_CONFIRM templates
  # rather than hard-failing. With llm_query_gen=true the templates are the safety net, not
  # the primary path.
  template_checks: [pain_reality, value_durability, incumbency, payer_solvency, distribution, legality]
  fast_queries: 2                # 1 disconfirm + 1 confirm per check (template fallback)
  # E1 A/B arm (default OFF = control): entity-templated queries for the grounding-starved
  # checks. The experiment arm is [payer_solvency, distribution]; kill criterion in
  # docs/COMMERCIAL_READINESS_PROGRAM.md §3 E1.
  hybrid_entity_checks: []
  search_model: ""                   # SEARCH/grounding model (empty = use default).

  # --- Resilience layer (Part 9). All knobs live here — no hardcoded values in code. ---
  search_timeout: 75             # base seconds per web-search (attempt 0)
  search_timeout_max: 150        # adaptive ceiling: the timeout escalates per retry up to this
  search_timeout_escalation: 1.5 # slow≠dead — give each retry more headroom before giving up
  search_retries: 1              # in-place retries before failing over to the next provider
  claude_min_timeout: 120        # claude grounding floor (its search is slower)
  # Raised from 45/2/2/2 on 2026-07-31. These were pinned low DEFENSIVELY because the CLI
  # semaphores were a per-process threading.Semaphore: with the daemon, a backfill and a manual
  # generate all live at once, "2" meant a real machine-wide ceiling of ~8, and the resulting
  # oversubscription is what produced the 45s "grounding queue saturated" death in job
  # 20260730T212901866. prospector/cli_governor.py now enforces the cap machine-wide via fcntl
  # flock slot files (two-process proof: A acquired 2, B acquired 0, TOTAL 2 at limit=2), so a
  # higher number can no longer multiply across pipelines — surplus workers block on the
  # governor instead of thrashing the CLI. That is what makes raising these safe.
  #
  # 8 is the measured KNEE, not a guess. Concurrent `agent` subprocess probe, 2026-07-31:
  #   N=1  (at rest)  8.9s
  #   N=8   8/8 ok, p50  9.2s, max 15.5s, 5.3x throughput   <-- latency essentially flat
  #   N=14 14/14 ok, p50 13.1s, max 34.7s, 6.0x throughput  <-- p50 +42% to buy +13% throughput
  # No rate-limit or auth failure at either level; past 8 you pay latency for almost nothing.
  #
  # Vetting was 68% of the 1481s wall on the post-parallel-lane run (generation ~473s, vetting
  # ~1008s for 5 candidates in 3 sequential waves of 2). vet_workers 5 makes k=5 a single wave.
  # Kept BELOW cursor_concurrency so the daemon/backfill keep headroom under the shared cap.
  queue_timeout: 90              # max wait for a free provider slot before failing over. Raised
                                 # from 45: failing over now means falling to claude_cli at 97.7s
                                 # mean, so waiting up to 90s for a fast slot strictly beats it.
                                 # Bounds total latency at queue_timeout + search_timeout.
  # infra_defer_abort_streak: batch-level kill-fast on INFRASTRUCTURE (added 2026-08-06).
  # The 10:00 UTC batch that day vetted 14 candidates end-to-end and deferred ALL 14. The
  # non-critical chain that generates each check's search queries had been benched by a
  # monthly spend limit, so 52 of 98 checks never produced a query — and a check with no
  # query has no passages, which verify.py reports as retrieval_failed -> DEFER. Retrieval
  # itself was perfectly healthy (200/200 ddg searches `ok`, every completed search 5-42
  # passages). Nothing counted defers ACROSS candidates, so candidates 3..14 each re-learned
  # the same outage at full price, and all 14 landed in a backlog the drain pays for AGAIN.
  # 3 = stop after three consecutive infra-gated defers. 0 disables.
  infra_defer_abort_streak: 3
  # minimax_concurrency: the ceiling on the PRIMARY brain since 2026-08-15, so this is the knob
  # that sets engine throughput — claude_concurrency below now only bounds the failover.
  # MEASURED 2026-08-15 against the live endpoint, stepwise, counting 429s:
  #   width 2 → 0.07 calls/s · 4 → 0.60 · 6 → 0.89 · 8 → 1.36 (16/16 clean, ZERO 429s at 8).
  # The old default of 3 was scar tissue from a 429 storm on an UNKNOWN tier (2026-08-09) and had
  # never been re-measured against MiniMax. `PROSPECTOR_MINIMAX_CONCURRENCY` overrides for ops.
  minimax_concurrency: 8
  claude_concurrency: 4          # max concurrent claude CLI subprocesses (failover brain only
                                 # now that grounding resolves on ddg/exa — see chain above)
  # cursor_concurrency REMOVED 2026-08-06 with the cursor_cli adapter.
  vet_workers: 8                 # parallel candidates. RAISED 3 -> 8 (2026-08-15). The old 3 was
                                 # pinned to claude_concurrency (4) from when claude_cli was the
                                 # moat's PRIMARY. It no longer is: `moat_primary: [minimax,
                                 # claude_cli]` (:81) puts MiniMax at the head, and in the
                                 # 16:09Z tick MiniMax led 385 of 433 completion calls against
                                 # claude_cli's 48 (11%). The binding ceiling is therefore
                                 # minimax_concurrency (8, measured 16/16 clean, ZERO 429s at
                                 # :344), not the CLI's 4. Both limits are SEMAPHORES
                                 # (operator.py:1490 minimax, :1732 claude), so a vet that does
                                 # fall through to claude_cli QUEUES for a slot — it does not
                                 # error. The 2026-08-06 429 storm the old value guarded against
                                 # was measured when every vet hit the CLI; that premise is gone.
                                 #
                                 # WHY IT WAS COSTING: at 3 workers and ~251s/candidate
                                 # (measured — 16 vet completions over 3765s in the 16:09Z tick)
                                 # a tick finishes ~22 of a `schedule.batch_size` of 50. The
                                 # remainder is cancelled by the vet budget and parked as DEFER:
                                 # that one tick banked 13 verdicts and dumped 30 rows into a
                                 # backlog the drain clears 3 at a time. Generation was scaled
                                 # 15 -> 50 and the half that does the work was left behind.
  # Sized from the observed SUCCESS distribution, not a guess (317 logged run_cursor_cli
  # successes as of 2026-07-31: mean 46.9s, p50 41.7s, max 279.3s; run_claude_cli n=63,
  # p50 76.8s, max 283.0s). The old 120/180 pair sat *inside* that distribution, so long-but-
  # healthy calls were killed mid-flight — all 4 logged cursor errors have p50 exactly 120.0s,
  # i.e. the guillotine, not a hang. Each kill cost 2 x 120s and returned nothing, which is how
  # packs ended up held back on `artifact 'build_spec' is empty (generation produced nothing)`
  # and `marketing 'listing_page' is missing or empty`. Raising the ceiling does NOT slow the
  # median (p50 is 41.7s — the timeout only binds on the tail); it converts 240s of wasted
  # retry into a completed artifact.
  cli_timeout: 180               # completion-brain attempt 0 (verdict / adversarial; no web)
  cli_timeout_max: 300           # completion ceiling across retries — covers the observed max
  cli_retries: 1
  query_gen_timeout: 90          # non-critical query-gen cap — fail over / template, don't wedge
  query_gen_timeout_max: 90      # no escalation on query-gen
  query_gen_retries: 0           # template fallback is the retry path
  breaker_failure_threshold: 3   # CONSECUTIVE transient fails before a provider is retired (one
                                 # timeout under load no longer permanently dead-lists it)
  breaker_cooldown_s: 60         # seconds a retired provider stays out before a half-open recovery probe

# Citation ADMISSIBILITY at ruling time (programme doc §20, the Q4 lever). Decides which
# domains may be the SOLE basis of a supported/refuted ruling. It does NOT touch retrieval:
# §18 measured grounding as RELEVANCE-bound, so shrinking the fetched pool is the one
# intervention that provably cannot help. Every passage is still fetched, judged and stored;
# this only declines to TRUST a ruling whose every citation is an AI stats farm, dictionary
# chrome, or — for checks where it cannot be probative — a social post.
#
# Measured cost, ruled verdicts demoted over store/dossiers/*.json (§20.3, zero LLM):
#     P2_farm_only     0  (0.00%)  all eras | 0 (0.00%) current moat
#     P1_check_aware  12  (0.47%)  all eras | 1 (0.08%) current moat   <- SHIPPED
#     P0_global       52  (2.02%)  all eras | 17 (1.38%) current moat  <- do NOT ship
# P0 costs 4.3x P1 and pays it precisely in the channel checks (distribution 26,
# route_to_market 8) where user-generated content WAS the right source. `off` = pre-§20.
# An unrecognised value raises at startup (config.py _validate_admissibility) rather than
# silently disabling the gate.
admissibility:
  policy: P1_check_aware
  # A SECOND gate, about the CLAIM rather than the domain: a ruling that states a medical or
  # prevalence rate must cite at least one government, academic or established health body.
  # `8d5e24fbe6c1f5d3` cited jeffreydachmd.com ("Increasing Autism Rate is Caused by
  # Environmental Toxin Says RFK Jr") and playproject.org for the 1-in-31 US autism figure,
  # in a pack sold to people who will market to autism parents, while CDC pages sat unused in
  # the same source list. Both sit in the `other` tier, so `policy` above cleared them.
  # Measured cost 2026-08-14 over store/dossiers/*.json (offline, zero LLM): 6 of 3,476 ruled
  # and cited checks demote = 0.17%, i.e. cheaper than P1 and aimed at the brand risk.
  health_claims_need_primary: true
  # A THIRD gate, about the NUMBER of independent publishers. A `supported` ruling whose
  # citations all come from ONE registrable domain is demoted to unverifiable: three pages
  # from one site are one source, and every pack invites the buyer to click any SUPPORTED
  # claim and claim a refund if it does not say what we say it says.
  # Measured 2026-08-14, offline over 2,031 dossiers (tools/experiments/d5_corroboration.py):
  # 470 of 2,816 cited supported rulings (16.7%) rest on a single publisher — siterecon.ai,
  # sparkreceipt.com, facebook.com (23). Replaying all 75 PASS dossiers with those demoted
  # flips exactly ONE to KILL (b94760e86e62585a, NHS unpaid-hours audits, whose
  # value_durability cites nhsleavecalculator.co.uk twice plus two sibling calculator sites).
  # Set to 1 to disable, exactly as `policy: off` disables the tier gate.
  #
  # SHIPS OFF (1), 2026-08-14. At 2 the golden set scored 77.8% discrimination against the
  # required 100% and tests/sim/test_decay.py refreshed 0 dossiers instead of 1: the mock
  # fixtures cite one publisher per check (ok.com), so every ruling demotes to unverifiable
  # and the dossier is delisted on source_or_die. That is a fixture written before the floor
  # existed, not a defect in the floor — but golden-set discrimination regression blocks
  # ship, so the mechanism lands inert. Turn this to 2 in the SAME change that gives those
  # fixtures a second publisher; tests/unit/test_corroboration_floor.py pins both halves.
  corroboration_min_domains: 1
  # A lone source in these tiers needs no corroboration: legislation.gov.uk IS the answer on
  # legality, and requiring a blog to agree with it makes the evidence worse. Exempting these
  # two spares 67 government + 5 academic rulings at no extra cost — the flip count is 1
  # either way. `media` and `established_org` are deliberately NOT here: one newspaper
  # restating one press release is the correlated evidence this gate exists to catch.
  corroboration_exempt_tiers: [government, academic]

thresholds:
  # confidence_floor: KILL-SIDE lever only (kill_filter.is_hard_fail). A grounded killing
  # verdict (refuted) only HARD-kills when its confidence clears this floor; below it the
  # candidate falls through to scoring. Tunable for the value_durability over-restriction
  # wall (war-room 2026-06-15). Do NOT conflate with min_supported_confidence below.
  #
  # RAISED 0.0 -> 0.4 on 2026-08-07 (founder sign-off; E11 result, programme doc §17).
  # Calibration, not a product change: replaying store/dossiers/*.kill.json through the REAL
  # kill_filter.apply_gates (tools/experiments/e11_confidence_floor.py) over the 333 kills whose
  # gate reproduces under the shipped config gives 66 freed at 0.4 = 19.8%, against a firing-check
  # confidence distribution of p10 0.23 / p25 0.40 / median 0.55 / p90 0.70. So 0.4 retires the
  # bottom quartile and never touches the median kill. Freed at 0.4 by gate: incumbency=31,
  # value_durability=16, payer_solvency=7, legality=6, pain_reality=3 — concentrated in exactly
  # the two gates the 2026-06-15 war room flagged as over-restrictive (kill_filter.py:47-50).
  # This loosens KILLING, never PUBLISHING: freed candidates fall through to scoring, where
  # min_composite_to_pass and the adversarial gate still stand between them and the catalogue.
  # 0.5 frees 43.2% and is a PRODUCT decision, not a calibration — do not drift upward silently.
  # Supersedes the 2026-06-25 note that a 0.3 floor would un-kill 21/156 refuted-gate kills; that
  # measurement stands, it was simply taken before the pass-side laxness fix made it safe.
  confidence_floor: 0.4
  # min_supported_confidence: PASS-SIDE floor (dossier source-or-die only). A SUPPORTED
  # check counts as grounded — toward both the n>=min_supported_to_pass requirement and the
  # moat-grounded requirement — only when its confidence clears this floor. CALIBRATED
  # 2026-06-25 against the LIVE distribution over 504 supported checks in store/dossiers/:
  # median=0.43, p25=0.40, p10=0.30, max=0.79 — the live scale is COMPRESSED (~0.43), not
  # 0-1. 0.3 trims only the bottom-10% coin-flip tail (the conf-0.15 "supported" that minted
  # lax passes) while preserving the genuine 0.30-0.49 mass; 0.5 would void 76% of real
  # supported checks. Golden-safe (mock conf ~0.4 > 0.3). Decoupled from confidence_floor so
  # tightening passes never loosens kills.
  min_supported_confidence: 0.3
  min_composite_to_pass: 2.5

hard_gates:                      # Part 4 kill-filter; evaluated kill-fast in this order
  # A KILL must be grounded in CITED disconfirming evidence (refuted), never in
  # silence. `unverifiable` = "no matching passage" = no evidence to kill on, so it
  # must NOT be a killing verdict (doing so killed on silence and, under kill-fast,
  # let value_durability execute ~every candidate before any other gate ran).
  # See CLAUDE.md: "A KILL is not the model's opinion; it is grounded in evidence."
  # The killing verdict depends on the check's QUESTION FRAMING (models.py CHECKS):
  # All checks are instructed via verdict.md to use POSITIVE polarity:
  # "supported" = PASS (space is open, legal, durable, solvent)
  # "refuted"   = KILL (incumbent exists, illegal, obsolete, broke)
  # This unified polarity ensures all hard gates kill on `refuted`.
  # HISTORY, and a trap to not walk back into: legality once killed on `supported`, which
  # inverted it against the positive polarity above and killed LAWFUL ideas. Receipts on
  # disk: store/dossiers/459b72f3630d21be.kill.json (rationale: heirloom tomatoes are
  # "completely legal to grow, sell, buy, and eat anywhere in the United States") and
  # 7e603974bcde1e09 (rationale: "basic gardening work does not require a specific
  # licence") — both KILLED for being legal, at conf 0.43/0.42. The gate below is now
  # `[refuted]`, matching every other check. A creative-but-LAWFUL workaround (exploiting
  # a legitimate statutory mechanism) must SURVIVE; only a margin that requires actually
  # breaking law/terms or falsifying data is a kill, and that reads `refuted`.
  # Do NOT "fix" this back to `[supported]`: that is the bug, not the fix.
  - value_durability: [refuted]
  - incumbency: [refuted]
  - payer_solvency: [refuted]
  - distribution: [refuted]
  - legality: [refuted]

  - pain_reality: [refuted]
  - adversarial_decisive: false

weights:
  # RE-WEIGHTED 2026-06-25 to stop the composite structurally rewarding no-moat ideas.
  # The defect: automatability(.20) + build_feasibility(.10) = .30 of the composite paid
  # out for "trivially easy to build/automate" — which IS "trivially easy to clone" = no
  # moat — while defensibility (the only moat axis) was weighted just .15. A generic
  # AI-wrapper was the global maximum of that formula (e.g. meal-planner: automatability=5,
  # build_feasibility=5 contributed 1.50 of its 3.75). Fix: clonability-reward .30 -> .20,
  # moat .15 -> .25. defensibility now joins pain+money as the joint-top axis: a durable
  # business needs real pain, provable money, AND a defensible moat. Sum stays 1.00.
  pain_acuity: 0.20
  money_provability: 0.20
  automatability: 0.15
  distribution: 0.15
  defensibility: 0.25
  build_feasibility: 0.05

# ---- Ambition lanes (Part 14) ----
# The engine caters to the FULL spectrum of ideas — from £30 side-hustles to unicorn-
# potential ventures — by judging each candidate against the bar appropriate to its OWN
# ambition class, NOT one universal filter (think an Amazon catalogue: list anything, but
# each item is graded by its own class). The cross-lane invariant that never moves is
# source-or-die grounding; only WHICH claims must hold (the gate roles + thresholds) swaps.
# A lane overrides hard_gates / thresholds / weights; the top-level blocks above are the
# implicit default. `active_lane: ""` => default => byte-for-byte today's venture behaviour.
# MULTI-LANE BY DEFAULT: the catalogue is mixed-ambition (a buyer seeking a side hustle and a
# buyer wanting to launch a startup browse the SAME catalogue, each item graded by its own
# class). One run fans generation out across `active_lanes`, auto-classifies each idea into its
# natural tier, then vets each against THAT tier's bar. `active_lane` (singular) still pins a
# single lane and overrides active_lanes; empty active_lanes => single-default (venture) run.
active_lane: ""
active_lanes: [side_hustle, smb, growth, venture]
# Rebalanced 2026-08-01 (founder: "more startup ideas than just solo operator"). Weights are
# EVIDENCE-LED, from historical per-lane PASS rate across the 221 tier-tagged dossiers — NOT a
# guess at which tier sounds most ambitious:
#     smb  6/51 = 11.8%   growth 2/41 = 4.9%   side_hustle 4/94 = 4.3%   venture 0/35 = 0.0%
# So the weight goes to smb (small_team) and growth (startup) — the tiers that actually convert —
# while side_hustle (the SOLO lane) steps down from the largest share to the smallest. venture
# holds at 3 rather than rising: it has never produced a PASS, so buying more of it would buy
# more kills, not more startups; it stays funded only so the 0% stays measured rather than
# assumed. Revisit when venture records its first PASS.
# NOTE these numbers are WEIGHTS, not counts, whenever a total is passed explicitly — and the
# daemon always passes one (`run_scheduled.py:932` calls `run_signal(..., k=batch_size, ...)`).
# `run.py::_lane_counts` only returns this block verbatim when `k is None`; with a k it scales
# every lane by `k * quota[t] / sum(quota)`. Until 2026-08-15 the two readings coincided because
# the totals happened to sum to exactly `schedule.batch_size` (15), which is why this note used
# to claim a 1:1 distribution — that coincidence is gone.
# At `batch_size: 50` (2026-08-15, founder) the 3/5/4/3 ratio scales to side_hustle 10, smb 17,
# growth 13, venture 10, summing to 50 with no rounding nudge. Note this carries venture from 3
# to 10 despite the "do not over-buy" reasoning above: proportional scaling has no opinion about
# a lane's PASS rate. To hold venture down, change the WEIGHT here, not batch_size.
# Until 2026-08-01 this whole block was DEAD CONFIG for the daemon — see the comment in
# scheduler/run_scheduled.py::_default_generate.
lane_quota:                        # candidates generated per tier per multi-lane run
  side_hustle: 3                   # solo_agent  — was 4 (the largest share); now the smallest
  smb: 5                           # small_team  — was 3; best converter at 11.8%
  growth: 4                        # startup     — was 3
  venture: 3                       # startup     — unchanged; 0 PASS in 35, do not over-buy
lanes:
  venture:                         # unicorn-ambition: the durable-moat bar (= current default)
    hard_gates:
      - value_durability: [refuted]
      - incumbency: [refuted]
      - payer_solvency: [refuted]
      - distribution: [refuted]
      - legality: [refuted]
      - pain_reality: [refuted]
      - adversarial_decisive: false
    thresholds:
      confidence_floor: 0.4   # minimum confidence for a supported check to count as grounded
      min_composite_to_pass: 2.5
      min_supported_to_pass: 2  # source-or-die: need 2+ grounded-supported checks to PASS
    # Generation framing only — gates/thresholds above are untouched. startup archetype
    # lets venture ideas assume a founding team + capital (still judged on the moat bar).
    generation:
      operator_archetype: startup
  side_hustle:                     # £30-pack lane: judge DEMAND + DELIVERABILITY, not moat.
    # Commoditised, high-intent niches are GOOD here (lots of searchers/payers = the buyer),
    # so value_durability/incumbency are OFF. The real moat filter is the Stage-7 CAC test.
    hard_gates:                    # kill-fast: cheapest decisive demand signal first
      - buyer_intent: [refuted]    # nobody searching/paying => dead
      - currency: [refuted]        # stale/peaked trend => dead
      - route_to_market: [refuted] # no beginner-followable channel => dead
      - legality: [refuted]
      # margin requires genuine illegality => dead
      # adversarial stays DECISIVE, but lane-aware (see adversarial_directive): it must NOT
      # kill on "no moat / commoditised" (the wrong objection for a £30 pack — commoditised
      # = buyers exist), yet it MUST still kill on grounded DELIVERABILITY/DEMAND failure
      # (method doesn't work, channel dead, no demand, already free). Turning it fully off
      # let through a dishonest PASS whose own dossier refuted it.
      - adversarial_decisive: false
    # Re-frames the adversarial pass for the £30-pack bar: commoditisation is fine; kill
    # only on grounded evidence the thing won't deliver or sell. (Empty for venture.)
    adversarial_directive: >
      This candidate is a £30 INFO-PRODUCT PACK, not a venture. Commoditisation, absence
      of a moat or defensibility, low switching cost, or the fact that 'anyone could
      assemble this themselves' are NOT valid kill reasons here — buyers pay £30 for
      convenience, curation and a method they can follow. You may mark the case 'decisive'
      ONLY on grounded evidence of a DELIVERABILITY or DEMAND failure: practitioners report
      the method does not actually work as sold; the route/channel is closed, banned or
      being deprecated; there is no real buyer demand; or the promised outcome is already
      available FREE in a form buyers will use instead. Never mark 'decisive' for mere lack
      of a moat, novelty, or defensibility.
    score_checks:                  # run + score, never kill (soft signal for the composite)
      # claims_verifiable is SOFT here: its disconfirm query ("false OR contradicted")
      # structurally surfaces a negative for any niche, so it kills demand-real ideas on
      # "the space got more competitive" — a quality signal, not a kill criterion.
      - claims_verifiable
      - payer_solvency
      - distribution
      - pain_reality
    thresholds:
      confidence_floor: 0.4   # minimum confidence for a supported check to count as grounded
      min_composite_to_pass: 2.5
      min_supported_to_pass: 2  # source-or-die: need 2+ grounded-supported checks to PASS   # lower bar: a £30 pack is not a venture
      # Publish-critical (source-or-die at PASS): side_hustle judges DEMAND, not moat — so the
      # decisive grounded evidence is real buyer demand, NOT value_durability/incumbency (which
      # this lane deliberately does not run). Without this override no side_hustle idea can PASS.
      moat_critical_checks: [buyer_intent]
    # Lane-aware GENERATION: merged over the top-level `generation:` block (for_lane).
    # Re-aims generation at side-hustle-SCALE OPPORTUNITIES (the kind of opportunity), NOT
    # at "£30 packs" (the £30 pack is the downstream SELLING FORMAT, applied to every tier —
    # see listing/packs; it is NOT this lane's idea space). Decoupling these two axes is the
    # core correction: tier = scale of the opportunity; packaging = how we sell it.
    generation:
      operator_archetype: solo_agent   # side hustles stay one-person operable
      # lane_directive is injected at the top of generate_system.md and OVERRIDES the
      # venture moat language that follows. Empty for venture => prompt unchanged.
      lane_directive: >
        LANE OVERRIDE — IGNORE every durable-moat / wedge / defensibility / "kills ~80%"
        requirement stated anywhere below: it DOES NOT APPLY to this run. Generate
        SIDE-HUSTLE-SCALE OPPORTUNITIES: a specific thing ONE solo person can start with
        little capital, for supplemental or income-replacing earnings. Judge an idea ONLY on:
        (1) DEMAND — are real people actively searching for or already paying for this RIGHT
        NOW; (2) DELIVERABILITY — can a beginner follow an OPEN route to the promised outcome;
        (3) CURRENCY — is it live now, not a peaked fad. Commoditised, crowded, "anyone could
        do it" niches are GOOD here (crowds = buyers). Each idea must name a SPECIFIC, concrete
        opportunity (the exact niche + the exact thing sold/done) — never a platform,
        marketplace, registry, or venture. Span DIVERSE forms; do NOT collapse to one format.
        Favour sharp, non-obvious opportunities over the tired top-10 side hustles.
      # Side-hustle-SCALE opportunity forms (what the solo operator actually DOES/sells) —
      # NOT "£30 pack" deliverable formats. The £30 pack packages any of these for sale.
      structural_forms:
        - local_service          # a hands-on local service one person can deliver
        - micro_ecommerce        # a small niche product store (print-on-demand, dropship, handmade)
        - productized_freelance  # a freelance skill sold as a fixed-scope, repeatable product
        - content_channel        # a monetised audience in a specific niche (ads/sponsor/affiliate)
        - niche_micro_saas       # a tiny single-workflow tool for one underserved niche
        - marketplace_seller     # selling into an existing marketplace's built-in demand
        - rental_arbitrage       # renting/reselling an asset or access for a spread
        - info_product           # a course/templates/kit teaching one valuable skill
  smb:                             # small-business lane: a real 1–20-staff business that throws
    # off genuine owner income. Bar above side_hustle: demand is not enough — the PAYER must be
    # solvent and there must be a real route to customers (both HARD). A deep moat is still NOT
    # required (commoditised-but-profitable small businesses are fine); the kill is no real
    # business / broken unit economics, surfaced by the adversarial pass.
    hard_gates:                    # kill-fast: cheapest decisive signal first
      - buyer_intent: [refuted]    # nobody searching/paying => dead
      - payer_solvency: [refuted]  # payer has no budget/motive => no business
      - distribution: [refuted]    # no real route to the customer => dead
      - legality: [refuted]
      # margin requires genuine illegality => dead
      - adversarial_decisive: false
    adversarial_directive: >
      This candidate is a SMALL BUSINESS (roughly 1–20 staff) meant to throw off real owner
      income, NOT a venture-scale company. Commoditisation, absence of a durable moat, low
      switching cost, or 'anyone could compete' are NOT valid kill reasons — plenty of
      profitable small businesses are commoditised. You may mark the case 'decisive' ONLY on
      grounded evidence of a real-business failure: the unit economics cannot clear a living
      owner income (costs/CAC exceed achievable margin), there is no reachable paying customer
      base, the route to customers is closed/banned, or the demand is not real. Never mark
      'decisive' merely for lack of a moat, novelty, or defensibility.
    score_checks:                  # run + score, never kill
      - pain_reality
      - currency
      - route_to_market
      - claims_verifiable
    thresholds:
      confidence_floor: 0.4   # E11-calibrated 2026-08-07, founder sign-off (see thresholds note, §17)
      min_composite_to_pass: 2.6   # above side_hustle (2.0), below growth/venture
      # Publish-critical (source-or-die at PASS): smb's headline is "the PAYER must be solvent"
      # — that is the decisive grounded evidence to publish, NOT value_durability/incumbency
      # (this lane deliberately does not run them; a deep moat is explicitly NOT required).
      # Without this override no smb idea can PASS (proven 2026-06-28, Martyn's Law @ 2.95).
      moat_critical_checks: [payer_solvency]
    generation:
      operator_archetype: small_team   # 2–10 people; some capital OK — matches 1–20 staff bar
      lane_directive: >
        LANE OVERRIDE — IGNORE every durable-moat / wedge / defensibility / "kills ~80%"
        requirement below: it DOES NOT APPLY here. Generate SMALL-BUSINESS OPPORTUNITIES — a
        venture one founder (optionally a tiny team) can build into a real business of roughly
        1–20 people that pays a genuine owner income. Judge an idea ONLY on: (1) DEMAND — real
        people/firms actively paying for this now; (2) VIABLE UNIT ECONOMICS — a believable
        margin after delivery cost and customer acquisition; (3) A REAL ROUTE TO CUSTOMERS a
        small operator can actually work. A durable moat is NOT required — commoditised but
        profitable is fine. Name a SPECIFIC, concrete business (who it serves + what it sells),
        never a platform, marketplace, registry, or venture-scale play. Span DIVERSE forms.
      structural_forms:
        - productized_service    # a done-for-you outcome sold as a repeatable product
        - local_service_chain    # a hands-on service that can grow past one operator
        - vertical_tool          # narrow software for one workflow in one niche
        - b2b_service            # an ongoing service sold to other small businesses
        - ecommerce_brand        # a niche product brand with repeat purchase
        - specialist_agency      # a focused agency owning one specific deliverable
        - niche_distribution     # sourcing/reselling into an underserved channel
        - equipment_or_rental    # an asset-backed service or rental operation
  growth:                          # growth-startup lane: venture-track, must show a REPEATABLE,
    # scalable growth motion (a channel that compounds + retention), but NOT yet a deep moat.
    # Bar above smb: acute pain is now HARD. The kill is no scalable channel / no retention.
    hard_gates:
      - pain_reality: [refuted]    # no acute, real pain => no growth engine
      - payer_solvency: [refuted]
      - distribution: [refuted]    # no scalable route => not a growth business
      - legality: [refuted]
      - adversarial_decisive: false
    adversarial_directive: >
      This candidate is a GROWTH-STAGE STARTUP that must show a REPEATABLE, SCALABLE growth
      motion — but a deep durable moat is NOT yet required (early growth companies often lack
      one). Do NOT kill merely for absence of a moat or defensibility. You may mark the case
      'decisive' ONLY on grounded evidence that growth cannot compound: there is no scalable,
      repeatable acquisition channel (only manual/unscalable selling), or no plausible
      retention (one-shot demand, churn that kills the motion), or the acute pain is not real.
    score_checks:
      - value_durability
      - incumbency
      - currency
      - buyer_intent
      - claims_verifiable
    thresholds:
      confidence_floor: 0.4   # E11-calibrated 2026-08-07, founder sign-off (see thresholds note, §17)
      min_composite_to_pass: 2.9   # above smb (2.6), just below venture (3.2)
      # Publish-critical (source-or-die at PASS): growth's headline is a SOLVENT PAYER on a
      # SCALABLE CHANNEL — a deep moat is explicitly NOT yet required (314-320). Decisive grounded
      # evidence = payer_solvency OR distribution. growth DOES run value_durability/incumbency as
      # soft score_checks, but requiring them grounded would contradict "moat not required".
      moat_critical_checks: [payer_solvency, distribution]
    generation:
      operator_archetype: startup      # founding team + capital OK; still no deep-moat demand
      lane_directive: >
        LANE OVERRIDE — a deep durable moat is NOT required for THIS run; do not demand one.
        Generate GROWTH-STARTUP OPPORTUNITIES — ventures that can grow fast via a REPEATABLE,
        SCALABLE motion. Judge an idea on: (1) ACUTE PAIN a defined segment feels now; (2) a
        SOLVENT, MOTIVATED PAYER; (3) a SCALABLE, REPEATABLE acquisition CHANNEL (self-serve,
        a forcing function, an existing high-volume channel) — not manual one-off selling;
        (4) plausible RETENTION (the need recurs / the product compounds). A deep moat can come
        later. Name a SPECIFIC, concrete startup (segment + product + growth motion). Span
        DIVERSE forms; do NOT collapse to one shape.
      structural_forms:
        - vertical_saas          # software for one industry's core workflow, self-serve growth
        - plg_tool               # a product-led tool with built-in viral/self-serve acquisition
        - transactional_platform # takes a cut of a transaction it uniquely originates/de-risks
        - prosumer_tool          # a tool for prosumers/creators with bottoms-up adoption
        - api_product            # an API/infra product developers adopt and embed
        - data_workflow          # a compounding-data product that improves with usage
        - marketplace_thin       # a focused marketplace seeding one liquid niche first
        - vertical_service_scaled # a service productised toward a scalable delivery model

# ---- Markets (Epic D) ----
# A market is the JURISDICTION an opportunity lives in. It is orthogonal to BOTH the
# ambition lane (which sets the bar) and the buyer's locale — a Texas-arbitrage pack is an
# opportunity in Texas whoever buys it (opportunity-market != buyer-market).
#
# THIS COMMENT USED TO SAY the pack is "still sold in GBP through the existing Stripe rail".
# Founder, 2026-08-14: that is WRONG, and it had been read as a design statement rather than
# the description of a gap. The standing decision (2026-08-10) is that a US buyer's CARD IS
# BILLED IN USD, not merely shown a converted price. Today the storefront already displays
# USD (Store.Web/src/lib/fx.ts:70-74, verified live) while the rail still charges GBP — a US
# buyer sees $190 and is billed £149. That is the defect, not the intent.
#
# Nothing in this markets block controls it: `currency_hint` below is the OPPORTUNITY's
# money — what the evidence is denominated in — never the buyer's. The charge-side change is
# a design job before it is an edit (a second Stripe Price or currency_options, a currency
# column on the catalogue row, and a USD rung set, with the fulfilment fence matching on
# price). See memory `us-buyers-billed-in-usd-decision.md`.
#
# A market configures the EVIDENCE TERRAIN (authority domains, search region, legality
# corpus) and the PROMPT FRAMING. It may NOT configure the bar: hard_gates / thresholds /
# weights inside a market block are a LOAD ERROR (config.py::_validate_markets). A market
# with no evidence gets no catalogue — never a lowered threshold.
#
# Codes are hierarchical: "us-tx" inherits everything "us" declares. A market is CLOSED
# until a readiness probe writes a passing store/markets/<code>/READINESS.json.
active_market: ""                  # "" => markets.default
markets:
  default: uk
  uk:
    label: "United Kingdom"
    status: open                   # the pre-existing baseline market
    readiness_ref: ""              # no probe required: this is the calibration anchor
    # "us-en" is the ddgs 9.14.4 DEFAULT that UK grounding has silently run under
    # (ddgs/ddgs.py:357 — DuckDuckGoSearchProvider never passed a region). Pinned here to
    # preserve current behaviour EXACTLY. Flipping this to "uk-en" is a measured yield
    # change that must move cache_salt with it — see specs/multi-market-dimension.md D4.2.
    search_region: "us-en"
    currency_hint: "GBP"
    cache_salt: ""                 # MUST stay "" so the existing store/_cache stays valid
    authority_domains:             # UNIONED with the global base set in retrieval.py
      - gov.uk
      - legislation.gov.uk
      - ons.gov.uk
      - hse.gov.uk
      - companieshouse.gov.uk
      - fca.org.uk
    legality_corpus: [legislation.gov.uk, gov.uk]
    market_context: >
      Jurisdiction: the United Kingdom. Money in GBP (£). Authoritative public evidence
      includes gov.uk guidance, legislation.gov.uk, ONS statistics, HSE, Companies House
      filings, and FCA registers.
    exemplars:
      query_gen:
        - "NHS nurse pension additional voluntary contributions take-up UK"
        - "medication fridge temperature monitoring market vendors UK"
      verdict_irrelevant_candidate: "Probate clearance services in the UK."
      verdict_irrelevant_passage: "The UK housing market saw a 2% rise in mortgage rates in Q3."
      verdict_irrelevant_why: >
        The text mentions UK and housing but has ZERO conceptual overlap with death,
        estates, executors, or clearance.
      verdict_relevant_candidate: "Fixed-fee probate clearance for UK Executors."
    persona_overlay:
      retiree_cohort: >
        UK state pension plus private pension drawdown; ISA/property wealth; NHS-funded
        care assessed by the local authority.
  us:
    label: "United States"
    status: open                 # opened only by a passing readiness probe
    readiness_ref: "store/markets/us/READINESS.json"
    search_region: "us-en"
    currency_hint: "USD"
    cache_salt: "us"
    # US law is federal PLUS 50 states. Without state-level scoping the legality check
    # drowns in irrelevant federal/other-state material (story risk 3).
    require_subdivision: true
    # `subdivisions` maps a market CODE to the jurisdiction's NAME, and exists because the
    # code alone never reached the model. A subdivision inherits its parent's whole block
    # including `label`, so before 2026-08-14 `market_kwargs("us-tx")` and
    # `market_kwargs("us-ca")` were byte-identical on every key: the state reached the
    # dossier stamp and the retrieval namespace, and the model was left to pick a state
    # from its own prior. It picked one. MEASURED over the 146 us dossiers on disk: 63%
    # named no state at all, and of the 54 that did, California took 40 against Texas 10,
    # New York 3, Illinois 2, Florida 1 — while the ONLY worked examples in
    # prompts/markets/us/query_gen_exemplars.md are Texas. A name here is not a market
    # claim (prompts.py builds market_scope from names alone), so this is admissible to
    # the moat: without it a verdict cannot tell that a California passage is irrelevant
    # to a Texas candidate.
    #
    # Listing a code here does NOT schedule it — `schedule.market_rotation` does. Codes
    # beyond the current rotation are declared so the rotation can be widened without a
    # code change.
    subdivisions:
      us-tx: "Texas"
      us-ca: "California"
      us-fl: "Florida"
      us-ny: "New York"
      us-il: "Illinois"
      us-pa: "Pennsylvania"
      us-oh: "Ohio"
      us-ga: "Georgia"
      us-nc: "North Carolina"
      us-mi: "Michigan"
      us-wa: "Washington"
      us-az: "Arizona"
    # Retrieval overlay — evidence terrain only (DD2). Slightly deeper fetch so state
    # .gov / CMS / SEC pages are likelier to land in the passage set; does NOT touch bars.
    retrieval:
      results_per_query: 5
    authority_domains:
      - sec.gov
      - census.gov
      - bls.gov
      - federalregister.gov
      - ftc.gov
      - cms.gov
      - sba.gov
      - dol.gov
      - fincen.gov
      - consumerfinance.gov
      - courtlistener.com
      - usa.gov
      - law.cornell.edu
      # State / program regulators used by the US calibration packs (authority_rate).
      - irs.gov
      - tdlr.texas.gov
      - texas.gov
      - sos.texas.gov
    legality_corpus: [federalregister.gov, law.cornell.edu, usa.gov, sec.gov, cms.gov, fincen.gov, consumerfinance.gov, irs.gov]
    market_context: >
      Jurisdiction: the United States. Money in USD ($). Law is federal PLUS state-level —
      always name the state. Authoritative public evidence includes SEC EDGAR, Census, BLS,
      CMS, FinCEN, CFPB, the Federal Register, IRS, state Secretary-of-State and licensing
      boards (.gov such as TDLR), and CourtListener. Prefer primary .gov pages over vendor blogs.
    exemplars:
      query_gen:
        - "Texas TDLR cosmetology operator license renewal continuing education hours site:tdlr.texas.gov"
        - "IRS Form 2290 heavy highway vehicle use tax due date owner operator site:irs.gov"
        - "CMS DMEPOS supplier standards accreditation survey checklist site:cms.gov"
        - "FinCEN money services business registration requirement site:fincen.gov"
        - "FCRA consumer report resale prohibition site:consumerfinance.gov"
      # Verdict exemplars deliberately omitted: they teach RELEVANCE JUDGEMENT, not market
      # facts, so this market inherits the uk set until its probe justifies its own.
    persona_overlay:
      retiree_cohort: >
        Social Security plus 401(k)/IRA drawdown; Medicare at 65 with supplemental
        coverage; state-variable long-term-care funding.
  # Closed stubs — MVP evidence terrain so each is probe-openable later via the same
  # gate. Status stays closed until a passing READINESS.json; no catalogue writes, no
  # lowered bars. Fill country-specific authority/exemplars before probing a subdivision.
  africa:
    label: "Africa (regional)"
    status: closed
    readiness_ref: "store/markets/africa/READINESS.json"
    search_region: "wt-wt"
    currency_hint: "USD"
    cache_salt: "africa"
    require_subdivision: true      # always name the country (africa-ng, africa-ke, …)
    authority_domains:
      - afdb.org                   # African Development Bank
      - uneca.org                  # UN Economic Commission for Africa
      - au.int                     # African Union
      - worldbank.org
    legality_corpus: [africanlii.org, au.int]
    market_context: >
      Jurisdiction: African markets (regional framing). Prefer country-specific evidence
      when a subdivision is named — always name the country. Money often quoted in USD
      or local currency. Authoritative public evidence includes AfDB, UNECA, AU instruments,
      national statistics offices, central banks, and company registries.
    exemplars:
      query_gen:
