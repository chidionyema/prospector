name: Unstick CI runs that can never finish

# THE ROOT CAUSE THIS FIXES.
#
# A workflow run has its own status, separate from its jobs. When a job is cancelled while it is
# still waiting for a self-hosted runner, no runner ever picks it up, so nothing reports the run
# as finished. Every job reads `cancelled` and the RUN stays `queued`, forever.
#
# That would be harmless if it did not hold a lock. `ci.yml` groups on the pull request ref, so
# the stuck run owns the concurrency group for that PR. The next run for the same PR sits at
# `pending` and is never scheduled, however many runners are free.
#
# Measured 2026-08-18 on PR #312:
#
#   run 32089094290  status=queued   all 8 jobs conclusion=cancelled   (stuck, holding the group)
#   run 32090068739  status=pending  0 jobs started                    (blocked behind it)
#
# `POST /actions/runs/{id}/cancel` does not clear it -- a graceful cancel is what it is already
# waiting on. `POST /actions/runs/{id}/force-cancel` does, and the blocked run moved from
# `pending` to `queued` within twenty seconds.
#
# Doing that by hand is not a fix. The PR looks like it is queued behind a busy box, which is the
# normal state here, so nobody looks at the run status until someone asks why a PR has not moved
# in an hour. This sweeps for the signature instead.
#
# THE SIGNATURE, and why it cannot hit a healthy run. A run that is genuinely waiting has jobs in
# `queued`. A stuck run has a non-terminal run status and NO job that is still queued or running.
# The age floor is there for the gap between a run being created and its jobs appearing.

on:
  schedule:
    # Four times an hour. The cost is one API call plus one call per live run; the thing it
    # prevents is a pull request sitting dead for as long as nobody looks.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  actions: write         # force-cancel, re-run
  contents: write        # merge
  pull-requests: write   # merge

concurrency:
  group: ci-unstick
  cancel-in-progress: false

jobs:
  unstick:
    # The light pool. This job is a handful of API calls and must never queue behind the twenty
    # minute python job -- a sweep that waits for a runner cannot free runners.
    runs-on: ${{ vars.CI_LIGHT_RUNS_ON || vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Force-cancel runs whose jobs are all finished but whose run is not
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # Ops-driven: raise MIN_STUCK_MINUTES from repository variables if a legitimate run is
          # ever caught. Do not edit this file to tune it.
          MIN_STUCK_MINUTES: ${{ vars.CI_UNSTICK_MIN_MINUTES || '10' }}
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          stuck=0
          checked=0
          for status in queued in_progress pending; do
            ids=$(gh api "repos/$REPO/actions/runs?status=$status&per_page=100" \
                    --jq '.workflow_runs[].id' 2>/dev/null || true)
            for id in $ids; do
              checked=$((checked + 1))
              created=$(gh api "repos/$REPO/actions/runs/$id" --jq '.created_at' 2>/dev/null || echo "")
              [ -n "$created" ] || continue
              age=$(( (now - $(date -u -j -f '%Y-%m-%dT%H:%M:%SZ' "$created" +%s 2>/dev/null \
                     || date -u -d "$created" +%s)) / 60 ))
              if [ "$age" -lt "$MIN_STUCK_MINUTES" ]; then
                echo "run $id is $age min old, under the $MIN_STUCK_MINUTES min floor -- leaving it"
                continue
              fi
              # A run that still has work pending is healthy, whatever its own status says.
              live=$(gh api "repos/$REPO/actions/runs/$id/jobs?per_page=100" \
                       --jq '[.jobs[] | select(.status != "completed")] | length' 2>/dev/null || echo 1)
              if [ "$live" -gt 0 ]; then
                echo "run $id ($status, $age min): $live job(s) still live -- healthy"
                continue
              fi
              echo "run $id ($status, $age min): every job finished but the run has not. Forcing."
              gh api -X POST "repos/$REPO/actions/runs/$id/force-cancel" >/dev/null 2>&1 \
                && { echo "  force-cancelled $id"; stuck=$((stuck + 1)); } \
                || echo "  could not force-cancel $id (finished on its own?)"
            done
          done
          echo "checked $checked live run(s), force-cancelled $stuck"

      # ────────────────────────────────────────────────────────────────
      # STARVATION. The second failure mode, and the one that cost the most time on 2026-08-18.
      #
      # Four runner slots, four agents pushing, and a full PR run costs about 52 minutes of runner
      # time. A job can sit waiting for a slot and then be cancelled without a runner ever picking
      # it up. `gh pr checks` prints a cancelled job as "fail", so the pull request reads BROKEN
      # when nothing ran at all.
      #
      # Measured, PR #310, run 32088565512:
      #   job 'changes'  conclusion=cancelled  runner_name=NONE  queued 14 minutes
      #   its log:       BlobNotFound -- there is no log, because the job never started
      #
      # The signature is exact and cannot match a real failure: conclusion=cancelled AND
      # runner_name empty AND steps never started. A job that ran and failed has a runner name.
      #
      # Re-run once only. If the box is genuinely full for good, retrying forever makes it worse,
      # and one retry is enough to distinguish a starved run from a saturated estate.
      - name: Re-run pull requests whose jobs were cancelled before any runner took them
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          MAX_ATTEMPTS: ${{ vars.CI_STARVE_MAX_ATTEMPTS || '2' }}
        run: |
          set -euo pipefail
          rerun=0
          open_shas=$(gh api "repos/$REPO/pulls?state=open&per_page=100" --jq '.[].head.sha')
          [ -n "$open_shas" ] || { echo "no open pull requests"; exit 0; }
          for sha in $open_shas; do
            read -r id attempt concl <<<"$(gh api \
              "repos/$REPO/actions/runs?head_sha=$sha&per_page=1" \
              --jq '.workflow_runs[0] | "\(.id) \(.run_attempt) \(.conclusion // "-")"' 2>/dev/null || echo "")"
            [ -n "${id:-}" ] && [ "$id" != "null" ] || continue
            [ "$concl" = "cancelled" ] || continue
            if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
              echo "run $id already on attempt $attempt -- leaving it, the estate is saturated"
              continue
            fi
            starved=$(gh api "repos/$REPO/actions/runs/$id/jobs?per_page=100" \
              --jq '[.jobs[] | select(.conclusion == "cancelled" and ((.runner_name // "") == ""))] | length')
            ran=$(gh api "repos/$REPO/actions/runs/$id/jobs?per_page=100" \
              --jq '[.jobs[] | select((.runner_name // "") != "")] | length')
            if [ "$starved" -gt 0 ] && [ "$ran" -eq 0 ]; then
              echo "run $id: $starved job(s) cancelled with no runner, 0 ever scheduled -- starved, re-running"
              gh api -X POST "repos/$REPO/actions/runs/$id/rerun" >/dev/null 2>&1 \
                && { echo "  re-run queued"; rerun=$((rerun + 1)); } \
                || echo "  re-run refused"
            fi
          done
          echo "re-ran $rerun starved run(s)"

      # ────────────────────────────────────────────────────────────────
      # LANDING. Merging a green pull request by hand is manual intervention too.
      #
      # This plan has no branch protection, so GitHub's own auto-merge is unavailable (the API
      # answers 403 "Upgrade to GitHub Pro or make this repository public"). This is the
      # substitute, and it is deliberately OPT-IN: only a pull request carrying the `automerge`
      # label is considered. Nothing lands because a sweep decided it should.
      #
      # It merges only on mergeable=MERGEABLE, zero failing checks and zero pending checks, so a
      # pull request whose CI has not finished is never touched.
      - name: Merge pull requests labelled automerge once every check is green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          # NOT `set -e`. A janitor that cannot land a pull request must not paint main red.
          # It did, every fifteen minutes from 05:03 on 2026-08-18, and a red main blocks every
          # landing through the rule-guard fence -- so the sweep that exists to unstick the queue
          # was itself the thing holding six pull requests shut. Its own failure is now a printed
          # line, and only a genuine crash in this script can fail the job.
          #
          # REST, not `gh pr list` / `gh pr view`. Those go through GraphQL, and GraphQL is what
          # answered `Resource not accessible by integration (HTTP 403)` on the very first call.
          # The step logged no line at all before dying, which is how we know it was the list and
          # not the landing. The two steps above this one use `gh api` with the same GITHUB_TOKEN
          # and the same permissions block, and both succeed on every run, so REST is the access
          # path this token demonstrably has.
          prs=$(gh api "repos/$REPO/pulls?state=open&per_page=100" \
                  --jq '.[] | select([.labels[].name] | index("automerge")) | .number') || {
            echo "cannot list pull requests -- skipping the landing sweep"; exit 0; }
          [ -n "$prs" ] || { echo "no pull request carries the automerge label"; exit 0; }
          for pr in $prs; do
            info=$(gh api "repos/$REPO/pulls/$pr" --jq '"\(.mergeable) \(.mergeable_state) \(.head.sha)"') || {
              echo "#$pr: cannot read -- skipping"; continue; }
            read -r mrg st sha <<<"$info"
            # REST `mergeable` is a BOOLEAN, and it is null while GitHub is still computing the
            # candidate commit. Null means ask again in fifteen minutes, never go ahead.
            if [ "$mrg" != "true" ]; then
              echo "#$pr mergeable=$mrg state=$st -- not ready"
              continue
            fi
            checks=$(gh api "repos/$REPO/commits/$sha/check-runs?per_page=100" \
              --jq '[.check_runs[] | {s: .status, c: (.conclusion // "")}]') || {
              echo "#$pr: cannot read checks -- skipping"; continue; }
            pending=$(echo "$checks" | jq '[.[] | select(.s != "completed")] | length')
            failed=$(echo "$checks"  | jq '[.[] | select(.c == "failure" or .c == "timed_out" or .c == "cancelled")] | length')
            total=$(echo "$checks"   | jq 'length')
            if [ "$total" -eq 0 ] || [ "$pending" -gt 0 ]; then
              echo "#$pr: $pending of $total check(s) still running -- waiting"
              continue
            fi
            if [ "$failed" -gt 0 ]; then
              echo "#$pr: $failed failing check(s) -- not landing"
              continue
            fi
            echo "#$pr: $total check(s), all green -- landing"
            gh api -X PUT "repos/$REPO/pulls/$pr/merge" -f merge_method=squash >/dev/null \
              && echo "  landed #$pr" || echo "  refused"
          done
