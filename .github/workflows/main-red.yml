# WHEN MAIN GOES RED, SAY SO WHERE EVERY AGENT WILL SEE IT.
#
# Twice on 2026-08-19 a red main went unannounced and every open pull request inherited it.
#
#   1. PR #425's `run.sh || true` assertion. Twelve pull requests showed `python=F`. A session
#      read that as queue congestion and cloned six Fly machines to add capacity that was never
#      short. One job log would have named the shared test.
#   2. `npm audit --audit-level=high` in the `nextjs` job, merged in #393 on a run whose five
#      heavy jobs were all CANCELLED, so nothing graded it. main was red for three hours.
#
# Both times the information existed and nothing carried it. Every agent then re-diagnosed the
# same failure on its own branch, because sessions share this estate and cannot see each other.
#
# So: a failing CI run on main opens ONE issue, labelled `main-red`, naming the failing jobs and
# linking the run. A passing run closes it. Nothing to remember, nothing to poll.
#
# WHY A HOSTED RUNNER. This job must still run when the self-hosted fleet is the thing that
# broke. It is a `gh` call and a few seconds of hosted minutes.
#
# WHY `cancelled` DOES NOTHING. A cancelled run graded nothing, so it is neither red nor green.
# Closing the issue on a cancel would clear a real alarm; opening one would invent a failure.

name: main is red

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

# Serialised, never cancelled: two runs completing together must not race into two issues, and
# a later run must not kill the one that is closing the issue.
concurrency:
  group: main-red
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open, update or close the main-red issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          # workflow_dispatch carries no workflow_run payload, so resolve the latest completed
          # CI run on main instead. That also makes this button the answer to "is main red".
          run_id="${EVENT_RUN_ID:-}"
          conclusion="${EVENT_CONCLUSION:-}"
          if [ -z "$run_id" ]; then
            read -r run_id conclusion < <(gh run list --workflow ci.yml --branch main \
              --status completed -L 1 --json databaseId,conclusion \
              -q '.[] | "\(.databaseId) \(.conclusion)"')
          fi
          if [ -z "$run_id" ]; then
            echo "no completed CI run on main to grade"; exit 0
          fi
          echo "run $run_id concluded $conclusion"

          existing="$(gh issue list --label main-red --state open -L 1 --json number \
                       -q '.[].number' || true)"

          if [ "$conclusion" = "success" ]; then
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body \
                "main is green again: run $run_id concluded success."
              gh issue close "$existing" --reason completed
              echo "closed #$existing"
            else
              echo "main is green and no issue is open"
            fi
            exit 0
          fi

          if [ "$conclusion" != "failure" ] && [ "$conclusion" != "timed_out" ]; then
            echo "conclusion '$conclusion' graded nothing — leaving the issue as it is"
            exit 0
          fi

          sha="$(gh run view "$run_id" --json headSha -q '.headSha')"
          url="$(gh run view "$run_id" --json url -q '.url')"
          failed="$(gh run view "$run_id" --json jobs \
            -q '.jobs[] | select(.conclusion=="failure") | "- \(.name)"' | head -20)"
          # A failing run with no failing job is possible (a cancelled dependency, a setup
          # failure), and an empty list would read as "nothing is wrong".
          [ -n "$failed" ] || failed="- (the run failed with no job reporting failure — open it)"

          body="$(printf '%s\n' \
            "CI run \`$run_id\` on main concluded **$conclusion** at commit \`${sha:0:8}\`." \
            "" \
            "$url" \
            "" \
            "Failing jobs:" \
            "$failed" \
            "" \
            "**Every open pull request inherits this.** Do not diagnose it again on your branch:" \
            "read the failing job log on THIS run first." \
            "" \
            "This issue closes itself when a CI run on main concludes success.")"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
            echo "commented on #$existing"
          else
            gh label create main-red --color B60205 \
              --description "main's CI is failing; every branch inherits it" 2>&1 | tail -1 || true
            gh issue create --title "main is red" --label main-red --body "$body"
          fi
