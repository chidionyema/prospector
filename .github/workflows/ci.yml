name: CI

# WHERE CI RUNS IS AN OPS SETTING, NOT A CODE CHANGE.
#
# Every job's `runs-on` reads the repo variable CI_RUNS_ON and falls back to GitHub's hosted
# Ubuntu runners when it is unset. Point it at `self-hosted` and all five jobs move to our own
# machine; unset it and they go straight back. One `gh variable set`, no commit, no review.
#
# It exists because on 2026-08-16 GitHub stopped starting jobs at all: "The job was not started
# because recent account payments have failed or your spending limit needs to be increased."
# Five jobs, zero steps, no logs, conclusion `failure`. A red PR that says nothing about the
# code, on every PR at once. Hosted runner minutes are metered; self-hosted minutes are not, so
# our own runner is the free path, and this variable is how we take it without rewriting the
# workflow under pressure.
#
# The jobs are OS-portable already: no apt-get, no sudo, no docker, no service containers. They
# use checkout, setup-python, setup-uv, setup-node, setup-dotnet and cache, every one of which
# supports macOS, so the same five jobs run unchanged wherever CI_RUNS_ON points.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One live run per branch. Pushing again to a PR cancels the run it just superseded.
#
# Measured 2026-08-16: 15 jobs queued at once on four self-hosted runner instances sharing ONE
# 12-CPU, 16 GB Mac. Most of that queue was stale — three or four runs per branch, all but the
# newest testing a commit nobody was waiting on any more. Without this block every push adds a
# full five-job run and removes none, so the queue only ever grows and the newest commit waits
# behind its own predecessors.
#
# cancel-in-progress is deliberately PR-only. A push to main must always finish: main's run is
# the record of whether main is green, and cancelling it would leave that question unanswered.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.14"
  DOTNET_VERSION: "9.0"

  # HOW WIDE PYTEST MAY RUN HERE. `pytest.ini:42` sets `-n auto`, and on this box auto is 12 —
  # one worker per CPU. That is right for a developer running one suite alone, and wrong for CI:
  # four runner instances share the SAME 12-CPU / 16 GB machine, so four concurrent python jobs
  # ask for 48 pytest workers, each importing the whole engine, on twelve cores and sixteen
  # gigabytes. What that looks like from GitHub is not a test failure. It is jobs dying with no
  # logs at all (2026-08-16: `python`, `engine` and `dotnet` all failed at "Set up job" with an
  # empty log blob) and MSBuild reporting MSB4166, "child node exited prematurely" — a worker
  # killed by the OS, not a compile error.
  #
  # 3 workers x 4 runners = 12, one per core. pytest-xdist 3.8.0 reads this variable to resolve
  # `-n auto`, so it applies to every pytest invocation in every job without editing a single
  # command line. Proven locally: PYTEST_XDIST_AUTO_NUM_WORKERS=3 with `-n auto` prints
  # "created: 3/3 workers".
  PYTEST_XDIST_AUTO_NUM_WORKERS: "3"

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Changes — what did this PR actually touch?
  #
  # Measured on the green run 32019069776 (2026-08-17): python 927s, engine 492s, nextjs 386s,
  # dotnet 340s, guard 18s. That is 36 minutes of runner time for EVERY pull request, whatever
  # it changed. On the same day the `docs/ci-runner` PR — one markdown file and this workflow —
  # paid all 36 minutes, and with four runner instances serving the whole repo that queue is
  # what kept seven PRs open.
  #
  # This job costs about fifteen seconds and lets the expensive ones skip. A docs-only PR now
  # runs `changes` and `guard` and nothing else.
  #
  # It fails OPEN: any error computing the diff, or a push to main, sets every output true and
  # the full suite runs. A filter that guesses wrong must guess towards more testing.
  # ──────────────────────────────────────────────────────────────────
  changes:
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      python: ${{ steps.filter.outputs.python }}
      dotnet: ${{ steps.filter.outputs.dotnet }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        name: Which areas did this change touch
        run: |
          set -u
          all() { for k in python dotnet web; do echo "$k=true" >> "$GITHUB_OUTPUT"; done; }

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "not a pull request — running everything"; all; exit 0
          fi

          base="origin/${{ github.base_ref }}"
          git fetch --no-tags --depth=200 origin "${{ github.base_ref }}" || { all; exit 0; }
          files=$(git diff --name-only "$base"...HEAD) || { all; exit 0; }
          if [ -z "$files" ]; then echo "empty diff — running everything"; all; exit 0; fi

          echo "$files"

          match() { printf '%s\n' "$files" | grep -qE "$1"; }

          # A change to the pipeline itself must be tested by the whole pipeline,
          # or a broken workflow gates itself out of the jobs that would catch it.
          if match '^\.github/'; then
            echo "workflow changed — running everything"; all; exit 0
          fi

          # Python: engine sources, tests, deps, and the config/prompt files the engine reads.
          if match '\.py$|^requirements|^pytest\.ini$|^config\.yaml$|^prompts/|^tests/|^scripts/'; then
            echo "python=true" >> "$GITHUB_OUTPUT"; else echo "python=false" >> "$GITHUB_OUTPUT"; fi

          if match '^store_platform/src/Store\.(Api|Catalog|Tests)/|\.cs$|\.csproj$|\.sln$'; then
            echo "dotnet=true" >> "$GITHUB_OUTPUT"; else echo "dotnet=false" >> "$GITHUB_OUTPUT"; fi

          if match '^store_platform/src/Store\.Web/'; then
            echo "web=true" >> "$GITHUB_OUTPUT"; else echo "web=false" >> "$GITHUB_OUTPUT"; fi

      - name: What will run
        run: |
          echo "python=${{ steps.filter.outputs.python }}"
          echo "dotnet=${{ steps.filter.outputs.dotnet }}"
          echo "web=${{ steps.filter.outputs.web }}"

  # ──────────────────────────────────────────────────────────────────
  # Guard — protected files (money rail, moat, identity) cannot be
  # deleted silently. Removing one requires a `Removes:` commit trailer.
  # Born from: account/social-login deleted unannounced inside a logo commit.
  # ──────────────────────────────────────────────────────────────────
  guard:
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard against silent deletion of protected files
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=50
          python3 scripts/guard_protected_deletions.py "origin/${{ github.base_ref }}"

  # ──────────────────────────────────────────────────────────────────
  # Python — full test suite + golden-set hard gate
  # ──────────────────────────────────────────────────────────────────
  #
  # SHARDED, 2026-08-17. This job was 927s — the pipeline's long pole, and the reason a
  # one-file change waited a quarter of an hour. The suite is split three ways by test file,
  # so three runners work on it at once and each finishes in roughly a third of the time. Three
  # and not four on purpose: there are four runner instances, and `engine` needs the fourth or
  # it queues behind its own pipeline.
  #
  # The split is by FILE, deterministic, and needs no plugin: file N goes to shard N mod 3. It
  # cannot drop a test — the same `git ls-files` pattern feeds every shard and every file lands
  # in exactly one. If a shard collects nothing the step fails loudly rather than passing empty.
  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 25

    strategy:
      # One shard's failure must not cancel the other two. Same reason the suite runs without
      # -x: a push should learn everything it is wrong about, not the first thing.
      fail-fast: false
      matrix:
        shard: [0, 1, 2]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Cache uv cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-

      # This used to be `actions/setup-python@v5` followed by `uv pip install --system`. Both
      # halves broke when CI moved to our self-hosted Macs on 2026-08-16, and between then and
      # 2026-08-17 not one run went green.
      #
      # setup-python: the macOS builds in actions/python-versions are not relocatable. Their
      # installer writes to the hosted runner's fixed home, so the step ends with
      # `mkdir: /Users/runner: Permission denied` and exit 1 (run 31955945283). Nothing in the
      # workflow can grant that; the path belongs to a user who does not exist on our box.
      #
      # --system: with setup-python gone, "the system interpreter" on our Mac is
      # /usr/local/bin/python3, one installation shared by all four runners AND by the founder's
      # own shell. Four concurrent jobs pip-installing into one site-packages is a race, and it
      # rewrites the machine's Python as a side effect of running CI.
      #
      # uv fixes both: it fetches its own interpreter into its writable cache and puts the
      # dependencies in a venv inside the job's workspace, so jobs cannot collide and the box is
      # left alone. One code path for hosted Ubuntu and for our Macs.
      - name: Python ${{ env.PYTHON_VERSION }} in a per-job venv
        run: |
          uv venv --python "${PYTHON_VERSION}" .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          .venv/bin/python --version

      # There is no pyproject.toml, so `uv sync` cannot be used.
      - name: Install dependencies
        run: uv pip install -r requirements.txt

      - name: Test suite, shard ${{ matrix.shard }} of 3
        # No -x. It stops at the first failure, so a run reports one problem and hides the
        # rest behind it: on 2026-07-31 four independent environment faults (a hardcoded
        # .venv path, tests asserting on a gitignored store, and three undeclared
        # dependencies) took four separate pushes to discover, one per run. The whole point
        # of CI is to learn everything one push is wrong about, in that push.
        #
        # test_ui_theme.py is excluded as it always was. test_golden_set.py is excluded here
        # and run once, on shard 0, as its own hard gate below.
        run: |
          set -eu
          files=$(git ls-files 'tests' \
                  | grep -E '(^|/)test_[^/]+\.py$' \
                  | grep -v -e 'tests/test_ui_theme\.py$' -e 'tests/test_golden_set\.py$' \
                  | awk -v s="${{ matrix.shard }}" 'NR % 3 == s')
          count=$(printf '%s\n' "$files" | grep -c . || true)
          echo "shard ${{ matrix.shard }}: $count test files"
          if [ "$count" -eq 0 ]; then
            echo "::error::shard collected no test files — the split pattern is wrong"; exit 1
          fi
          python -m pytest -q $files --tb=short -p no:warnings

      # ── Hard gate ──────────────────────────────────────────────
      # Block the pipeline if the golden set does not achieve 100 %
      # discrimination.  Every config change or prompt edit must
      # maintain perfect regression coverage on the 9 fixtures.
      #
      # Runs on shard 0 only. It is one file; running it in all three shards would treble its
      # cost and prove the same thing three times.
      - name: Golden-set regression gate ⛔
        if: matrix.shard == 0
        run: python -m pytest tests/test_golden_set.py -v --tb=short
      # ────────────────────────────────────────────────────────────

  # ──────────────────────────────────────────────────────────────────
  # Engine — the crown jewel's own gate.
  #
  # Born from 9089ebc (2026-08-13), which raised generation.candidates_per_signal 5 → 50 in
  # config.yaml. Nothing anywhere checked it: `.yaml` matched no lane in the local POPDD gate
  # AND — proven on 2026-08-14 — the main checkout had no .git/hooks/pre-commit installed at
  # all. Every tick afterwards force-exited at the 3h deadline mid-generation and the engine
  # produced nothing for 21 consecutive ticks. The founder found it by asking.
  #
  # This job is the backstop for exactly that: a local hook can be uninstalled, bypassed with
  # --no-verify, or (as here) never installed. A required check cannot. It runs on EVERY PR,
  # not behind a paths filter, because a paths filter is one more thing that can be wrong
  # about which files steer the daemon — and the job is ~1 minute.
  # ──────────────────────────────────────────────────────────────────
  engine:
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      # This job had no dependency cache while `python` did, so it re-downloaded the whole
      # requirements set on every run. Same key as the python job on purpose: both install
      # from the same requirements.txt, so they share one warm cache.
      - name: Cache uv cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-

      # Same reason as the python job above: setup-python cannot install on our self-hosted
      # Macs, and --system would write into the box's shared /usr/local Python.
      - name: Python ${{ env.PYTHON_VERSION }} in a per-job venv
        run: |
          uv venv --python "${PYTHON_VERSION}" .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          .venv/bin/python --version

      - name: Install dependencies
        run: uv pip install -r requirements.txt

      # --no-tick: a runner has no .env and no spend ledger, so the dry-run tick would fail on
      # its environment instead of on the change. Checks 1, 2 and 4 still run, and the script
      # prints what it skipped rather than implying full coverage.
      - name: Engine verification (import + lint + generation budget)
        run: ./scripts/verify_engine_change.sh --no-tick

      # The gate's own map. If lanes_for() stops routing config.yaml to the engine lane, this
      # goes red — the hole cannot be reopened quietly.
      - name: The lane map still guards the engine
        run: python -m pytest tests/unit/test_popdd_gate_lanes.py -q --tb=short -p no:warnings

  # ──────────────────────────────────────────────────────────────────
  # .NET — Store tests
  # ──────────────────────────────────────────────────────────────────
  dotnet:
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # The test project lives under store_platform/. These paths previously omitted that
      # prefix, so every run failed with MSB1009 (project file does not exist) and the job
      # had never actually executed a test.
      - name: Restore dependencies
        run: dotnet restore store_platform/src/Store.Tests/Store.Tests.csproj

      # -m:1 disables MSBuild's multi-process node reuse. MSBuild otherwise starts one worker
      # node per core: 12 on our self-hosted Mac, times up to four concurrent jobs, on 16 GB.
      # Six of the last eleven dotnet jobs died in Build or Test, the signature being
      # `MSB4166: Child node exited prematurely` — a worker killed under memory pressure, not a
      # compile error. One node is slower per job and finishes, which is the trade that matters
      # when the alternative is a red check that says nothing about the code.
      - name: Build
        run: dotnet build store_platform/src/Store.Tests/Store.Tests.csproj --no-restore -m:1

      - name: Test
        run: dotnet test store_platform/src/Store.Tests/Store.Tests.csproj --no-build --verbosity normal -m:1

  # ──────────────────────────────────────────────────────────────────
  # Next.js — build check on store platform
  # ──────────────────────────────────────────────────────────────────
  nextjs:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 40

    defaults:
      run:
        working-directory: store_platform/src/Store.Web/

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # package.json declares engines.node >=22; this said 20, so CI was building on a
          # runtime the project does not claim to support.
          node-version: "22"
          # npm ci re-downloaded every package on every run. setup-node's own cache keys off
          # the lockfile, so a PR that does not change dependencies skips the download.
          cache: npm
          cache-dependency-path: store_platform/src/Store.Web/package-lock.json

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: store_platform/src/Store.Web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('store_platform/src/Store.Web/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('store_platform/src/Store.Web/package-lock.json') }}-
            next-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # The job previously ran `build` alone. A type error that Next tolerates at build time
      # (or lives in a file the build tree-shakes) therefore reached main unchallenged.
      - name: Typecheck
        run: npm run typecheck

      # The 523 vitest tests had NO enforcement point anywhere: this job ran typecheck +
      # build only, and the pre-commit gate ran pytest, which cannot see a .tsx. A storefront
      # unit test could go red and reach main with every check green.
      - name: Unit tests (vitest)
        run: npm test

      # NEXT_PUBLIC_* are inlined at build time. Set placeholder https values here so the
      # build exercises the same code path as production (CSP connect-src and the sitemap
      # both derive from them) instead of silently baking in localhost defaults.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
          NEXT_PUBLIC_SITE_URL: https://www.example.com
