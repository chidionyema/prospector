name: CI

# WHERE CI RUNS IS AN OPS SETTING, NOT A CODE CHANGE.
#
# Every job's `runs-on` reads the repo variable CI_RUNS_ON and falls back to GitHub's hosted
# Ubuntu runners when it is unset. Point it at `self-hosted` and all five jobs move to our own
# machine; unset it and they go straight back. One `gh variable set`, no commit, no review.
#
# It exists because on 2026-08-16 GitHub stopped starting jobs at all: "The job was not started
# because recent account payments have failed or your spending limit needs to be increased."
# Five jobs, zero steps, no logs, conclusion `failure`. A red PR that says nothing about the
# code, on every PR at once. Hosted runner minutes are metered; self-hosted minutes are not, so
# our own runner is the free path, and this variable is how we take it without rewriting the
# workflow under pressure.
#
# The jobs are OS-portable already: no apt-get, no sudo, no docker, no service containers. They
# use checkout, setup-python, setup-uv, setup-node, setup-dotnet and cache, every one of which
# supports macOS, so the same five jobs run unchanged wherever CI_RUNS_ON points.
#
# TWO POOLS, BECAUSE THE JOBS ARE NOT THE SAME SIZE.
#
# CI_HEAVY_RUNS_ON gets the jobs that build and test: python, engine, dotnet, nextjs, ops-console.
# CI_LIGHT_RUNS_ON gets the ones that are a shell loop and finish in seconds: changes, guard,
# ci-ok. Both fall back to CI_RUNS_ON, then to GitHub's hosted runners, so unsetting them puts
# the old single-pool behaviour back with no commit.
#
# It exists because `ci-ok` is a two-second loop over `needs.*.result` with no checkout and no
# toolchain, and it was queueing behind 24-minute python jobs for the same four slots. Measured
# 2026-08-18 on run 32085367960: changes and guard passed, python and engine were cancelled,
# dotnet skipped, nextjs finished — and the run still read `queued` half an hour later because
# `ci-ok` could not get a slot. The run never reaches a terminal state, so the PR shows a queue
# that has in fact already finished, and the merge guard refuses to merge a PR whose work is done.
#
# THE ARITHMETIC, which `scripts/ci_capacity.py` checks rather than trusting this comment:
# three heavy runners x PYTEST_XDIST_AUTO_NUM_WORKERS (3) = 9 of the box's 12 CPUs, leaving three
# for the production daemons, the light runner and the OS. One light runner is enough because a
# light job holds a slot for seconds.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One live run per branch. Pushing again to a PR cancels the run it just superseded.
#
# Measured 2026-08-16: 15 jobs queued at once on four self-hosted runner instances sharing ONE
# 12-CPU, 16 GB Mac. Most of that queue was stale — three or four runs per branch, all but the
# newest testing a commit nobody was waiting on any more. Without this block every push adds a
# full five-job run and removes none, so the queue only ever grows and the newest commit waits
# behind its own predecessors.
#
# cancel-in-progress is deliberately PR-only. A push to main must always finish: main's run is
# the record of whether main is green, and cancelling it would leave that question unanswered.
#
# That was not enough, and `cancel-in-progress: false` is why. GitHub keeps at most ONE run
# PENDING per concurrency group: when a new run enters a group that already has one waiting,
# the waiting one is cancelled. So with four self-hosted runners and a deep queue, main's runs
# never started at all — they sat pending until the next merge evicted them.
#
# Measured 2026-08-17. Four merges landed on main between 20:11 and 20:36:
#   20:35:39  fe2a345a  cancelled
#   20:35:50  8d1a8bfe  cancelled
#   20:36:01  8973d07c  cancelled
#   20:36:10  5b8d0106  pending
# `5b8d010` had zero check runs and was what the production daemons were executing, because the
# follower ships main within 60 seconds. Six of the twelve most recent main runs read the same.
#
# Giving each push-to-main commit its OWN group is what fixes it: a group with one member can
# never evict anything. Pull requests keep sharing a per-ref group, which is where the queue
# pressure this block was written for actually comes from — pushing twice to a PR should still
# cancel the run it superseded.
# CORRECTED 2026-08-18. Per-sha groups stopped the eviction but replaced it with a flood: three
# consecutive merges put three full main runs in the queue at once (32094965578, 32095221331,
# 32096489333 -- fifteen heavy jobs on three heavy runners), and two pull requests waited behind
# all of them. Only the newest main commit's answer is wanted; its tree contains the other two.
#
# One shared group per ref, cancelling in progress, is what both defects want. The new run cancels
# the one it superseded and takes its slot, so nothing is evicted while pending and nothing piles
# up. main is still tested on every push -- the run that reports is the newest one.
# Superseding is right on a branch and wrong on main.
#
# On a pull request, an older commit's result is worthless the moment a newer commit exists, so
# cancelling it frees a runner for the answer somebody is actually waiting on.
#
# `github.ref` is `refs/heads/main` for EVERY push to main, so under `cancel-in-progress: true`
# each merge cancelled main's own verification run. The python job takes about twenty minutes;
# main's run only ever finished if no second merge landed inside that window. With several agents
# merging, it almost never did.
#
# Measured 2026-08-18, main's own ci.yml runs, newest first:
#
#   07:01  501883f  running     <- cancelled two minutes later by the next merge
#   07:00  93df868  cancelled
#   04:30  bdc957d  cancelled
#   04:28  2e6108e  cancelled
#   03:43  18a6104  cancelled
#   03:22  9951511  cancelled
#   03:17  b2d30c2  cancelled
#
#   38 cancelled, 20 failed, 36 succeeded across main's last 94 runs.
#
# This is why a broken main was invisible. `4eba810` merged with its checks unfinished and deleted
# 115 lines from scripts/live_checkout.py; main's verification run was cancelled by the next merge
# before it could report the 23 failures, so nothing ever said main was broken. It surfaced hours
# later as every open pull request failing for a defect none of them contained.
#
# Main is not a branch whose result can be superseded. Every commit on it is what production and
# every pull request is graded against, so every commit on it gets graded.
#
# A pull request's run is not superseded either, and that is the change here. This used to read
# `cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}`, so any push to a PR branch killed
# that branch's in-flight run. `automerge.yml` merges a PR the moment its CI run CONCLUDES green,
# and a cancelled run concludes nothing, so a branch pushed more often than the ~25 minute python
# job takes could never merge. Measured 2026-08-19 over the last 60 runs: 7 success, 16 failure,
# 16 CANCELLED, with 22 pull requests open and nothing landing. Several agents share this repo and
# cannot see each other, so each found "CI is red", pushed a fix, and cancelled the run that was
# about to merge someone else's fix.
#
# The cost of keeping runs alive is runner capacity, not money: the runners are self-hosted on
# Fly and their minutes are free, and `ci-autoscale.yml` adds machines when the queue grows.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.14"
  DOTNET_VERSION: "9.0"

  # HOW WIDE PYTEST MAY RUN HERE. `pytest.ini:42` sets `-n auto`, and on this box auto is 12 —
  # one worker per CPU. That is right for a developer running one suite alone, and wrong for CI:
  # four runner instances share the SAME 12-CPU / 16 GB machine, so four concurrent python jobs
  # ask for 48 pytest workers, each importing the whole engine, on twelve cores and sixteen
  # gigabytes. What that looks like from GitHub is not a test failure. It is jobs dying with no
  # logs at all (2026-08-16: `python`, `engine` and `dotnet` all failed at "Set up job" with an
  # empty log blob) and MSBuild reporting MSB4166, "child node exited prematurely" — a worker
  # killed by the OS, not a compile error.
  #
  # 3 workers x 4 runners = 12, one per core. pytest-xdist 3.8.0 reads this variable to resolve
  # `-n auto`, so it applies to every pytest invocation in every job without editing a single
  # command line. Proven locally: PYTEST_XDIST_AUTO_NUM_WORKERS=3 with `-n auto` prints
  # "created: 3/3 workers".
  PYTEST_XDIST_AUTO_NUM_WORKERS: "3"

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Changes — what did this PR actually touch?
  #
  # Measured on the green run 32019069776 (2026-08-17): python 927s, engine 492s, nextjs 386s,
  # dotnet 340s, guard 18s. That is 36 minutes of runner time for EVERY pull request, whatever
  # it changed. On the same day the `docs/ci-runner` PR — one markdown file and this workflow —
  # paid all 36 minutes, and with four runner instances serving the whole repo that queue is
  # what kept seven PRs open.
  #
  # This job costs about fifteen seconds and lets the expensive ones skip. A docs-only PR now
  # runs `changes` and `guard` and nothing else.
  #
  # It fails OPEN: any error computing the diff, or a push to main, sets every output true and
  # the full suite runs. A filter that guesses wrong must guess towards more testing.
  # ──────────────────────────────────────────────────────────────────
  changes:
    runs-on: ${{ vars.CI_LIGHT_RUNS_ON || vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      python: ${{ steps.filter.outputs.python }}
      dotnet: ${{ steps.filter.outputs.dotnet }}
      web: ${{ steps.filter.outputs.web }}
      console: ${{ steps.filter.outputs.console }}
    steps:
      # ─── MAIN COMES FIRST: NO PR BUILD WHILE MAIN IS RED OR MID-RUN ───────────────
      #
      # Founder directives 2026-08-19: "i dont see hwy any pr should run when nain is red",
      # "this nust be visibke so it can be fied as priority", and, after watching a PR job take
      # a runner out from under a queued main run, "nain should be priority over feaature
      # branches ... this should never happen".
      #
      # WHAT IT DOES. On a pull_request event it refuses to build for either of two reasons:
      #   1. A CI run on main is queued or in progress. Main gets the machines first. A feature
      #      branch never competes with the branch it merges into.
      #   2. Main's last completed CI run did not succeed. A PR cannot be greener than main.
      # Check 1 comes first, because an in-flight main run is the more urgent fact and it is
      # what a stale green from an hour ago hides.
      #
      # WHY IT IS THE FIRST STEP OF `changes` RATHER THAN ITS OWN JOB. A separate job would
      # need its own runner slot, which is the resource the gate exists to protect. `changes`
      # already runs first and everything else declares `needs: changes`, so failing here stops
      # the whole run for the price of a few seconds on the light pool.
      #
      # THE COST IT PREVENTS, measured 2026-08-19. Main was red on one test. Twenty-one PR runs
      # were queued ahead of main own fix run, so main — the only run whose colour every other
      # run inherits — could not get a machine. Every one of those PR runs was doomed to fail on
      # main defect and spent ~26 minutes of a heavy runner proving it. Worse, the starvation
      # was self-sustaining: as each PR job finished, the next queued PR job took the freed
      # runner, so main crawled through its five heavy jobs one gap at a time.
      #
      # THE ESCAPE HATCH, and it is deliberate. The PR that FIXES main must be able to build
      # while main is red, or the estate deadlocks. Label that PR `fixes-main` and this step
      # stands aside. `workflow_dispatch` is a second hatch: this only gates `pull_request`.
      #
      # A WEDGED MAIN RUN MUST NOT BECOME A TOTAL OUTAGE. Check 1 only counts main runs younger
      # than STALE_MINUTES. A run stuck queued for hours is not in flight, it is broken, and
      # blocking every PR in the repo behind it would turn one bad run into an estate-wide stop.
      #
      # IT FAILS OPEN. An API error, or a main with no completed CI run at all, warns and
      # passes. A gate that guesses must guess towards letting work through, because a gate
      # that blocks the whole repo on its own bug is worse than the problem it polices.
      - name: Main must be green before any PR builds
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const STALE_MINUTES = 90;

            // ── THE ESCAPE HATCH, READ LIVE. ──────────────────────────────────────────
            // `github.event.pull_request.labels` is a snapshot frozen when the run STARTED.
            // Label a PR `fixes-main` after its run began and that payload never sees it, so
            // the hatch is shut at the exact moment it exists for. Measured 2026-08-19: this
            // gate refused PR #443, the PR that carries this gate and fixes main, because the
            // label arrived ninety seconds after the run did. Founder: "this should obviosly
            // eclude nain, basi edge case". Ask the API for the labels the PR has NOW, so
            // labelling and re-running is enough.
            let labels = [];
            try {
              const res = await github.rest.issues.listLabelsOnIssue({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
              });
              labels = res.data.map((l) => l.name);
            } catch (e) {
              core.warning(`Could not read this PR's labels (${e.message}) — gate fails open.`);
              return;
            }

            if (labels.includes('fixes-main')) {
              core.info("PR is labelled `fixes-main` — it repairs main, so it is not gated.");
              return;
            }

            const refuse = async (heading, lines) => {
              const msg = lines.join('\n');
              await core.summary
                .addHeading(heading, 2)
                .addRaw(msg.replace(/\n/g, '<br>'))
                .write();
              core.setFailed(msg);
            };

            // ── CHECK 1: main gets the machines first. ────────────────────────────────
            let active = [];
            try {
              for (const status of ['in_progress', 'queued']) {
                const res = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'ci.yml',
                  branch: 'main',
                  status,
                  per_page: 20,
                });
                active = active.concat(res.data.workflow_runs);
              }
            } catch (e) {
              core.warning(`Could not read main's live runs (${e.message}) — gate fails open.`);
              active = [];
            }

            const now = Date.now();
            const live = active.filter((r) => {
              const age = now - new Date(r.run_started_at).getTime();
              return age < STALE_MINUTES * 60 * 1000;
            });

            if (live.length) {
              const r = live[0];
              return await refuse('main is building — feature branches wait', [
                `main's CI is ${r.status.toUpperCase()} at ${r.head_sha.slice(0, 8)}.`,
                `This PR was not built, because main gets the machines before any feature branch.`,
                ``,
                `Main is the branch every PR inherits its colour from, so it is never made to`,
                `queue behind the branches that merge into it.`,
                ``,
                `  ${r.html_url}`,
                ``,
                `Re-run this PR once main has finished. If THIS PR is the one that fixes main,`,
                `label it \`fixes-main\` and it will not be gated.`,
              ]);
            }

            // ── CHECK 2: main must be green. ──────────────────────────────────────────
            let latest;
            try {
              const res = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ci.yml',
                branch: 'main',
                status: 'completed',
                per_page: 1,
              });
              latest = res.data.workflow_runs[0];
            } catch (e) {
              core.warning(`Could not read main's CI history (${e.message}) — gate fails open.`);
              return;
            }

            if (!latest) {
              core.warning("main has no completed CI run — gate fails open.");
              return;
            }

            const sha = latest.head_sha.slice(0, 8);
            if (latest.conclusion === 'success') {
              core.info(`main is green at ${sha} (run ${latest.id}) and not mid-run — carrying on.`);
              return;
            }

            return await refuse('main is red — fix main first', [
              `main is ${latest.conclusion.toUpperCase()} at ${sha}.`,
              `This PR was not built, because a PR cannot be greener than the branch it merges into.`,
              ``,
              `FIX MAIN FIRST. That is the whole queue's top priority:`,
              `  ${latest.html_url}`,
              ``,
              `If THIS PR is the one that fixes main, label it \`fixes-main\` and re-run.`,
            ]);

      # WHY THE BOX IS SLOW, PRINTED BEFORE ANYTHING ELSE RUNS.
      #
      # On 2026-08-18 four CI jobs sat for an hour. `npm test` was at 0.0% CPU for 72 seconds,
      # pytest at 0.0% for ten and a half minutes, and one worker had no child process at all for
      # seventeen. Nothing was CPU-starved. The box had 7.7 GB of its 8 GB swap in use, so every
      # job was blocked on the pager, and the three biggest consumers were a Docker VM at 3.7 GB,
      # a `docker build` feeding it and a searxng container -- none of them CI.
      #
      # The jobs' own process trees measured 1123 MB, 577 MB and two at ~75 MB: under 2 GB of a
      # 16 GB machine. So this is deliberately NOT a budget check, and it deliberately cannot fail
      # the run. A static per-job RAM number would have been green all night while the box
      # thrashed, and a red check for a machine condition is the "red X that means nothing"
      # problem in another costume.
      #
      # It prints, in one second, the four numbers that took a whole night to find by hand.
      - name: Box state before the run
        continue-on-error: true
        run: |
          echo "load:  $(uptime | sed 's/.*load averages*: //')"
          echo "swap:  $(sysctl -n vm.swapusage 2>/dev/null || echo 'n/a')"
          echo "ram:   $(( $(sysctl -n hw.memsize 2>/dev/null || echo 0) / 1073741824 )) GB physical"
          echo "top memory holders (RSS MB, elapsed, command):"
          ps -eo rss,etime,comm -m 2>/dev/null | sed -n '2,7p' \
            | awk '{printf "  %6.0f  %9s  %s\n", $1/1024, $2, $3}'
          echo "runner workers live: $(pgrep -f Runner.Worker 2>/dev/null | wc -l | tr -d ' ')"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        name: Which areas did this change touch
        run: |
          set -u
          all() { for k in python dotnet web console; do echo "$k=true" >> "$GITHUB_OUTPUT"; done; }

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "not a pull request — running everything"; all; exit 0
          fi

          base="origin/${{ github.base_ref }}"
          git fetch --no-tags --depth=200 origin "${{ github.base_ref }}" || { all; exit 0; }
          files=$(git diff --name-only "$base"...HEAD) || { all; exit 0; }
          if [ -z "$files" ]; then echo "empty diff — running everything"; all; exit 0; fi

          echo "$files"

          match() { printf '%s\n' "$files" | grep -qE "$1"; }

          # EVERY LANE IS DECIDED BY THE FILES, AND THE WORKFLOW DIFF ONLY EVER ADDS TO THAT.
          #
          # These four are computed first and unconditionally, so a pull request that changes a
          # workflow AND some code still grades the code. That was not true until 2026-08-19: the
          # `.github/` rule below was an early `exit 0`, so on a mixed diff it decided dotnet, web
          # and console from the TEXT of the workflow diff and threw the actual file list away.
          # Run 32226199534 is the receipt — the pull request changed
          # store_platform/src/Ops.Console/src/pages/queue.tsx and two api route files, and the
          # ops-console job reported `skipped`. Nothing typechecked the console, and the run was
          # green. That is the same defect the Ops.Console rule at the bottom of this block was
          # added to fix in the first place, arriving by a different door.
          py=false; dn=false; wb=false; cn=false

          # Python: engine sources, tests, deps, and the config/prompt files the engine reads.
          if match '\.py$|^requirements|^pytest\.ini$|^config\.yaml$|^prompts/|^tests/|^scripts/'; then py=true; fi

          if match '^store_platform/src/Store\.(Api|Catalog|Tests)/|\.cs$|\.csproj$|\.sln$'; then dn=true; fi

          if match '^store_platform/src/Store\.Web/'; then wb=true; fi

          # The Ops Console is a SECOND Next app, and until 2026-08-17 no job built it. The
          # `web` filter above matches `Store.Web` only, so a pull request that changed the
          # console reported `nextjs skipping` and shipped with nothing typechecked. PR #289
          # changed `Ops.Console/src/pages/shelf.tsx` and CI produced no console result at all.
          if match '^store_platform/src/Ops\.Console/'; then cn=true; fi

          # A change to the pipeline itself used to run EVERY lane. The reasoning was that a
          # broken workflow gates itself out of the jobs that would catch it, and that part is
          # true. The cost was never measured. A pull request touching only ci.yml queued five
          # heavy jobs. Measured 2026-08-18 with five runs queued, #321 (ci.yml + doc_lint.py)
          # and #318 (ci.yml only) each held five heavy slots for lanes with nothing to build,
          # while main's own run waited behind them. Fixing CI was the most expensive thing CI
          # could be asked to do, so CI fixes landed last.
          #
          # A lane also runs when the workflow diff NAMES it. That keeps what the old rule was
          # protecting -- an edit to the dotnet job still runs dotnet -- and drops the lanes the
          # edit does not touch. Python is unconditional here, because `guard` and `ci-ok` are
          # python-lane jobs and any workflow edit can move them.
          if match '^\.github/'; then
            echo "workflow changed — python always, other lanes if the diff names them"
            py=true
            wf=$(git diff "$base"...HEAD -- .github/ || true)
            names() { printf '%s\n' "$wf" | grep -qE "$1"; }
            if names 'dotnet|Store\.(Api|Catalog|Tests)|\.cs\b|csproj'; then dn=true; fi
            if names 'nextjs|Store\.Web'; then wb=true; fi
            if names 'ops-console|Ops\.Console'; then cn=true; fi
          fi

          {
            echo "python=$py"
            echo "dotnet=$dn"
            echo "web=$wb"
            echo "console=$cn"
          } >> "$GITHUB_OUTPUT"

      - name: What will run
        run: |
          echo "python=${{ steps.filter.outputs.python }}"
          echo "dotnet=${{ steps.filter.outputs.dotnet }}"
          echo "web=${{ steps.filter.outputs.web }}"
          echo "console=${{ steps.filter.outputs.console }}"

  # ──────────────────────────────────────────────────────────────────
  # Guard — protected files (money rail, moat, identity) cannot be
  # deleted silently. Removing one requires a `Removes:` commit trailer.
  # Born from: account/social-login deleted unannounced inside a logo commit.
  # ──────────────────────────────────────────────────────────────────
  guard:
    runs-on: ${{ vars.CI_LIGHT_RUNS_ON || vars.CI_RUNS_ON || 'ubuntu-latest' }}
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard against silent deletion of protected files
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=50
          python3 scripts/guard_protected_deletions.py "origin/${{ github.base_ref }}"

      # P5.2. `scripts/doc_lint.py` fails on a doc naming a provider no config selects, a script
      # path that does not exist, or a 0-byte target -- ENG-6 was exactly that, a doc telling an
      # operator to run a provider that had not been configured for weeks.
      #
      # IT RUNS HERE AND NOT IN THE PYTHON LANE. `tests/unit/test_doc_lint_never_increases.py`
      # already holds the same ratchet, but that lane is path-filtered on `.py`, `tests/`,
      # `scripts/` and a few config files -- so a pull request that changes ONLY documentation
      # skips it entirely, which is the one change that can break a doc. This job has no path
      # filter, needs no virtualenv (doc_lint imports nothing outside the standard library) and
      # asks for no extra runner slot.
      - name: Docs may get more accurate, never less
        # `--against` scopes the ratchet to the docs THIS pull request changed. Without it the
        # gate graded every doc in the repository against one shared baseline, so any branch
        # that edited a doc without re-baselining turned every other open pull request red for a
        # file none of them had touched. Measured 2026-08-18: main carried 184 findings across
        # 14 docs, and #319 and #320 both failed here on docs/ENGINE_MIGRATION_PROGRAM.md, which
        # neither contains a line of. Regressions inherited from the base are still printed;
        # they just cannot fail a stranger's pull request. If git cannot resolve the ref the
        # script grades everything, so a shallow clone cannot quietly switch the gate off.
        run: python3 scripts/doc_lint.py --check --against "origin/${{ github.base_ref }}"

      # CI shares a 12-CPU Mac with the production daemons. `ops/config/ci_capacity.yaml` declares
      # how much of it CI may take; this fails when a new job, a wider pytest run or a renamed job
      # stops matching that. Offline, no virtualenv, no GitHub token. `--live` also checks the
      # registered runners and is an operator command, not a CI step.
      - name: CI still fits on the machine it runs on
        # The variables are passed in so the check can compare what they RESOLVE to against the
        # label each pool declares. Without them it only ever compared ci.yml against the contract
        # file, and CI_LIGHT_RUNS_ON was changed from `light` to `self-hosted` without a word.
        env:
          CI_HEAVY_RUNS_ON: ${{ vars.CI_HEAVY_RUNS_ON }}
          CI_LIGHT_RUNS_ON: ${{ vars.CI_LIGHT_RUNS_ON }}
        run: python3 scripts/ci_capacity.py

      # Our runners are a container we build, not GitHub's ubuntu-latest, and it installs
      # seventeen packages on purpose. A step written against GitHub's image therefore fails
      # here as a MISSING COMMAND -- exit 127, and usually with no message, because the step
      # that needed it had already redirected stderr. It has happened twice: `python3` after a
      # successful web deploy, and `openssh-client` on 2026-08-19, which killed the whole
      # hermes-config gate in seventeen milliseconds with no output at all.
      #
      # RUNNER_ENVIRONMENT is passed through so the check knows whose PATH it is grading. On a
      # GitHub-hosted runner it grades the Dockerfile only and says so; passing on ubuntu-latest
      # would prove nothing about the image we ship.
      - name: The runner carries the tools our workflows run
        run: python3 scripts/ci_runner_tools.py
      # A workflow GitHub cannot START fails with ZERO jobs, no log, no annotation and no red
      # check anywhere. It can therefore be dead for its entire life and nothing reports it.
      # Measured 2026-08-19: `.github/workflows/ci-autoscale.yml` had 30 runs, 30 failures and
      # `total_count: 0` jobs on every single one, because `workflow_job` is a WEBHOOK event and
      # not a workflow trigger. The CI runner pool had never once been scaled automatically, and
      # the only tell was a machine stopped in the middle of PR #425's test suite.
      #
      # actionlint names that defect in one line:
      #   ci-autoscale.yml:15:3: unknown Webhook event "workflow_job"  [events]
      #
      # IT RUNS HERE for the same reasons the doc-lint step above does: no path filter (a pull
      # request that changes only a workflow must still be graded), no virtualenv, and no extra
      # runner slot. Shellcheck is switched off -- ci.yml and deploy-web.yml carry info-level
      # SC2086 that is not worth walling every open pull request over. The version is pinned and
      # the download is checksummed, so a bad or moved release fails loudly instead of silently
      # skipping the gate.
      - name: Workflows GitHub can actually start
        run: |
          set -euo pipefail
          ver=1.7.12
          case "$(uname -m)" in
            x86_64|amd64) arch=amd64; sum=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 ;;
            aarch64|arm64) arch=arm64; sum=325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6 ;;
            *) echo "unsupported arch $(uname -m)"; exit 1 ;;
          esac
          tgz="actionlint_${ver}_linux_${arch}.tar.gz"
          curl -sSfL -o "$tgz" "https://github.com/rhysd/actionlint/releases/download/v${ver}/${tgz}"
          echo "${sum}  ${tgz}" | sha256sum -c -
          tar xzf "$tgz" actionlint
          ./actionlint -shellcheck= -color

  # ──────────────────────────────────────────────────────────────────
  # Python — full test suite + golden-set hard gate
  # ──────────────────────────────────────────────────────────────────
  #
  # UNSHARDED AGAIN, 2026-08-17, later the same day. The 3-way shard was added that morning to
  # cut a 927s job to a third. It did the opposite, and here is the measurement that shows it:
  # across the last 40 CI runs, python jobs finished 16 cancelled and 14 skipped, with 4 still
  # queued and 2 in progress. Not one passed. Not one failed. The lane produced no verdict at
  # all, which is why seven PRs sat with checks that could never go green.
  #
  # The reason is that a shard is only parallel if a runner is free for it. There are four
  # runners. Sharding asked for three of them per run, so with several runs in flight the
  # shards queued one after another instead of running together. Run 32042810155 is the
  # receipt: it started at 15:35:59 and its three shards started at 16:18:08, 16:33:11 and
  # 16:46:57 — 42, 57 and 71 minutes in, serially. By then a newer push had superseded the run
  # and cancel-in-progress killed all three. That is a loop, not a slow job: the deeper the
  # queue, the more likely a run is superseded before it finishes, and every cancellation puts
  # the same work back at the end of the queue.
  #
  # So the fix is to ask for fewer runners, not faster ones. One job, one slot, and the
  # parallelism comes from pytest-xdist inside that slot where it costs no queueing at all.
  # `-n 6` on the command line overrides the `-n auto` in pytest.ini addopts and the
  # PYTEST_XDIST_AUTO_NUM_WORKERS: "3" cap above, both of which were sized for three concurrent
  # pytest jobs that no longer exist.
  #
  # Slot demand per run drops from 3 to 1, and the whole pipeline from 8 jobs to 6.
  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ${{ vars.CI_HEAVY_RUNS_ON || vars.CI_RUNS_ON || 'ubuntu-latest' }}
    # 40, not the 25 a shard needed. One job now runs all 352 test files instead of ~117, and
    # a timeout is the one failure that looks exactly like the cancellations this change is
    # fixing. Reference points: 445s for the whole suite at 12 workers on a quiet box, 1281s
    # on a merged tree while four CI jobs shared the machine (both in CLAUDE.md).
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      # One shared uv cache and one shared venv root, both on paths that survive between jobs.
      #
      # These used to be the repo variables CI_UV_CACHE_DIR and CI_VENV_ROOT, and both held
      # absolute macOS paths under /Users/chidionyema. That works on exactly one machine. On a
      # Linux runner the first step is `mkdir -p /Users/chidionyema/.cache/ci-venvs`, which
      # fails: / is not writable. $HOME resolves to the same two directories on the Macs, so
      # nothing changes there, and to the container's home on Linux.
      #
      # On a GitHub-hosted runner $HOME is per-job and cold. That is what the old empty
      # VENV_ROOT gave too, so the fallback behaviour is unchanged.
      - name: Shared uv cache and venv root
        run: |
          set -eu
          echo "UV_CACHE_DIR=$HOME/.cache/uv" >> "$GITHUB_ENV"
          echo "VENV_ROOT=$HOME/.cache/ci-venvs" >> "$GITHUB_ENV"

      # enable-cache: false stops setup-uv pointing UV_CACHE_DIR at $RUNNER_TEMP. The job env
      # above owns that path instead.
      #
      # There used to be an actions/cache step here caching ~/.cache/uv. It could not work, and
      # it was the single biggest cost in the job. setup-uv had already set UV_CACHE_DIR to
      # $RUNNER_TEMP/setup-uv-cache (run 32038516212, job 95413653114, "Set UV_CACHE_DIR to
      # /Users/chidionyema/actions-runner-3/_work/_temp/setup-uv-cache"), so uv never read
      # ~/.cache/uv at all. The step spent 11 minutes — 14:18:09 to 14:29:09 — untarring 4.5 GB
      # into a directory nothing then opened, and on the engine job the same tar failed outright
      # ("Failed to restore: /usr/bin/tar failed with exit code 1").
      #
      # A self-hosted runner does not need actions/cache for this. Its disk persists between
      # jobs, so pointing every job at one directory is the whole mechanism: no tar, no restore,
      # no re-download. On GitHub-hosted runners the fallback path is per-workspace and cold,
      # which is the same as having no cache — acceptable, because we do not run there.
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: false

      # This used to be `actions/setup-python@v5` followed by `uv pip install --system`. Both
      # halves broke when CI moved to our self-hosted Macs on 2026-08-16, and between then and
      # 2026-08-17 not one run went green.
      #
      # setup-python: the macOS builds in actions/python-versions are not relocatable. Their
      # installer writes to the hosted runner's fixed home, so the step ends with
      # `mkdir: /Users/runner: Permission denied` and exit 1 (run 31955945283). Nothing in the
      # workflow can grant that; the path belongs to a user who does not exist on our box.
      #
      # --system: with setup-python gone, "the system interpreter" on our Mac is
      # /usr/local/bin/python3, one installation shared by all four runners AND by the founder's
      # own shell. Four concurrent jobs pip-installing into one site-packages is a race, and it
      # rewrites the machine's Python as a side effect of running CI.
      #
      # uv fixes both: it fetches its own interpreter into its writable cache and puts the
      # dependencies in a venv inside the job's workspace, so jobs cannot collide and the box is
      # left alone. One code path for hosted Ubuntu and for our Macs.
      # ONE venv, built once, reused by every job. This replaced a per-job `uv venv` +
      # `uv pip install`, which four jobs (three test shards plus engine) each paid in full:
      # 214s x 4 = 856s of identical work per run, measured on run 32042202900.
      #
      # The venv is content-addressed by the requirements file and the Python version, so a
      # dependency change makes a new one automatically and no job can run against a stale
      # tree. It is built with `--relocatable`, which is what makes build-then-move safe:
      # without it a uv venv hardcodes its own absolute path into every console script, so
      # moving it breaks `pytest`.
      #
      # The race is handled by `mv -n` rather than a lock. macOS has no flock, and a lock a
      # killed job never releases is worse than duplicated work. Two jobs may build in
      # parallel; the first to land wins, the loser deletes its copy. Wasteful once, never
      # wrong.
      #
      # If VENV_ROOT is unset (a GitHub-hosted runner) this falls back to the workspace and
      # behaves exactly like the old per-job venv.
      - name: Python ${{ env.PYTHON_VERSION }} in a shared venv
        run: |
          set -euo pipefail
          ROOT="${VENV_ROOT:-$PWD/.ci-venvs}"
          mkdir -p "$ROOT"
          KEY="py${PYTHON_VERSION}-$(shasum -a 256 requirements.txt | cut -c1-16)"
          VENV="$ROOT/$KEY"
          if [ ! -x "$VENV/bin/python" ]; then
            TMP="$ROOT/.building-$KEY-$$"
            rm -rf "$TMP"
            uv venv --relocatable --python "${PYTHON_VERSION}" "$TMP"
            VIRTUAL_ENV="$TMP" uv pip install -r requirements.txt
            mv -n "$TMP" "$VENV" 2>/dev/null || true
            rm -rf "$TMP"
            echo "built $VENV"
          else
            echo "reused $VENV"
          fi
          # Fail loudly rather than run the suite against a half-built tree.
          "$VENV/bin/python" -c 'import pytest' || { echo "shared venv is incomplete"; exit 1; }
          echo "$VENV/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VENV" >> "$GITHUB_ENV"
          "$VENV/bin/python" --version

      - name: Test suite
        # No -x. It stops at the first failure, so a run reports one problem and hides the
        # rest behind it: on 2026-07-31 four independent environment faults (a hardcoded
        # .venv path, tests asserting on a gitignored store, and three undeclared
        # dependencies) took four separate pushes to discover, one per run. The whole point
        # of CI is to learn everything one push is wrong about, in that push.
        #
        # test_ui_theme.py is excluded as it always was. test_golden_set.py is excluded here
        # and run as its own hard gate below.
        #
        # -n 4 is explicit rather than `auto`. `auto` resolves through
        # PYTEST_XDIST_AUTO_NUM_WORKERS, which is set to 3 at the top of this file for a world
        # with three concurrent pytest jobs on one shared laptop.
        #
        # 4, not the 6 this said until 2026-08-18, because the machine underneath changed. CI
        # no longer runs on the founder's 12-core Mac beside the production daemons; it runs on
        # `prospector-ci` Fly machines, `shared-cpu-4x` with 8 GB (deploy/runner/fly.toml), and
        # a GitHub runner takes ONE job at a time. So the job does not share four cores with
        # anything: it gets all of them, and 6 workers on 4 vCPUs was 1.5x oversubscription of a
        # burstable CPU with every worker importing the whole engine.
        #
        # NOT a wall-clock claim. I have not measured 4 against 6 on this machine. What it is:
        # the declared width now equals the vCPUs the runner actually has, which is what
        # ops/config/ci_capacity.yaml checks, and what nothing checked while CI moved hosts.
        run: |
          set -eu
          files=$(git ls-files 'tests' \
                  | grep -E '(^|/)test_[^/]+\.py$' \
                  | grep -v -e 'tests/test_ui_theme\.py$' -e 'tests/test_golden_set\.py$')
          count=$(printf '%s\n' "$files" | grep -c . || true)
          echo "$count test files"
          if [ "$count" -eq 0 ]; then
            echo "::error::collected no test files — the pattern is wrong"; exit 1
          fi
          # `$files` is a newline-separated list and MUST split into separate arguments
          # here. Quoting it hands pytest one path containing newlines, which collects
          # nothing. The `count` check three lines up is what makes the split safe.
          # shellcheck disable=SC2086
          python -m pytest -q $files -n 4 --tb=short -p no:warnings

      # ── Hard gate ──────────────────────────────────────────────
      # Block the pipeline if the golden set does not achieve 100 %
      # discrimination.  Every config change or prompt edit must
      # maintain perfect regression coverage on the 9 fixtures.
      #
      - name: Golden-set regression gate ⛔
        run: python -m pytest tests/test_golden_set.py -v --tb=short
      # ────────────────────────────────────────────────────────────

      # ── Security: the code ─────────────────────────────────────
      # Bandit, gated on HIGH severity only, and that threshold is a measurement rather than a
      # preference. On origin/main at da0d9589 the full scan reported 361 findings. Fourteen were
      # HIGH: thirteen were sha1 or md5 hashing content to make a cache key, a dedup key or an
      # ETag, and one was real — `scripts/ops_state.py` ran `whois … | grep …` through a shell.
      #
      # The thirteen are fixed by saying so in code, `usedforsecurity=False`, not by switching
      # the check off. The digest is byte-identical either way; the flag is the language's own
      # way to state that a hash is an identifier and not a security decision. That is what
      # leaves the rule armed: a NEW sha1 that really does authenticate something still fails
      # here. Adding B324 to a skip list would have disarmed it permanently.
      #
      # The other 347 are MEDIUM and LOW and are printed, not enforced. The largest groups are
      # B603/B404/B607 (this repo shells out to git, fly and gh by design, 189 of them) and
      # B310 urllib (39). Walling the gate on those would mean 347 suppression comments on the
      # first day, which teaches everyone to write `# nosec` and stops anyone reading it.
      #
      # --python matters and is not tidiness. uvx builds its own environment, and by default that
      # was Python 3.11.15 while this repo runs 3.14.6. On 3.11 bandit could not parse
      # tools/experiments/g_generation_ab.py and skipped it, reporting "syntax error while parsing
      # AST from file" into a JSON field nothing read. A skipped file is an unscanned file, so the
      # step now pins the interpreter AND fails if bandit's `errors` array is non-empty.
      - name: Bandit security scan
        run: |
          set -eu
          uvx --python "${PYTHON_VERSION}" bandit \
            -r prospector ops scripts tools -q -f json -o /tmp/bandit-all.json || true
          python - <<'PY'
          import json, sys
          skipped = json.load(open("/tmp/bandit-all.json"))["errors"]
          if skipped:
              for e in skipped:
                  print(f"::error::bandit could not read {e['filename']}: {e['reason']}")
              sys.exit("bandit skipped a file, so it did not scan it")
          PY
          python - <<'PY'
          import collections, json
          rows = json.load(open("/tmp/bandit-all.json"))["results"]
          by = collections.Counter((r["issue_severity"], r["test_id"]) for r in rows)
          print(f"{len(rows)} findings, not enforced below HIGH:")
          for (sev, tid), n in by.most_common():
              print(f"  {sev:<6} {tid} {n}")
          PY
          uvx --python "${PYTHON_VERSION}" bandit \
            -r prospector ops scripts tools -q --severity-level high \
            || { echo "::error::Bandit found a HIGH severity issue. If the hash is an identifier"
                 echo "::error::rather than a security decision, pass usedforsecurity=False."
                 exit 1; }
          echo "no HIGH severity findings"

      # ── Security: the dependencies ─────────────────────────────
      # pip-audit against the Python Advisory Database. It reads a frozen list rather than
      # requirements.txt on purpose: freeze reports what the job will actually import, pins and
      # transitive packages included, and needs no resolution step. requirements.txt would miss
      # an advisory that arrives through a dependency of a dependency, which is how both of the
      # .NET advisories this repo has carried arrived.
      #
      # The grep drops the two line shapes pip-audit cannot read: `-e <path or VCS url>` and
      # `name @ file:///...`. Both name a checkout rather than a released version, so there is no
      # advisory to look up, and pip-audit does not skip them — it aborts the whole run with
      # "is not a valid editable requirement" and audits nothing. Measured on the founder's
      # laptop: three such lines out of 121, and the step failed outright until they were cut.
      # CI builds its venv from requirements.txt alone and has none of them, which is exactly why
      # this would only ever have broken locally.
      #
      # Measured 2026-08-19 on origin/main: "No known vulnerabilities found". This goes in green.
      #
      # `uv pip freeze`, not `python -m pip freeze`. The shared venv above is built by
      # `uv venv`, and uv does not install pip into a venv it creates. So the first form is a
      # ModuleNotFoundError in the only environment this step ever runs in:
      #
      #   .../ci-venvs/py3.14-e49c923ecd1f4b82/bin/python: No module named pip
      #
      # `set -eu` does not set pipefail, so the failing command was the LEFT side of a pipe and
      # the step's status came from grep instead. It went red either way, but on the wrong
      # command, which is why the log reads as a scan failure rather than a missing module.
      - name: Dependency advisory scan
        run: |
          set -euo pipefail
          uv pip freeze > /tmp/all-packages.txt
          # grep exits 1 when it filters everything out, which under pipefail would read as a
          # scan failure rather than an empty list. The floor below is what actually grades it.
          grep -vE '^-e|@ ' /tmp/all-packages.txt > /tmp/frozen.txt || true
          n="$(wc -l < /tmp/frozen.txt | tr -d ' ')"
          echo "packages audited: $n of $(wc -l < /tmp/all-packages.txt | tr -d ' ')"
          # A scan of an empty list passes and reports nothing. Measured on origin/main the
          # venv holds 121 packages, so under 20 means uv read a different environment rather
          # than that this repo got smaller.
          [ "$n" -ge 20 ] || { echo "::error::froze $n packages, so this is not the venv the suite runs"; exit 1; }
          uvx pip-audit -r /tmp/frozen.txt
      # ────────────────────────────────────────────────────────────

  # ──────────────────────────────────────────────────────────────────
  # Engine — the crown jewel's own gate.
  #
  # Born from 9089ebc (2026-08-13), which raised generation.candidates_per_signal 5 → 50 in
  # config.yaml. Nothing anywhere checked it: `.yaml` matched no lane in the local POPDD gate
  # AND — proven on 2026-08-14 — the main checkout had no .git/hooks/pre-commit installed at
  # all. Every tick afterwards force-exited at the 3h deadline mid-generation and the engine
  # produced nothing for 21 consecutive ticks. The founder found it by asking.
  #
  # This job is the backstop for exactly that: a local hook can be uninstalled, bypassed with
  # --no-verify, or (as here) never installed. A required check cannot. It runs on EVERY PR,
  # not behind a paths filter, because a paths filter is one more thing that can be wrong
  # about which files steer the daemon — and the job is ~1 minute.
  # ──────────────────────────────────────────────────────────────────
  engine:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ${{ vars.CI_HEAVY_RUNS_ON || vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # One shared uv cache and one shared venv root, both on paths that survive between jobs.
      #
      # These used to be the repo variables CI_UV_CACHE_DIR and CI_VENV_ROOT, and both held
      # absolute macOS paths under /Users/chidionyema. That works on exactly one machine. On a
      # Linux runner the first step is `mkdir -p /Users/chidionyema/.cache/ci-venvs`, which
      # fails: / is not writable. $HOME resolves to the same two directories on the Macs, so
      # nothing changes there, and to the container's home on Linux.
      #
      # On a GitHub-hosted runner $HOME is per-job and cold. That is what the old empty
      # VENV_ROOT gave too, so the fallback behaviour is unchanged.
      - name: Shared uv cache and venv root
        run: |
          set -eu
          echo "UV_CACHE_DIR=$HOME/.cache/uv" >> "$GITHUB_ENV"
          echo "VENV_ROOT=$HOME/.cache/ci-venvs" >> "$GITHUB_ENV"

      # The actions/cache step that was here had the same defect as the python job's: it tarred
      # ~/.cache/uv, which uv was not configured to read. See the long note there.
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: false

      # Same reason as the python job above: setup-python cannot install on our self-hosted
      # Macs, and --system would write into the box's shared /usr/local Python.
      # ONE venv, built once, reused by every job. This replaced a per-job `uv venv` +
      # `uv pip install`, which four jobs (three test shards plus engine) each paid in full:
      # 214s x 4 = 856s of identical work per run, measured on run 32042202900.
      #
      # The venv is content-addressed by the requirements file and the Python version, so a
      # dependency change makes a new one automatically and no job can run against a stale
      # tree. It is built with `--relocatable`, which is what makes build-then-move safe:
      # without it a uv venv hardcodes its own absolute path into every console script, so
      # moving it breaks `pytest`.
      #
      # The race is handled by `mv -n` rather than a lock. macOS has no flock, and a lock a
      # killed job never releases is worse than duplicated work. Two jobs may build in
      # parallel; the first to land wins, the loser deletes its copy. Wasteful once, never
      # wrong.
      #
      # If VENV_ROOT is unset (a GitHub-hosted runner) this falls back to the workspace and
      # behaves exactly like the old per-job venv.
      - name: Python ${{ env.PYTHON_VERSION }} in a shared venv
        run: |
          set -euo pipefail
          ROOT="${VENV_ROOT:-$PWD/.ci-venvs}"
          mkdir -p "$ROOT"
          KEY="py${PYTHON_VERSION}-$(shasum -a 256 requirements.txt | cut -c1-16)"
          VENV="$ROOT/$KEY"
          if [ ! -x "$VENV/bin/python" ]; then
            TMP="$ROOT/.building-$KEY-$$"
            rm -rf "$TMP"
            uv venv --relocatable --python "${PYTHON_VERSION}" "$TMP"
            VIRTUAL_ENV="$TMP" uv pip install -r requirements.txt
            mv -n "$TMP" "$VENV" 2>/dev/null || true
            rm -rf "$TMP"
            echo "built $VENV"
          else
            echo "reused $VENV"
          fi
          # Fail loudly rather than run the suite against a half-built tree.
          "$VENV/bin/python" -c 'import pytest' || { echo "shared venv is incomplete"; exit 1; }
          echo "$VENV/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VENV" >> "$GITHUB_ENV"
          "$VENV/bin/python" --version

      # --no-tick: a runner has no .env and no spend ledger, so the dry-run tick would fail on
      # its environment instead of on the change. Checks 1, 2 and 4 still run, and the script
      # prints what it skipped rather than implying full coverage.
      - name: Engine verification (import + lint + generation budget)
        run: ./scripts/verify_engine_change.sh --no-tick

      # The gate's own map. If lanes_for() stops routing config.yaml to the engine lane, this
      # goes red — the hole cannot be reopened quietly.
      - name: The lane map still guards the engine
        run: python -m pytest tests/unit/test_popdd_gate_lanes.py -q --tb=short -p no:warnings

  # ──────────────────────────────────────────────────────────────────
  # .NET — Store tests
  # ──────────────────────────────────────────────────────────────────
  dotnet:
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ${{ vars.CI_HEAVY_RUNS_ON || vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # WHERE .NET INSTALLS, and why it is not the default.
      #
      # actions/setup-dotnet installs to /usr/share/dotnet on Linux, which needs root. Our own
      # runners do not have it, so on 2026-08-18 every dotnet job on main and on every open PR
      # died in "Set up .NET 9.0" with `mkdir: cannot create directory '/usr/share/dotnet':
      # Permission denied` (run 32149741450). That is not a test failure and it says nothing
      # about the code, but it is a red X on the pull request all the same.
      #
      # $HOME is writable on every runner we use, hosted or not, and it PERSISTS on the
      # self-hosted ones, so the SDK is downloaded once rather than per job. setup-dotnet puts
      # DOTNET_INSTALL_DIR on PATH and sets DOTNET_ROOT itself, so nothing downstream changes.
      - name: Install .NET under the runner's own HOME
        run: echo "DOTNET_INSTALL_DIR=$HOME/.dotnet" >> "$GITHUB_ENV"

      - name: Set up .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Skipped on our own runners. Their disk persists between jobs, so ~/.nuget/packages is
      # already there and actions/cache spends 454s (measured, run 32091486436) restoring a
      # directory nothing deleted. Kept for hosted runners, whose disk really is destroyed.
      - name: Cache NuGet packages
        if: runner.environment != 'self-hosted'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # The test project lives under store_platform/. These paths previously omitted that
      # prefix, so every run failed with MSB1009 (project file does not exist) and the job
      # had never actually executed a test.
      # Before restore, because after restore is too late to be told.
      #
      # An XML comment may not contain two hyphens in a row. On 2026-08-19 a comment in
      # Directory.Packages.props quoted a command line with long flags, the file stopped
      # parsing, and MSBuild dropped it. That turns ManagePackageVersionsCentrally off, and a
      # PackageReference with no Version attribute then has nothing to resolve against.
      #
      # The failure never names the file. Re-measured by breaking it on purpose: `dotnet
      # restore` printed NU1604 "does not contain an inclusive lower bound" 21 times, once per
      # centrally-versioned package across all three projects, and not one line mentioned
      # Directory.Packages.props. `dotnet build` does name it, with MSB4024 — but restore runs
      # first and fails first, so nobody reads that far.
      #
      # This cannot be a test in Store.Tests. That was tried the same day and proved inert:
      # with the file malformed, MSBuild will not evaluate Store.Tests.csproj either, so the
      # test assembly never loads and the assertion never runs. A step before restore is the
      # only place that can see it.
      - name: MSBuild props files parse
        run: |
          set -eu
          python3 - <<'PY'
          import pathlib, sys, xml.etree.ElementTree as ET
          files = sorted(pathlib.Path("store_platform").rglob("Directory.*.props"))
          files = [f for f in files if "bin" not in f.parts and "obj" not in f.parts]
          if not files:
              sys.exit("::error::found no Directory.*.props to check - the glob is wrong")
          bad = 0
          for f in files:
              try:
                  ET.parse(f)
                  print(f"ok  {f}")
              except ET.ParseError as exc:
                  bad += 1
                  print(f"::error file={f}::{exc}. An XML comment cannot contain two hyphens "
                        f"in a row; write the flag name in prose instead.")
          sys.exit(bad and "a build props file does not parse")
          PY

      - name: Restore dependencies
        run: dotnet restore store_platform/src/Store.Tests/Store.Tests.csproj

      # -m:1 disables MSBuild's multi-process node reuse. MSBuild otherwise starts one worker
      # node per core: 12 on our self-hosted Mac, times up to four concurrent jobs, on 16 GB.
      # Six of the last eleven dotnet jobs died in Build or Test, the signature being
      # `MSB4166: Child node exited prematurely` — a worker killed under memory pressure, not a
      # compile error. One node is slower per job and finishes, which is the trade that matters
      # when the alternative is a red check that says nothing about the code.
      - name: Build
        run: dotnet build store_platform/src/Store.Tests/Store.Tests.csproj --no-restore -m:1

      - name: Test
        run: dotnet test store_platform/src/Store.Tests/Store.Tests.csproj --no-build --verbosity normal -m:1

      # Known-vulnerable dependencies, including the ones nothing here references directly.
      #
      # `--include-transitive` is the whole point. Both advisories this repo has carried were
      # transitive: SQLitePCLRaw.lib.e_sqlite3 2.1.10 (GHSA-2m69-gcr7-jv3q, High) through
      # Microsoft.EntityFrameworkCore.Sqlite, and OpenTelemetry.Api 1.11.2
      # (GHSA-g94r-2vxg-569j, Moderate) through Crux.Observability. A top-level-only scan sees
      # neither. Both were live on main until 2026-08-19; they are pinned in
      # store_platform/Directory.Packages.props now.
      #
      # The grep is not laziness. `dotnet list package --vulnerable` exits 0 whether it finds
      # anything or not, so a step that only ran the command would be a green check that reads
      # nothing. The sentence it matches is NuGet's own wording for a project with findings.
      #
      # The solution, not the test project: this restores all three projects and reports each
      # one by name, so an advisory that reaches only Store.Api still fails here with the
      # project named.
      - name: Vulnerable dependency scan
        run: |
          set -eu
          dotnet restore store_platform/Store.sln
          dotnet list store_platform/Store.sln package --vulnerable --include-transitive \
            | tee /tmp/vuln.txt
          if grep -q "has the following vulnerable packages" /tmp/vuln.txt; then
            echo "::error::A dependency has a published security advisory. Pin a patched version"
            echo "::error::in store_platform/Directory.Packages.props; transitive pinning is on."
            exit 1
          fi
          echo "no vulnerable packages"

  # ──────────────────────────────────────────────────────────────────
  # Next.js — build check on store platform
  # ──────────────────────────────────────────────────────────────────
  nextjs:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ${{ vars.CI_LIGHT_RUNS_ON || vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 40

    defaults:
      run:
        working-directory: store_platform/src/Store.Web/

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # package.json declares engines.node >=22; this said 20, so CI was building on a
          # runtime the project does not claim to support.
          node-version: "22"
          # npm ci re-downloaded every package on every run. setup-node's own cache keys off
          # the lockfile, so a PR that does not change dependencies skips the download.
          # Empty on our own runners: setup-node's cache uploads and downloads node_modules
          # through GitHub's cache service, and the box already has it. 239s measured on
          # run 32091486436. Hosted runners still get the cache.
          cache: ${{ runner.environment == 'self-hosted' && '' || 'npm' }}
          cache-dependency-path: store_platform/src/Store.Web/package-lock.json

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: store_platform/src/Store.Web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('store_platform/src/Store.Web/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('store_platform/src/Store.Web/package-lock.json') }}-
            next-${{ runner.os }}-

      - name: Install dependencies
        # --prefer-offline uses the shared ~/.npm cache (2.9G on this box) instead of
        # revalidating every package against the registry; --no-audit and --no-fund drop two
        # network round trips that print advice nobody reads in CI.
        run: npm ci --prefer-offline --no-audit --no-fund

      # The job previously ran `build` alone. A type error that Next tolerates at build time
      # (or lives in a file the build tree-shakes) therefore reached main unchallenged.
      - name: Typecheck
        run: npm run typecheck

      # THE THIRD TIME THIS JOB HAS BEEN MISSING AN ENFORCEMENT POINT, and the two notes above
      # are the first two. `eslint.config.mjs` says at the top that its rules "make the war-room
      # rails fail the build, not just a reviewer's eye" -- no `any`, no `dangerouslySetInnerHTML`,
      # no token in localStorage, no raw `fetch` outside src/lib/api, jsx-a11y/recommended. None of
      # them failed anything: the only `npm run lint` in this file belongs to the Ops.Console job,
      # so Store.Web has never been linted in CI. Measured 2026-08-18 on the branch for #349:
      # 2 errors and 26 warnings sitting in the tree with every check green.
      #
      # `--cache` because a cold run measured 207.64s here against ruff's 0.81s repo-wide. The
      # cache keys on file content plus config, so a hit is only ever a file eslint has already
      # judged in this exact configuration.
      - name: Cache ESLint results
        uses: actions/cache@v4
        with:
          path: store_platform/src/Store.Web/.eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('store_platform/src/Store.Web/package-lock.json', 'store_platform/src/Store.Web/eslint.config.mjs') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('store_platform/src/Store.Web/package-lock.json', 'store_platform/src/Store.Web/eslint.config.mjs') }}-
            eslint-${{ runner.os }}-

      - name: Lint
        run: npm run lint -- --cache

      # CSS has never had a lane. `stylelint.config.mjs` runs the possible-errors half of
      # stylelint over the two stylesheets this repo is allowed to write (the shipped bundle
      # mumchimp.css is byte-locked and deliberately ignored): duplicate properties, unknown
      # units, invalid hex, a shorthand that silently wipes the longhand above it.
      - name: Lint CSS
        run: npm run lint:css

      # The 523 vitest tests had NO enforcement point anywhere: this job ran typecheck +
      # build only, and the pre-commit gate ran pytest, which cannot see a .tsx. A storefront
      # unit test could go red and reach main with every check green.
      - name: Unit tests (vitest)
        run: npm test

      # NEXT_PUBLIC_* are inlined at build time. Set placeholder https values here so the
      # build exercises the same code path as production (CSP connect-src and the sitemap
      # both derive from them) instead of silently baking in localhost defaults.
      # `npm ci` above runs with --no-audit so that install stays fast and deterministic. That
      # is precisely why the audit needs its own step: with the flag on install, nothing ever
      # checks. Measured 2026-08-19 in both web projects: "found 0 vulnerabilities", so this
      # goes in green.
      #
      # --audit-level=high, not low, and --omit=dev, not the whole tree. This comment used to
      # promise the second half and the command did not do it, so the gate fired on exactly the
      # build-only tooling it said it would ignore. Measured 2026-08-19: 10 high advisories, all
      # of them under @lhci/cli or @storybook/nextjs-vite, none reachable by any request --
      # 0 high advisories in the production tree. It had turned main red with no code change and
      # was blocking every merge in the repository, including the fix for main's other red.
      # A gate whose verdict comes from an outside advisory feed must only cover code we SHIP.
      - name: Dependency advisory scan
        working-directory: store_platform/src/Store.Web
        run: npm audit --audit-level=high --omit=dev

      # The same tree WITHOUT --omit=dev, reported and never enforced. Dropping the dev tree
      # from the gate must not drop it from view: a build tool with a known hole is still worth
      # knowing about, it is just not worth blocking every merge in the repository over.
      - name: Dependency advisories in build tooling (report only)
        working-directory: store_platform/src/Store.Web
        continue-on-error: true
        run: |
          npm audit --audit-level=high > "$RUNNER_TEMP/audit-dev.txt" 2>&1 || true
          {
            echo "### Build-tooling advisories (not a gate)"
            echo '```'
            tail -20 "$RUNNER_TEMP/audit-dev.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
          NEXT_PUBLIC_SITE_URL: https://www.example.com

      # THE FOURTH MISSING ENFORCEMENT POINT IN THIS JOB, and the reason is the same shape as the
      # three above: nothing here has ever rendered a page. `npm run build` proves the app
      # compiles; it measures no geometry and opens no viewport.
      #
      # What that cost. On 2026-08-19 the home page shipped with the hero figure rendering at
      # every width. Below 901px the hero is one column (`mumchimp.css:432`), so the figure
      # stacked under the headline and pushed the first pack card to y=1288 on a 400px phone --
      # a shop opening with no product on screen, on every phone size we test. It was caught by
      # `e2e/discovery.spec.ts`, which runs in `e2e-live-smoke.yml` AGAINST PRODUCTION, after the
      # deploy. The storefront stayed red for 30 hours. A check that only runs after deployment
      # cannot prevent a bad deployment.
      #
      # `e2e/fold-budget.spec.ts` is the pre-deploy half. It boots the build above and asserts
      # the shelf reaches the first screen on three phone widths. There is no API behind that
      # server, so every assertion anchors on chrome that renders whether or not the catalogue
      # answers -- which is enough, because this class of defect is always "something above the
      # shelf grew".
      #
      # `--only-shell` skips the ~180MB of ffmpeg and headed-mode assets; this gate never records
      # video. Invoked by path rather than by `--project=` on purpose: #398 rewrites
      # `playwright.config.ts`, and a path cannot conflict with a project list.
      - name: Install Chromium for the fold gate
        run: npx playwright install --with-deps --only-shell chromium

      - name: Fold gate (pre-deploy geometry)
        run: |
          npm run start -- --port 3111 &
          for i in $(seq 1 40); do curl -sf -o /dev/null http://localhost:3111/ && break; sleep 2; done
          npx playwright test e2e/fold-budget.spec.ts --reporter=list
        env:
          WEB_BASE_URL: http://localhost:3111

  # ──────────────────────────────────────────────────────────────────
  # The Ops Console — the operator's admin surface, and a separate Next app from the
  # storefront above. It had NO lane at all: no job in any of the four workflow files
  # mentioned `Ops.Console`, so nothing typechecked it, linted it, ran its vitest suite or
  # built it. A console page could go red and reach main with every check green, which is
  # the same "built and unreachable" shape the console itself exists to surface.
  #
  # Deliberately mirrors the `nextjs` job rather than sharing a matrix with it: the two apps
  # have separate lockfiles, separate caches and different build env, and one matrix over
  # both would make a storefront-only change pay the console's install.
  # ──────────────────────────────────────────────────────────────────
  ops-console:
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ${{ vars.CI_LIGHT_RUNS_ON || vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 40

    defaults:
      run:
        working-directory: store_platform/src/Ops.Console/

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: ${{ runner.environment == 'self-hosted' && '' || 'npm' }}
          cache-dependency-path: store_platform/src/Ops.Console/package-lock.json

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: store_platform/src/Ops.Console/.next/cache
          key: ops-next-${{ runner.os }}-${{ hashFiles('store_platform/src/Ops.Console/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ops-next-${{ runner.os }}-${{ hashFiles('store_platform/src/Ops.Console/package-lock.json') }}-
            ops-next-${{ runner.os }}-

      - name: Install dependencies
        # --prefer-offline uses the shared ~/.npm cache (2.9G on this box) instead of
        # revalidating every package against the registry; --no-audit and --no-fund drop two
        # network round trips that print advice nobody reads in CI.
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Lint CSS
        run: npm run lint:css

      - name: Unit tests (vitest)
        run: npm test

      # No NEXT_PUBLIC_* here on purpose. The console talks to the local Python gateway
      # through `PROSPECTOR_PYTHON`, resolved at RUN time by the `start` script, so nothing
      # about the deployment is inlined into the build.
      # `npm ci` above runs with --no-audit so that install stays fast and deterministic. That
      # is precisely why the audit needs its own step: with the flag on install, nothing ever
      # checks. Measured 2026-08-19 in both web projects: "found 0 vulnerabilities", so this
      # goes in green.
      #
      # --audit-level=high, not low, and --omit=dev, not the whole tree. This comment used to
      # promise the second half and the command did not do it, so the gate fired on exactly the
      # build-only tooling it said it would ignore. Measured 2026-08-19: 10 high advisories, all
      # of them under @lhci/cli or @storybook/nextjs-vite, none reachable by any request --
      # 0 high advisories in the production tree. It had turned main red with no code change and
      # was blocking every merge in the repository, including the fix for main's other red.
      # A gate whose verdict comes from an outside advisory feed must only cover code we SHIP.
      - name: Dependency advisory scan
        working-directory: store_platform/src/Ops.Console
        run: npm audit --audit-level=high --omit=dev

      # The same tree WITHOUT --omit=dev, reported and never enforced. Dropping the dev tree
      # from the gate must not drop it from view: a build tool with a known hole is still worth
      # knowing about, it is just not worth blocking every merge in the repository over.
      - name: Dependency advisories in build tooling (report only)
        working-directory: store_platform/src/Ops.Console
        continue-on-error: true
        run: |
          npm audit --audit-level=high > "$RUNNER_TEMP/audit-dev.txt" 2>&1 || true
          {
            echo "### Build-tooling advisories (not a gate)"
            echo '```'
            tail -20 "$RUNNER_TEMP/audit-dev.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: npm run build

      # axe-core against the console's own screens. It runs WITHOUT the Python gateway here, so
      # most panels render their stated-problem branch rather than data. That is deliberate: an
      # operator meets those states during an outage, which is the worst moment for an unreadable
      # one. On its first run this found three serious defects -- no `lang` on <html>, a stat
      # placeholder at 2.56:1, and scroll containers a keyboard could not enter.
      #
      # AFTER the build, always: the Playwright webServer runs `next start`, which serves the
      # build directory. Before it, the server never comes up and every test errors in setup.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Accessibility (axe-core)
        run: npm run test:a11y
        env:
          CI: "true"

      # The console is operated from a phone. This is the spec that caught /config
      # scrolling 7px sideways on one unbreakable JSON value, and until now it ran
      # on laptops only -- a gate nothing schedules is a gate that stops running.
      - name: Phone widths (390 and 320)
        run: npm run test:e2e
        env:
          CI: "true"

  # ──────────────────────────────────────────────────────────────────
  # The single check branch protection requires.
  #
  # Path gating and required status checks do not mix directly. Once `python`,
  # `engine`, `dotnet` and `nextjs` can be skipped, requiring them by name is a
  # trap: a docs-only pull request never produces those checks, so it waits for
  # a result that is never coming and can never merge. Requiring none of them is
  # the other failure — nothing is enforced and every merge is a human decision,
  # which is the state that left seven PRs open.
  #
  # So require THIS job and nothing else. It always runs, it depends on every
  # other job, and it fails only when one of them actually failed or was
  # cancelled. A skipped job is a pass here, which is exactly what "that area was
  # not touched" means.
  # ──────────────────────────────────────────────────────────────────
  ci-ok:
    needs: [changes, guard, python, engine, dotnet, nextjs, ops-console]
    if: always()
    runs-on: ${{ vars.CI_LIGHT_RUNS_ON || vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Every job either passed or was not needed
        run: |
          set -u
          results="${{ join(needs.*.result, ' ') }}"
          echo "job results: $results"
          bad=0
          for r in $results; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a job reported '$r'"; bad=1 ;;
            esac
          done
          exit "$bad"
