name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.14"
  DOTNET_VERSION: "9.0"

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Guard — protected files (money rail, moat, identity) cannot be
  # deleted silently. Removing one requires a `Removes:` commit trailer.
  # Born from: account/social-login deleted unannounced inside a logo commit.
  # ──────────────────────────────────────────────────────────────────
  guard:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard against silent deletion of protected files
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=50
          python3 scripts/guard_protected_deletions.py "origin/${{ github.base_ref }}"

  # ──────────────────────────────────────────────────────────────────
  # Python — full test suite + golden-set hard gate
  # ──────────────────────────────────────────────────────────────────
  python:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Cache uv cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-

      # Install from requirements.txt (there is no pyproject.toml, so `uv sync`
      # cannot be used). --system installs into the setup-python interpreter.
      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Main test suite (excluding UI theme)
        # No -x. It stops at the first failure, so a run reports one problem and hides the
        # rest behind it: on 2026-07-31 four independent environment faults (a hardcoded
        # .venv path, tests asserting on a gitignored store, and three undeclared
        # dependencies) took four separate pushes to discover, one per run. The whole point
        # of CI is to learn everything one push is wrong about, in that push.
        run: python -m pytest -q --ignore=tests/test_ui_theme.py --tb=short -p no:warnings

      # ── Hard gate ──────────────────────────────────────────────
      # Block the pipeline if the golden set does not achieve 100 %
      # discrimination.  Every config change or prompt edit must
      # maintain perfect regression coverage on the 9 fixtures.
      - name: Golden-set regression gate ⛔
        run: python -m pytest tests/test_golden_set.py -v --tb=short
      # ────────────────────────────────────────────────────────────

  # ──────────────────────────────────────────────────────────────────
  # Engine — the crown jewel's own gate.
  #
  # Born from 9089ebc (2026-08-13), which raised generation.candidates_per_signal 5 → 50 in
  # config.yaml. Nothing anywhere checked it: `.yaml` matched no lane in the local POPDD gate
  # AND — proven on 2026-08-14 — the main checkout had no .git/hooks/pre-commit installed at
  # all. Every tick afterwards force-exited at the 3h deadline mid-generation and the engine
  # produced nothing for 21 consecutive ticks. The founder found it by asking.
  #
  # This job is the backstop for exactly that: a local hook can be uninstalled, bypassed with
  # --no-verify, or (as here) never installed. A required check cannot. It runs on EVERY PR,
  # not behind a paths filter, because a paths filter is one more thing that can be wrong
  # about which files steer the daemon — and the job is ~1 minute.
  # ──────────────────────────────────────────────────────────────────
  engine:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      # --no-tick: a runner has no .env and no spend ledger, so the dry-run tick would fail on
      # its environment instead of on the change. Checks 1, 2 and 4 still run, and the script
      # prints what it skipped rather than implying full coverage.
      - name: Engine verification (import + lint + generation budget)
        run: ./scripts/verify_engine_change.sh --no-tick

      # The gate's own map. If lanes_for() stops routing config.yaml to the engine lane, this
      # goes red — the hole cannot be reopened quietly.
      - name: The lane map still guards the engine
        run: python -m pytest tests/unit/test_popdd_gate_lanes.py -q --tb=short -p no:warnings

  # ──────────────────────────────────────────────────────────────────
  # .NET — Store tests
  # ──────────────────────────────────────────────────────────────────
  dotnet:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # The test project lives under store_platform/. These paths previously omitted that
      # prefix, so every run failed with MSB1009 (project file does not exist) and the job
      # had never actually executed a test.
      - name: Restore dependencies
        run: dotnet restore store_platform/src/Store.Tests/Store.Tests.csproj

      - name: Build
        run: dotnet build store_platform/src/Store.Tests/Store.Tests.csproj --no-restore

      - name: Test
        run: dotnet test store_platform/src/Store.Tests/Store.Tests.csproj --no-build --verbosity normal

  # ──────────────────────────────────────────────────────────────────
  # Next.js — build check on store platform
  # ──────────────────────────────────────────────────────────────────
  nextjs:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: store_platform/src/Store.Web/

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # package.json declares engines.node >=22; this said 20, so CI was building on a
          # runtime the project does not claim to support.
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      # The job previously ran `build` alone. A type error that Next tolerates at build time
      # (or lives in a file the build tree-shakes) therefore reached main unchallenged.
      - name: Typecheck
        run: npm run typecheck

      # The 523 vitest tests had NO enforcement point anywhere: this job ran typecheck +
      # build only, and the pre-commit gate ran pytest, which cannot see a .tsx. A storefront
      # unit test could go red and reach main with every check green.
      - name: Unit tests (vitest)
        run: npm test

      # NEXT_PUBLIC_* are inlined at build time. Set placeholder https values here so the
      # build exercises the same code path as production (CSP connect-src and the sitemap
      # both derive from them) instead of silently baking in localhost defaults.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
          NEXT_PUBLIC_SITE_URL: https://www.example.com
