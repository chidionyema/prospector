# The branch ruleset requires this check with no bypass. The workflow was removed from main but the
# ruleset still names it, so every pull request was permanently blocked. Restored verbatim in
# behaviour from idp: no `.claude` path may enter the estate (founder, 2026-09-30).
name: no-harness-folders
on:
  pull_request:
  push:
jobs:
  no-harness-folders:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: refuse any .claude path
        run: |
          found=$(git ls-files | grep -E '(^|/)\.claude(/|$)' || true)
          if [ -n "$found" ]; then
            echo "::error::harness folder in the tree (founder 2026-09-30: no .claude anywhere):"
            echo "$found"
            exit 1
          fi
          echo "no .claude path in $(git ls-files | wc -l) tracked files"
