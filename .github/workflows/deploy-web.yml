# Deploy the storefront (Store.Web) to Fly from GitHub.
#
# Why this exists: a local `flyctl deploy` builds the WORKING TREE, so what shipped was whatever
# happened to be on one laptop at that moment. On 2026-07-31 that tree also held a second agent's
# uncommitted files, and `predeploy_guard.sh` correctly refused — the deploy only went out from a
# detached worktree pinned to one commit. A CI checkout is that property for free: every deploy is
# exactly one commit, rebuildable and rollbackable, which is what the guard was asking for.
#
# The one rule this file follows: it does NOT reimplement the deploy gates. It composes the
# env file that `store_platform/scripts/deploy_web.sh` already reads and then runs that script,
# so CI and a laptop enforce the same checks from the same source:
#
#   - NEXT_PUBLIC_* present (they are inlined at BUILD time; a missing one ships silently broken)
#   - publishable key MODE matches the target (a pk_test bundle against a live API fails AFTER
#     the buyer types their card in)
#   - the key actually authenticates with Stripe (a revoked or paste-mangled key passes every
#     offline string check and then fails inside Stripe.js)
#   - the tree is clean (trivially true here — see above)
#
# Setup, once, by the repo owner. These are NOT things CI can create for itself:
#
#   gh secret set FLY_API_TOKEN            # flyctl tokens create deploy -a prospector-store-web
#   gh variable set NEXT_PUBLIC_API_URL    --body 'https://api.mumchimp.com'
#   gh variable set NEXT_PUBLIC_SITE_URL   --body 'https://mumchimp.com'
#   gh variable set STRIPE_LIVE_PUBLISHABLE_KEY --body 'pk_live_...'
#
# Optional, add whenever the consoles issue them (the deploy reports "absent" and ships no meta tag
# until then, which is correct — see the env step below):
#
#   gh variable set NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION --body '...'   # Search Console, HTML tag
#   gh variable set NEXT_PUBLIC_BING_SITE_VERIFICATION   --body '...'   # Bing Webmaster Tools
#
# Not here at all: INDEXNOW_KEY. It is read at REQUEST time by pages/indexnow-key.txt.tsx, so it is
# a Fly runtime secret (`fly secrets set INDEXNOW_KEY=...`) and must match the engine's own value.
#
# The publishable key is a repository VARIABLE, not a secret, on purpose: it is inlined into the
# public client bundle by design (`curl https://mumchimp.com/pack/<id>` will show it), so storing
# it as a secret would buy no confidentiality and would only hide a wrong value from review. The
# Fly deploy token is a real credential and is a secret. Nothing here ever prints either.

name: Deploy Store.Web

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target — 'prod' requires a pk_live_ key, 'test' requires pk_test_"
        type: choice
        options: [prod, test]
        default: prod
      dry_run:
        description: "Run every gate and stop before building"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "store_platform/src/Store.Web/**"
      - "store_platform/deploy/fly/web.fly.toml"
      - "store_platform/scripts/deploy_web.sh"
      - "store_platform/scripts/predeploy_guard.sh"
      - ".github/workflows/deploy-web.yml"

# Never cancel a half-finished production deploy to start another: a cancelled rolling update can
# leave machines split across two images. Queue instead.
concurrency:
  group: deploy-web
  cancel-in-progress: false

# WHY THESE JOBS DO NOT RUN ON THE SELF-HOSTED FLEET.
# On 2026-08-19 a merge to main sat undeployed for twelve hours. Nothing had failed: the deploy
# run was QUEUED behind feature-branch CI, because deploys asked for the same `heavy` label as
# every other job and the fleet is three machines. Sessions push branches faster than three
# runners drain them, so a deploy is always last in a queue it shares.
# A deploy job here is a checkout, a toolchain and `flyctl deploy`, which builds on Fly's remote
# builder — it needs a runner, not a big one. GitHub-hosted runners are a separate queue, so a
# deploy can no longer wait behind our own CI. Set `CI_DEPLOY_RUNS_ON` to move them back,
# without another code change.
# Pinned by tests/unit/test_deploys_do_not_share_the_ci_queue.py.
jobs:
  # The image build runs `next build`, which typechecks — so a type error already fails the deploy.
  # It does NOT run vitest, so the unit suite is gated here rather than discovered in production.
  test:
    runs-on: ${{ vars.CI_DEPLOY_RUNS_ON || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: store_platform/src/Store.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: store_platform/src/Store.Web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    runs-on: ${{ vars.CI_DEPLOY_RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # deploy_web.sh reads its values from an env FILE rather than the environment, because the
      # laptop case is a real .env holding both Stripe pairs side by side. Compose the same shape
      # here instead of teaching the script a second input path it would then have to keep in sync.
      - name: Compose the env file deploy_web.sh reads
        env:
          API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          PK_LIVE: ${{ vars.STRIPE_LIVE_PUBLISHABLE_KEY }}
          PK_TEST: ${{ vars.STRIPE_TEST_PUBLISHABLE_KEY }}
          # Search-console ownership tokens. OPTIONAL and unset on purpose until the consoles issue
          # them: absent means no meta tag, which is the correct absent state (an empty `content=""`
          # is a FAILED verification rather than a missing one). They are plumbed here now so that
          # obtaining them later is a `gh variable set`, not another code change — the failure this
          # avoids is a token that exists, is set as a Fly runtime secret, and never reaches the
          # page because NEXT_PUBLIC_* is inlined at BUILD time.
          GOOGLE_VERIFY: ${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
          BING_VERIFY: ${{ vars.NEXT_PUBLIC_BING_SITE_VERIFICATION }}
        run: |
          set -euo pipefail
          umask 077
          # A missing variable must fail HERE with a name, not 40 lines later as "MISSING" with no
          # clue whether the value was never set or was set empty.
          : "${API_URL:?set repo variable NEXT_PUBLIC_API_URL}"
          : "${SITE_URL:?set repo variable NEXT_PUBLIC_SITE_URL}"
          {
            printf 'NEXT_PUBLIC_API_URL=%s\n'  "$API_URL"
            printf 'NEXT_PUBLIC_SITE_URL=%s\n' "$SITE_URL"
            [ -n "${PK_LIVE:-}" ] && printf 'STRIPE_LIVE_PUBLISHABLE_KEY=%s\n' "$PK_LIVE"
            [ -n "${PK_TEST:-}" ] && printf 'NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=%s\n' "$PK_TEST"
            [ -n "${GOOGLE_VERIFY:-}" ] && printf 'NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION=%s\n' "$GOOGLE_VERIFY"
            [ -n "${BING_VERIFY:-}" ] && printf 'NEXT_PUBLIC_BING_SITE_VERIFICATION=%s\n' "$BING_VERIFY"
            true
          } > "$RUNNER_TEMP/deploy.env"
          # Prove the file has the shape the script greps for, without printing any value.
          cut -d= -f1 "$RUNNER_TEMP/deploy.env" | sed 's/^/  var /'

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          ENV_FILE: ${{ runner.temp }}/deploy.env
          TARGET: ${{ inputs.target || 'prod' }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          set -euo pipefail
          : "${FLY_API_TOKEN:?set repo secret FLY_API_TOKEN (flyctl tokens create deploy)}"
          bash store_platform/scripts/deploy_web.sh "$TARGET" $DRY

      # `flyctl deploy` exiting 0 means the machines took the image, not that the site serves.
      # One request against the real domain is the difference between "deployed" and "working".
      - name: Prove the site serves
        if: ${{ !inputs.dry_run }}
        env:
          SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 --retry 5 --retry-delay 5 \
                   --retry-all-errors "$SITE_URL/")
          echo "GET $SITE_URL/ -> $code"
          [ "$code" = "200" ] || { echo "site did not return 200 after deploy"; exit 1; }
