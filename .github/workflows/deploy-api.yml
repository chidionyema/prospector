# Deploy the API (Store.Api) to Fly from GitHub.
#
# Why this exists: the storefront already deploys from CI (deploy-web.yml) but the API did not,
# so shipping it meant `fly deploy` from a laptop. That has two failure modes and we hit both on
# 2026-07-31/08-01. First, a local deploy builds the WORKING TREE — on that day the tree also held
# a second agent's uncommitted files, and predeploy_guard.sh correctly refused, so the deploy could
# only go out from a detached worktree pinned to one commit. Second, the laptop's flyctl session
# expired: `fly auth whoami` still printed the account while every call returned
# "Not authorized to access this firecrackerapp" and the image push died on `403 Forbidden` /
# `ensure depot builder failed (status 401)`. A finished, fully-tested API change sat unshipped
# because of a credential on one machine. A CI checkout fixes both: every deploy is exactly one
# commit, and the credential lives in the repo rather than in someone's home directory.
#
# Setup, once, by the repo owner — CI cannot mint this for itself:
#
#   flyctl tokens create deploy -a prospector-store-api
#   gh secret set FLY_API_TOKEN_API                  # paste the token above
#
# A SEPARATE secret from FLY_API_TOKEN on purpose: that one was minted with
# `-a prospector-store-web`, and a Fly deploy token is scoped to its app, so reusing it here would
# fail at push time with an authorization error rather than deploying. If the owner would rather
# keep one credential, mint an org-scoped token and set both secrets to it — this workflow falls
# back to FLY_API_TOKEN so that arrangement works without an edit.
#
# The API carries its own runtime secrets (STORE_INTERNAL_API_KEY, Stripe, R2) as Fly app secrets
# set on the app itself. They are not deploy-time inputs and this workflow never reads or prints
# them.

name: Deploy Store.Api

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run the tests and stop before deploying"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "store_platform/src/Store.Api/**"
      - "store_platform/src/Store.Catalog/**"
      - "store_platform/deploy/fly/api.fly.toml"
      - ".github/workflows/deploy-api.yml"

# Never cancel a half-finished production deploy to start another: a cancelled rolling update can
# leave machines split across two images. Queue instead.
concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  DOTNET_VERSION: "9.0.x"
  FLY_APP: prospector-store-api

# WHY THESE JOBS DO NOT RUN ON THE SELF-HOSTED FLEET.
# On 2026-08-19 a merge to main sat undeployed for twelve hours. Nothing had failed: the deploy
# run was QUEUED behind feature-branch CI, because deploys asked for the same `heavy` label as
# every other job and the fleet is three machines. Sessions push branches faster than three
# runners drain them, so a deploy is always last in a queue it shares.
# A deploy job here is a checkout, a toolchain and `flyctl deploy`, which builds on Fly's remote
# builder — it needs a runner, not a big one. GitHub-hosted runners are a separate queue, so a
# deploy can no longer wait behind our own CI. Set `CI_DEPLOY_RUNS_ON` to move them back,
# without another code change.
# Pinned by tests/unit/test_deploys_do_not_share_the_ci_queue.py.
jobs:
  # The image build compiles, so a compile error already fails the deploy. It does NOT run xunit —
  # gate the suite here rather than discover a regression against live buyers. This is the money
  # rail: fulfilment, checkout and the content pointer all live in this app.
  test:
    runs-on: ${{ vars.CI_DEPLOY_RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # WHERE .NET INSTALLS. This is the same three lines as ci.yml's dotnet job, and it is here
      # because it was NOT here on 2026-08-19 and this workflow could not run at all.
      #
      # actions/setup-dotnet installs to /usr/share/dotnet on Linux, which needs root. Two of the
      # six runners carrying the `heavy` label are Linux containers that do not have it
      # (`runner-83d1d69bd119e8`, `runner-8ee06eb7701628`), so the job died in "Run
      # actions/setup-dotnet@v4" with `mkdir: cannot create directory '/usr/share/dotnet':
      # Permission denied` (run 32223984416). ci.yml got this fix the day before; this file did
      # not, and nobody saw it, because a path-filtered workflow that never runs never reveals
      # that it is broken. `tests/unit/test_dotnet_installs_where_it_can_write.py` now fails if any
      # job anywhere uses setup-dotnet without it.
      #
      # $HOME is writable on every runner we use, hosted or not, and it PERSISTS on the
      # self-hosted ones, so the SDK is downloaded once rather than per job. setup-dotnet puts
      # DOTNET_INSTALL_DIR on PATH and sets DOTNET_ROOT itself, so nothing downstream changes.
      - name: Install .NET under the runner's own HOME
        run: echo "DOTNET_INSTALL_DIR=$HOME/.dotnet" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      # Same project path as ci.yml's dotnet job. Pointing at the solution or omitting the
      # store_platform/ prefix fails with MSB1009 and a job that never ran a test still goes green
      # on the surrounding steps — that exact bug shipped here once already.
      - run: dotnet restore store_platform/src/Store.Tests/Store.Tests.csproj
      - run: dotnet build store_platform/src/Store.Tests/Store.Tests.csproj --no-restore
      - run: dotnet test store_platform/src/Store.Tests/Store.Tests.csproj --no-build --verbosity normal

  deploy:
    needs: test
    if: ${{ !inputs.dry_run }}
    runs-on: ${{ vars.CI_DEPLOY_RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master as of 2026-08-25

      - name: Deploy
        id: deploy
        env:
          # Prefer the API-scoped token; fall back to a single org-scoped FLY_API_TOKEN if that is
          # how the owner set it up. Fails with a named instruction rather than a Fly 401 if neither
          # is present.
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_API || secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          : "${FLY_API_TOKEN:?set repo secret FLY_API_TOKEN_API (flyctl tokens create deploy -a ${FLY_APP})}"
          # Run from store_platform/ and keep every path relative to it. `--config` is resolved
          # relative to the working-directory argument, NOT to the process cwd: passing
          # `store_platform --config store_platform/deploy/fly/api.fly.toml` makes flyctl look for
          # store_platform/store_platform/..., find nothing, and silently fall back to the app's
          # REMOTE config instead of failing. On 2026-08-01 that cost two green-looking runs — the
          # tell is in the log, `Validating --config path unset--`, meaning no config file was
          # loaded at all, so edits to api.fly.toml had no effect and the error never changed.
          #
          # --dockerfile is passed explicitly for the same reason: it pins the image source to a
          # path in THIS checkout, so a stale remote config cannot decide what gets built. The
          # context stays store_platform/ because the Dockerfile copies local-feed/,
          # Directory.*.props and src/Store.Catalog/ (see its header).
          cd store_platform
          flyctl deploy . \
            --config deploy/fly/api.fly.toml \
            --dockerfile src/Store.Api/Dockerfile \
            --app "$FLY_APP" \
            --remote-only

      # `flyctl deploy` exiting 0 means the machines took the image, not that this commit's code is
      # answering. Two requests settle it:
      #
      #   /catalog 200            — the app boots and the database opened (a failed EF migration
      #                             shows up here, not in the deploy log)
      #   /internal/catalog/<id>/content 401 without a key — the route EXISTS. It answers 404 on
      #                             any build that predates the content door, and the auth check
      #                             runs before the pack lookup (Program.cs), so 401 is returned
      #                             for a nonexistent id too. 401 vs 404 is therefore a clean
      #                             binary answer to "did THIS commit ship?", with no key involved
      #                             and nothing secret in the log.
      - name: Prove this commit is the one answering
        env:
          API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          set -euo pipefail
          base="${API_URL:-https://api.mumchimp.com}"

          catalog=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 --retry 5 --retry-delay 5 \
                      --retry-all-errors "$base/catalog")
          echo "GET $base/catalog -> $catalog"
          [ "$catalog" = "200" ] || { echo "API did not serve the catalogue after deploy"; exit 1; }

          door=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
                   "$base/internal/catalog/deploy-probe/content")
          echo "GET $base/internal/catalog/deploy-probe/content (no key) -> $door"
          case "$door" in
            401) echo "content door is live and refuses unauthenticated callers" ;;
            404) echo "route missing — the machines are serving an older image"; exit 1 ;;
            *)   echo "unexpected status from the content door"; exit 1 ;;
          esac

      # PAY-1 — is the deployed app taking REAL money?
      #
      # A test key in production is the quietest failure this app has. Everything above still
      # passes: the machines take the image, /catalog answers 200, the content door answers 401,
      # checkout completes, the buyer gets a receipt, and no money arrives. It was only ever a log
      # line (MoneyRailConfigGate), and nobody reads the log on a green deploy.
      #
      # This workflow deploys the PRODUCTION app only, so "live" is the only acceptable answer.
      # Staging deploys elsewhere and is expected to be test-mode, which is why the app reports
      # the mode rather than refusing to start on it.
      #
      # `decidedAtUtc: null` means the startup gate never ran — a different fault from a test key,
      # and it fails here too rather than being read as "not live yet".
      - name: Prove the money rail is in live mode
        env:
          API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          set -euo pipefail
          base="${API_URL:-https://api.mumchimp.com}"

          body=$(curl -s --max-time 30 --retry 5 --retry-delay 5 --retry-all-errors \
                   "$base/healthz/money-rail")
          echo "GET $base/healthz/money-rail -> $body"

          # No jq dependency and no secret in the output: the endpoint returns the mode, never
          # the key. A missing route (older image) yields an empty or HTML body and fails here.
          case "$body" in
            *'"mode":"live"'*) echo "money rail is LIVE — real payments will be taken" ;;
            *'"mode":"test"'*) echo "FAIL: production is running a TEST Stripe key. Buyers pay nothing."; exit 1 ;;
            *'"decidedAtUtc":null'*) echo "FAIL: the money-rail startup gate never ran."; exit 1 ;;
            *) echo "FAIL: /healthz/money-rail did not answer — the machines are serving an older image."; exit 1 ;;
          esac

      # SELF-HEALING. Everything above this line ALERTS. `flyctl deploy` ships the image, the
      # proof requests run, and when a proof goes red the bad image keeps serving production
      # until a person reads the failure mail and clicks Rollback. Founder, 2026-08-20:
      # "alerts is one thing, recovery and self healing is anither".
      #
      # This step is the recovery arm. It pulls the rollback that ALREADY EXISTS rather than
      # adding a second one: scripts/rollback_now.py is the same code path the ops console's
      # Rollback button runs. It re-deploys the previous release's image (no build, no source
      # tree, so nothing in this commit can poison it) and probes itself afterwards.
      #
      # The condition is narrow on purpose. A bare `failure()` would also fire when the BUILD
      # failed - production was never touched in that case, and rolling a healthy service back
      # to an older image would be an outage this workflow caused rather than cured.
      # `steps.deploy.outcome == 'success'` is what limits it to the one case that needs
      # healing: the new image IS serving, and it does not answer.
      #
      # The job stays RED either way. Restoring service is not the same as the commit being
      # good, and main still carries it, so the next merge touching these paths ships it again.
      - name: Roll back, because this deploy does not answer
        if: ${{ failure() && steps.deploy.outcome == 'success' }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_API || secrets.FLY_API_TOKEN }}
        run: |
          set -uo pipefail
          python3 scripts/rollback_now.py store-api
          rc=$?
          {
            echo "## Automatic rollback"
            echo ""
            if [ "$rc" = "0" ]; then
              echo "Commit $GITHUB_SHA deployed but did not answer, so prospector-store-api was rolled"
              echo "back to its previous release, and that release passes its health checks."
            else
              echo "Commit $GITHUB_SHA deployed, did not answer, and THE ROLLBACK DID NOT"
              echo "RESTORE IT (exit $rc). This needs a human now."
            fi
            echo ""
            echo "This does not change main. The commit is still there and the next merge"
            echo "touching these paths ships it again. Revert it."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
