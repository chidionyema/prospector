# Ask, on a clock, the one question no other workflow here asks: is production running main?
#
# WHY THIS EXISTS. Measured 2026-08-21, the morning after the ops-console outage:
#
#   1. `deploy-engine.yml` fires on PUSH to main, so a commit reaches production before CI has
#      graded it. `scripts/live_checkout.py` printed the proof: production on 61cfb7d1 while
#      "CI on it" read "pending: still in_progress" for that same commit.
#   2. `main-green-guard.yml` reverts a red commit with GITHUB_TOKEN, which starts no workflow
#      runs, and then dispatches CI and only CI. Its own header: "WHAT IT DOES TO PRODUCTION.
#      Nothing directly." So the reverted code keeps serving. (`main-admission-guard.yml` does
#      re-deploy after its revert — the two guards differ, and only one of them is safe here.)
#   3. Nothing compared the running image to main at all. Before this file, `rg GIT_SHA` matched
#      one script in the whole repo, and the launchd job that would have run it every 60 seconds
#      is not loaded on the founder's laptop.
#
# So a red commit could reach production, be reverted on main, and keep running, with every
# instrument in the estate reporting green. A missing deploy leaves no failing run behind, which
# is why no alert in this estate could ever have fired on it.
#
# WHAT IT DOES NOT DO. It does not build and it does not push. It dispatches `deploy-engine.yml`,
# so there is still exactly one route to production, with its gates and its rollback intact.
# `scripts/deploy_reconcile.py` holds every refusal — ungraded commit, unreadable image stamp,
# deploy already running, and a brake that stops after three dispatches in six hours rather than
# paying for a Fly build every hour on a drift that deploying cannot close.
#
# WHAT IT COSTS. 24 scheduled runs a day plus one per CI run that finishes on main. Each is a
# checkout, a flyctl setup and one `fly ssh console` read — about a minute. Hourly rather than
# every few minutes because the fast path is already covered: the workflow_run trigger below
# fires the moment CI concludes on main, which is when a drift can first be healed.

name: production runs main

on:
  schedule:
    - cron: "17 * * * *"
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report the drift and stop, without dispatching a deploy"
        type: boolean
        default: false

# One at a time. Two of these racing would both see the same drift and both dispatch.
concurrency:
  group: production-runs-main
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # to dispatch deploy-engine.yml
  issues: write # to say so when it cannot heal it

jobs:
  reconcile:
    runs-on: ${{ vars.CI_DEPLOY_RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # The script diffs the deployed commit against main to decide whether anything the
          # image SHIPS actually changed. A shallow clone does not contain the deployed commit,
          # so that question becomes unanswerable and every docs merge would look like a drift.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Is production running main?
        id: reconcile
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_ENGINE || secrets.FLY_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -o pipefail
          : "${FLY_API_TOKEN:?set repo secret FLY_API_TOKEN_ENGINE — without it this cannot read /app/GIT_SHA and would report a drift it cannot see}"
          APPLY=--apply
          if [ "${{ inputs.dry_run }}" = "true" ]; then APPLY=""; fi
          python scripts/deploy_reconcile.py $APPLY 2>&1 | tee /tmp/reconcile.txt
          rc=${PIPESTATUS[0]}
          {
            echo '## deploy reconcile'
            echo '```'
            cat /tmp/reconcile.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      # The alarm hangs off `failure()` of the step above and nothing narrower, because a
      # reporting mechanism whose trigger is narrower than the thing it reports on is never
      # reached and every instrument still says the workflow ran fine
      # (tests/unit/test_an_alarm_must_run_when_the_thing_it_alarms_on_fails.py).
      - name: Say so, where a person will see it
        if: failure()
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs')
            const {owner, repo} = context.repo
            const TITLE = 'production is not running main'
            let detail = '(the reconciler produced no output)'
            try { detail = fs.readFileSync('/tmp/reconcile.txt', 'utf8').trim() || detail } catch (e) {}

            const {data: open} = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100,
            })
            const existing = open.find(i => i.title === TITLE && !i.pull_request)
            const body = [
              '`scripts/deploy_reconcile.py` could not make production match `main`, and stopped',
              'rather than deploying something it could not justify.',
              '',
              '```',
              detail,
              '```',
              '',
              `[the run](${process.env.RUN_URL})`,
              '',
              'It refuses for one of four reasons, and each has a different answer:',
              '',
              '- **main\'s CI is `fail` or `none`** — fix main. Shipping an ungraded commit to',
              '  close a drift is worse than the drift.',
              '- **the image stamp could not be read** — the machine may be stopped, or the image',
              '  was built without `GIT_SHA`. `fly status -a prospector-engine`, then',
              '  `fly ssh console -a prospector-engine -C \'/bin/cat /app/GIT_SHA\'`.',
              '- **three deploys already went out in six hours** and production still does not',
              '  match. Deploying again will not close it either; read the stamp by hand.',
              '- **the dispatch itself failed** — `gh workflow run deploy-engine.yml --ref main`.',
              '',
              'This issue is reused, not duplicated, while the drift lasts, and closed by the',
              'first run that finds production on `main`.',
            ].join('\n')

            if (existing) {
              await github.rest.issues.createComment({owner, repo, issue_number: existing.number, body})
              core.notice(`commented on #${existing.number}`)
            } else {
              const {data: issue} = await github.rest.issues.create({owner, repo, title: TITLE, body})
              core.notice(`opened #${issue.number}`)
            }

      # NOT `success()`. The step exits 0 for five reasons and only two of them mean
      # production matches main -- the others are "waiting for CI", "a deploy is already
      # running" and "just dispatched one". `success()` closed this issue on all five and
      # commented that production matched main when it did not.
      - name: Close the drift issue, because production matches main again
        if: steps.reconcile.outputs.outcome == 'ok'
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo
            const TITLE = 'production is not running main'
            const {data: open} = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100,
            })
            for (const issue of open) {
              if (issue.title !== TITLE || issue.pull_request) continue
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: 'Production matches `main` again. Closing.',
              })
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'completed',
              })
              core.notice(`closed #${issue.number}`)
            }
