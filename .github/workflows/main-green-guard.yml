# Main must be green. If it is not, put it back.
#
# WHY THIS EXISTS. Founder, 2026-08-19: "main should always be green, if broken should revert to
# last working version so builds are never blocked", and "we need to be able to recover in the
# event of main being red also, cant have prs queuing up".
#
# A red main is not one team's problem. Every open branch inherits the failure, so every PR goes
# red for a reason that has nothing to do with its diff, and every session then spends time
# diagnosing somebody else's breakage. On 2026-08-19 thirteen of seventeen open PRs were red for
# three failures, none of which was in the PR that failed.
#
# PREVENTION IS ISSUE #404, NOT THIS FILE. automerge.yml merges any PR whose head sha CI passed
# without checking whether the branch is behind main, so two individually-green branches make
# main red. That is the cause. This file is the RECOVERY, and it exists because prevention will
# never be perfect and a red main must not be allowed to sit.
#
# WHAT IT DOES.
#   attempt 1 fails  ->  re-run the failed jobs once, and stop.
#   attempt 2 fails  ->  revert the commit the run tested, push, dispatch CI, open an issue.
#
# The single re-run is deliberate. The two known infrastructure failure classes in this estate --
# a 429 downloading actions, and a runner dropping mid-job -- both pass on a re-run, and neither
# is anybody's code. Reverting on the first failure would revert good work for a network blip.
#
# EVERY RISK OF AN AUTO-REVERT, AND WHAT ANSWERS IT.
#
#   Reverting good work.        A revert is an ordinary commit. `git revert` of the revert
#                               restores it, and the issue this opens names the sha to use.
#   Blaming an inherited red.   `scripts/green_guard_cause.py` asks whether the commit's FIRST
#                               PARENT already failed CI. If it did, main was broken before this
#                               commit arrived and reverting it cannot be the fix, so the guard
#                               stands down and opens an issue naming the parent instead. This
#                               row was written on 2026-08-20, after the guard reverted #466 --
#                               the whole central logging build, 48 files -- for five failures of
#                               which four came from #460 and #467. Its own next run,
#                               32317556934 on the revert commit 739b6d42, failed on the same
#                               five tests, so the revert did not make main green.
#   Reverting a flake.          The re-run above.
#   Racing a human fix.         Refuses if main's HEAD has moved since the failing run.
#   Ping-pong.                  Refuses to revert a commit that is itself a revert.
#   A revert storm.             Refuses if this workflow already reverted within the last hour.
#   A silent revert.            The issue is opened BEFORE the push. If the issue cannot be
#                               opened, nothing is reverted -- work never disappears quietly.
#   A conflicting revert.       `git revert` conflicts abort the job and open an issue. Nothing
#                               is forced, nothing is resolved by a machine.
#   Reverting a merge commit.   Handled with `-m 1`; a merge with no first parent is refused.
#   Triggering a deploy.        The push uses GITHUB_TOKEN, which does not start workflow runs,
#                               so no deploy fires from a revert. CI is then dispatched
#                               explicitly, and ONLY CI.
#   Recursing into itself.      Same rule: the revert push starts no workflow_run, so this guard
#                               cannot trigger itself. The dispatched CI is a separate event.
#   Two guards at once.         `concurrency` with no cancel-in-progress.
#
# WHAT IT DOES TO PRODUCTION. Nothing directly. It changes `main` and dispatches CI. Deploys are
# separate workflows and are not dispatched here.

name: Main green guard

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: main-green-guard
  cancel-in-progress: false

permissions:
  contents: write # to push the revert
  actions: write # to re-run failed jobs and dispatch CI after the revert
  issues: write # a revert is never silent

jobs:
  # Attempt 1: give it one re-run. Most red mains in this estate are infrastructure, not code.
  rerun:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run_id = context.payload.workflow_run.id
            await github.rest.actions.reRunWorkflowFailedJobs({
              owner: context.repo.owner, repo: context.repo.repo, run_id,
            })
            core.notice(
              `main is red on run ${run_id}. Re-running the failed jobs once. ` +
              'If it fails again the breaking commit is reverted.')

  # Attempt 2 or later: it is real. Put main back.
  revert:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.run_attempt > 1
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 50

      # Was main already broken before this commit landed? Answered from the parent's own CI
      # run, never from the diff. A `unknown` verdict PROCEEDS on purpose -- see the script's
      # docstring -- so this check can stop a wrong revert but can never cause one.
      - name: Ask whether main was already red before this commit
        id: cause
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/green_guard_cause.py --sha "${{ github.event.workflow_run.head_sha }}"

      - name: Decide whether reverting is the right thing to do
        id: decide
        uses: actions/github-script@v7
        # The cause probe's answer arrives as ENV, not as `${{ }}` spliced into the script body.
        # Actions substitutes an expression before node ever sees the file, so the body only has
        # to parse AFTER substitution -- and `tests/unit/test_the_green_guard_reverts_the_cause_
        # not_the_head.py` parses it BEFORE, by lifting this script out of the YAML and running
        # it in node. With the expressions inline it did not parse at all:
        #
        #   SyntaxError: missing ) after argument list
        #       ${{ toJSON(steps.cause.outputs.why) }} +
        #
        # That took every one of those nine tests down with it, and nothing said so: node is not
        # on the CI runner, so the file skipped itself and the job stayed green. Through env the
        # script is ordinary JavaScript, which is the only form a test can execute.
        env:
          CAUSE_VERDICT: ${{ steps.cause.outputs.verdict }}
          CAUSE_WHY: ${{ steps.cause.outputs.why }}
        with:
          script: |
            const {owner, repo} = context.repo
            const run = context.payload.workflow_run
            const sha = run.head_sha

            const refuse = (why, reason) => {
              core.notice(`not reverting: ${why}`)
              core.setOutput('go', 'no')
              core.setOutput('why', why)
              core.setOutput('reason', reason || 'other')
            }

            // The first question, because it is the only one that can prove this commit did not
            // do it. Every check below asks whether reverting is SAFE. This one asks whether it
            // is even the right commit.
            if (process.env.CAUSE_VERDICT === 'already-red') {
              return refuse(
                `main was already red before ${sha.slice(0, 8)} landed: ` +
                (process.env.CAUSE_WHY || 'the cause probe gave no reason') +
                '. Reverting it deletes work and leaves main exactly as red.',
                'already-red')
            }

            // Someone may already be fixing it. Never race a human.
            const {data: head} = await github.rest.repos.getBranch({owner, repo, branch: 'main'})
            if (head.commit.sha !== sha) {
              return refuse(`main has moved to ${head.commit.sha.slice(0, 8)} since the failing ` +
                            `run tested ${sha.slice(0, 8)}; assume that is the fix`)
            }

            const {data: commit} = await github.rest.repos.getCommit({owner, repo, ref: sha})
            const subject = commit.commit.message.split('\n')[0]

            // A revert of a revert is how a loop starts.
            if (/^revert/i.test(subject)) {
              return refuse(`${sha.slice(0, 8)} is itself a revert ("${subject}"); a human decides ` +
                            'what happens next')
            }

            // A merge with no first parent cannot be reverted safely.
            const parents = commit.parents.length
            if (parents === 0) return refuse('the commit has no parent')

            // One revert per hour. A storm is worse than a red main.
            const since = new Date(Date.now() - 60 * 60 * 1000).toISOString()
            const {data: recent} = await github.rest.repos.listCommits(
              {owner, repo, sha: 'main', since, per_page: 20})
            const already = recent.find(c =>
              c.commit.message.startsWith('Revert') &&
              c.commit.message.includes('main-green-guard'))
            if (already) {
              return refuse(`this guard already reverted ${already.sha.slice(0, 8)} within the ` +
                            'last hour; stopping rather than reverting again')
            }

            // THE HEAD IS NOT NECESSARILY THE CAUSE. 2026-08-19: #460 merged with its own CI
            // already failing and broke main. Three commits later this guard reverted #463 --
            // the HEAD, and innocent -- opened #468 blaming its author, and left main red,
            // because the file that actually broke it was never touched.
            //
            // So before reverting, ask whether main was ALREADY failing this way one commit
            // earlier. If the same job failed on the parent, this commit cannot be the cause.
            //
            // This only ever REFUSES on positive evidence. No run on the parent, a run still in
            // flight, or an API that throws all fall through to the old behaviour: a red main
            // blocks every open PR, and being unable to prove innocence is not proof of guilt.
            const failingJobs = async (run_id) => {
              const {data} = await github.rest.actions.listJobsForWorkflowRun(
                {owner, repo, run_id, filter: 'latest', per_page: 100})
              return new Set(
                data.jobs.filter(j => j.conclusion === 'failure').map(j => j.name))
            }
            try {
              const mine = await failingJobs(run.id)
              const parent = commit.parents[0].sha
              const {data: prior} = await github.rest.actions.listWorkflowRunsForRepo(
                {owner, repo, branch: 'main', head_sha: parent, per_page: 20})
              for (const p of prior.workflow_runs) {
                if (p.conclusion !== 'failure') continue
                const theirs = await failingJobs(p.id)
                const shared = [...mine].filter(n => theirs.has(n))
                if (shared.length) {
                  core.setOutput('blame', parent)
                  core.setOutput('blame_jobs', shared.join(', '))
                  core.setOutput('blame_run', p.html_url)
                  return refuse(
                    `${sha.slice(0, 8)} is not the cause: ${parent.slice(0, 8)} already failed ` +
                    `the same job(s) [${shared.join(', ')}]. Reverting the head would remove ` +
                    'innocent work and leave main red.')
                }
              }
            } catch (e) {
              // Never let this check kill the job. An unhandled throw part way through a
              // github-script step silently drops every line below it -- that is how the merge
              // of #451 landed on main ungraded on 2026-08-19.
              core.warning(`could not check the parent commit, proceeding: ${e.message}`)
            }

            core.setOutput('go', 'yes')
            core.setOutput('sha', sha)
            core.setOutput('subject', subject)
            core.setOutput('author', commit.commit.author.name || 'unknown')
            core.setOutput('parents', String(parents))
            core.setOutput('run_url', run.html_url)

      - name: Name the commit that really broke main
        if: steps.decide.outputs.blame != ''
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo
            const blame = '${{ steps.decide.outputs.blame }}'
            const title = `main is red, and ${blame.slice(0, 8)} is where it started`
            // One issue per suspect. Every subsequent failed run on main would otherwise open
            // another, and an alarm that repeats is an alarm people filter out.
            const {data: open} = await github.rest.issues.listForRepo(
              {owner, repo, state: 'open', per_page: 100})
            if (open.some(i => i.title === title)) {
              core.notice(`already reported: ${title}`)
              return
            }
            const {data: issue} = await github.rest.issues.create({
              owner, repo, title,
              body: [
                'The green guard stood down instead of reverting, because the commit at the head',
                'of `main` is provably not the cause.',
                '',
                `- **failing job(s)** ${{ toJSON(steps.decide.outputs.blame_jobs) }}`,
                `- **already failing at** \`${blame}\` — ${{ steps.decide.outputs.blame_run }}`,
                `- **the run that triggered this** ${{ steps.decide.outputs.run_url }}`,
                '',
                'Reverting the head would have deleted innocent work and left `main` red, which',
                'is what happened on 2026-08-19 to #463.',
                '',
                '## What to do',
                '',
                'Read the failing job, fix the cause, and open the PR with the `fixes-main` label',
                'so it can build while main is red. The label must be on the PR BEFORE the run',
                'starts: labels in the event payload are frozen at dispatch.',
                '',
                '```bash',
                '.venv/bin/python scripts/main_red.py',
                '```',
              ].join('\n'),
            })
            core.notice(`opened #${issue.number}`)

      - name: Say why nothing was reverted
        if: steps.decide.outputs.go != 'yes'
        run: |
          echo "main is red and this guard stood down."
          echo "reason: ${{ steps.decide.outputs.why }}"

      # A stand-down leaves main RED. The other refusals hand off to something already in motion
      # -- a human pushing a fix, an earlier revert, a run that has moved on. This one does not:
      # nobody is working on it, because nobody has been told. One issue, reused, so a main that
      # stays red across six runs does not open six issues.
      - name: Say so where somebody will see it, because main is still red
        if: steps.decide.outputs.go != 'yes' && steps.decide.outputs.reason == 'already-red'
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo
            const title = 'main is red, and it was already red before the newest commit'
            const body = [
              'The green guard stood down instead of reverting, because the failure is older',
              'than the commit it would have reverted.',
              '',
              `- **commit CI tested** \`${context.payload.workflow_run.head_sha}\``,
              `- **why** ${{ toJSON(steps.decide.outputs.why) }}`,
              `- **failing run** ${context.payload.workflow_run.html_url}`,
              '',
              'Fix the actual cause. Reverting the newest merge would delete good work and leave',
              'main exactly as red. That is what happened to #466 on 2026-08-20, and the proof is',
              'that CI on the revert commit failed on the same five tests.',
              '',
              'Start with `scripts/main_red.py`, then open the failing JOB LOG rather than the run',
              'summary: the summary says a job failed, only the log says what failed.',
            ].join('\n')
            const {data: found} = await github.rest.issues.listForRepo(
              {owner, repo, state: 'open', per_page: 100})
            const existing = found.find(i => i.title === title && !i.pull_request)
            if (existing) {
              await github.rest.issues.createComment(
                {owner, repo, issue_number: existing.number, body})
              core.notice(`main still red; commented on #${existing.number}`)
            } else {
              const {data: issue} = await github.rest.issues.create({owner, repo, title, body})
              core.notice(`main still red; opened #${issue.number}`)
            }

      # The issue is opened BEFORE the push, on purpose. If GitHub refuses the issue, the revert
      # never happens -- a revert nobody was told about is how work disappears.
      - name: Open the issue first, so the revert can never be silent
        if: steps.decide.outputs.go == 'yes'
        id: issue
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo
            const sha = '${{ steps.decide.outputs.sha }}'
            const {data: issue} = await github.rest.issues.create({
              owner, repo,
              title: `main was red: ${sha.slice(0, 8)} reverted by the green guard`,
              body: [
                `\`main\` failed CI twice on \`${sha}\`, so the green guard reverted it. A red main`,
                'blocks every open PR, so it is put back first and diagnosed second.',
                '',
                `- **commit** \`${sha}\` — ${{ toJSON(steps.decide.outputs.subject) }}`,
                `- **author** ${{ toJSON(steps.decide.outputs.author) }}`,
                `- **failing run** ${{ steps.decide.outputs.run_url }}`,
                '',
                '## Nothing is lost',
                '',
                'The revert is an ordinary commit. To bring the work back once it is fixed:',
                '',
                '```bash',
                `git revert <the revert sha>     # restores ${sha.slice(0, 8)}`,
                '```',
                '',
                '## Before re-landing it',
                '',
                'Rebase on current `main` and let CI run against the combination, not against the',
                'base this branch was cut from. That gap is issue #404 and is the reason most red',
                'mains in this repo were never anybody\'s bug.',
              ].join('\n'),
            })
            core.setOutput('number', String(issue.number))
            core.notice(`opened #${issue.number}`)

      - name: Revert it and push
        if: steps.decide.outputs.go == 'yes'
        env:
          SHA: ${{ steps.decide.outputs.sha }}
          PARENTS: ${{ steps.decide.outputs.parents }}
          ISSUE: ${{ steps.issue.outputs.number }}
        run: |
          set -euo pipefail
          git config user.name "main-green-guard"
          git config user.email "actions@github.com"
          MAINLINE=""
          if [ "$PARENTS" -gt 1 ]; then MAINLINE="-m 1"; fi
          # --no-edit keeps the default "Revert ..." subject, which the storm guard above matches.
          if ! git revert --no-edit $MAINLINE "$SHA"; then
            git revert --abort || true
            echo "::error::the revert conflicts and a machine must not resolve it; see #$ISSUE"
            exit 1
          fi
          git commit --amend --no-edit -m "$(git log -1 --pretty=%s)

          Reverted by main-green-guard because CI failed twice on $SHA and a red
          main blocks every open pull request. Nothing is lost: see #$ISSUE for how
          to bring the work back.

          Refs #$ISSUE"
          git push origin main

      - name: Start CI on the reverted main
        if: steps.decide.outputs.go == 'yes'
        uses: actions/github-script@v7
        with:
          script: |
            // The push above used GITHUB_TOKEN, which starts no workflow runs. That is what stops
            // this guard recursing, and it is also why CI has to be asked for by name.
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'ci.yml', ref: 'main',
            })
            core.notice('main reverted and CI dispatched')

  # ─── A MAIN RUN THAT NEVER REACHED A VERDICT IS THE THIRD FAILURE, AND IT WAS UNGUARDED ────
  #
  # The two jobs above both require `conclusion == 'failure'`. A CI run on main can also end
  # `cancelled`, `timed_out` or `stale`, and every one of those leaves main's colour UNKNOWN
  # rather than red. Nothing above fires, so nothing looks, and main stays unknown until a
  # person notices.
  #
  # MEASURED 2026-08-20. Main's own runs at 802a2e4b and fe6fcd13 both ended `cancelled` with
  # ZERO jobs -- 32311937136 sat queued for forty minutes and was killed. The guard skipped both
  # (runs 32314822031 and 32314849990, `completed/skipped`). Main was red on two tests the whole
  # time and no machine in the estate was watching, because "red" was never established.
  #
  # WHY IT COST SO MUCH. ci.yml's `changes` step refuses to build any pull request while main's
  # last completed run did not succeed. An unknown main is a non-green main, so every pull
  # request skipped every build job -- and a skipped job renders as neutral grey, not red. Four
  # pull requests were then merged by hand on that appearance. Founder, on the click that took:
  # "i merged the prs ... because they were there and they said passed checks", and on the
  # remedy: "i dont like the manual intervention", "if main is never red then there would be no
  # need for manual approval".
  #
  # SO THIS JOB DOES ONE THING: ask for the verdict again. It never reverts. A cancelled run is
  # not evidence that anything is wrong with the code, and reverting on no evidence is the exact
  # mistake this file was repaired for on 2026-08-19.
  #
  # THE THREE WAYS IT COULD MAKE THINGS WORSE, AND WHAT STOPS EACH:
  #   Fighting a person.   Someone cancelling a main run on purpose gets it restarted. Bounded:
  #                        it gives up after MAX_ATTEMPTS runs at the same commit and says so.
  #   Restarting a queue.  If a newer CI run on main is already queued or in progress, main's
  #                        verdict is already coming and this stands aside.
  #   Recursing.           Dispatching CI creates a run; if THAT is cancelled this job fires
  #                        again -- which is the point -- but the attempt count is read from the
  #                        commit, not the run, so the ceiling holds across all of them.
  restart:
    if: >
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.conclusion == 'cancelled' ||
       github.event.workflow_run.conclusion == 'timed_out' ||
       github.event.workflow_run.conclusion == 'stale')
    runs-on: ${{ vars.CI_LIGHT_RUNS_ON || vars.CI_RUNS_ON || 'ubuntu-latest' }}
    steps:
      - name: Ask main for a verdict again
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo
            const sha = context.payload.workflow_run.head_sha
            // Three runs at one commit is enough to tell a flaky runner from a queue nobody can
            // serve. Past that the answer is capacity, and a fourth run does not find it.
            const MAX_ATTEMPTS = 3

            let runs = []
            try {
              const {data} = await github.rest.actions.listWorkflowRuns(
                {owner, repo, workflow_id: 'ci.yml', branch: 'main', per_page: 50})
              runs = data.workflow_runs
            } catch (e) {
              // Fail open and loudly. A guard that cannot read must not also block.
              core.warning(`could not list main's CI runs (${e.message}) - not restarting`)
              return
            }

            const live = runs.filter(
              r => r.status === 'queued' || r.status === 'in_progress')
            if (live.length > 0) {
              core.info(
                `main already has ${live.length} CI run(s) in flight ` +
                `(${live.map(r => r.id).join(', ')}) - its verdict is already coming`)
              return
            }

            const atSha = runs.filter(r => r.head_sha === sha)
            if (atSha.length >= MAX_ATTEMPTS) {
              const msg =
                `CI on main has ended without a verdict ${atSha.length} times at ${sha.slice(0, 8)} ` +
                `(${atSha.map(r => `${r.id}=${r.conclusion}`).join(', ')}). ` +
                `That is a capacity or runner fault, not a flake, and restarting it again will ` +
                `not find it. Main's colour is UNKNOWN, which blocks every pull request build.`
              core.error(msg)
              try {
                await github.rest.issues.create({
                  owner, repo,
                  title: `main has no CI verdict at ${sha.slice(0, 8)}`,
                  body: msg,
                  labels: ['ci'],
                })
              } catch (e) {
                core.warning(`could not open the issue: ${e.message}`)
              }
              return
            }

            try {
              await github.rest.actions.createWorkflowDispatch(
                {owner, repo, workflow_id: 'ci.yml', ref: 'main'})
            } catch (e) {
              core.setFailed(`could not dispatch CI on main: ${e.message}`)
              return
            }
            core.notice(
              `main's CI ended ${context.payload.workflow_run.conclusion} at ${sha.slice(0, 8)} ` +
              `with no verdict - dispatched attempt ${atSha.length + 1} of ${MAX_ATTEMPTS}`)
