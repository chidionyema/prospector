# Playwright storefront smoke against the LIVE site.
#
# Why this is its own workflow rather than a job in ci.yml:
#
# It used to run on `push: main` alongside ci.yml's other jobs. Once Store.Web started deploying
# from GitHub on that same push, the two raced — Playwright would hit https://mumchimp.com while
# the Fly rolling update was still in flight, so a green run proved the OLD image worked and a red
# run usually meant "you caught a machine mid-roll", not a real defect. A gate that is green for
# the wrong reason is worse than no gate.
#
# `workflow_run` fixes the ordering properly: this only starts once "Deploy Store.Web" has
# COMPLETED, and the job guard below drops it unless that deploy actually succeeded (a failed
# deploy leaves the previous image serving, so smoking it would test code that never shipped).
#
# The daily schedule is not belt-and-braces, it covers a failure mode no push trigger ever could:
# this storefront breaks without anyone committing. The specs assert the home page lists at least
# one pack, and that depends on the live Store.Api catalogue and on Stripe — the 2 unbuyable packs
# found on 2026-07-31 were a data/config fault with no commit behind them. Deploys catch bad code;
# the schedule catches bad state.

name: Live storefront smoke

on:
  workflow_run:
    workflows: ["Deploy Store.Web"]
    types: [completed]
  schedule:
    # 07:00 UTC daily — before the UK working day, so a broken shelf is known before buyers arrive.
    - cron: "0 7 * * *"
  workflow_dispatch:

# One smoke at a time. Two overlapping runs against the same live site tell you nothing extra and
# make the report artifacts ambiguous about which run produced them.
concurrency:
  group: e2e-live-smoke
  cancel-in-progress: false

# THE ALERT NEEDS TO WRITE. Everything else here reads, so this block is the whole reason the
# workflow has any write scope at all: the failure step opens or comments on one issue, and the
# success step closes it. Nothing here can touch code.
permissions:
  contents: read
  issues: write

jobs:
  smoke:
    # A deploy that failed did not change the site, so there is nothing new to smoke; running
    # anyway would attribute a pre-existing failure to a deploy that never landed.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ${{ vars.CI_HEAVY_RUNS_ON || vars.CI_RUNS_ON || 'ubuntu-latest' }}

    defaults:
      run:
        working-directory: store_platform/src/Store.Web/

    steps:
      # On a workflow_run event the default checkout is the default branch, which is what we want:
      # the specs must match the code that was just deployed from main, not whatever branch
      # triggered anything else.
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: store_platform/src/Store.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Storefront smoke against live
        run: npm run test:e2e
        env:
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL || 'https://mumchimp.com' }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: store_platform/src/Store.Web/playwright-report/
          retention-days: 7

      # ------------------------------------------------------------------------------------
      # THE ALERT. This workflow went red on 2026-08-19 and stayed red for 30 hours, and
      # nobody was told. The whole notification path was a non-zero exit and an artifact on a
      # run page nobody opens. The 07:00 UTC schedule makes that worse rather than better: it
      # exists to catch breakage with no commit behind it, so there is not even a push author
      # who might glance at the tick.
      #
      # ONE ISSUE, REUSED. A daily cron against a site that stays broken would otherwise open
      # 30 issues. The failure step searches for an open issue carrying the `live-red` label
      # and comments on it if one exists, so the issue becomes a running log of every failed
      # run rather than a pile of duplicates.
      #
      # AND IT CLOSES ITSELF. Self-healing first: the success step closes that issue when the
      # smoke passes again. That is what makes the signal readable without opening anything —
      # an OPEN `live-red` issue means the live storefront is red RIGHT NOW, and no open issue
      # means it is not. A state you have to interpret is a state nobody checks.
      #
      # Tracked as issue #415. Its sibling fence is the pre-deploy geometry gate in ci.yml's
      # `nextjs` job, which stops the defect shipping; this one is what speaks when a live
      # check goes red anyway.
      # ------------------------------------------------------------------------------------
      - name: Raise the alarm (live smoke is red)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
            const trigger = context.eventName === 'schedule'
              ? 'the 07:00 UTC schedule (no commit behind it — this is live STATE, not code)'
              : `a ${context.eventName} event`

            const {data: open} = await github.rest.issues.listForRepo(
              {owner, repo, state: 'open', labels: 'live-red', per_page: 1})

            const line =
              `Live smoke failed again at ${new Date().toISOString()}, from ${trigger}.\n\n` +
              `Run: ${runUrl}`

            if (open.length > 0) {
              await github.rest.issues.createComment(
                {owner, repo, issue_number: open[0].number, body: line})
              core.notice(`live smoke red — commented on #${open[0].number}`)
              return
            }

            const body = [
              '**The live storefront smoke is failing.** This issue was opened by',
              '`.github/workflows/e2e-live-smoke.yml` and will CLOSE ITSELF as soon as the smoke',
              'passes again, so while it is open, https://mumchimp.com is failing its checks now.',
              '',
              line,
              '',
              'The Playwright report is on that run as the `playwright-report` artifact.',
              '',
              'Two things this does NOT mean. It is not necessarily a bad deploy: the daily',
              'schedule catches faults with no commit behind them, such as the 2 unbuyable packs',
              'found on 2026-07-31, which were live data and config. And it is not a mid-roll',
              'false positive: the job guard drops any run whose deploy did not succeed.',
            ].join('\n')

            const {data: made} = await github.rest.issues.create({
              owner, repo, labels: ['live-red'],
              title: 'Live storefront smoke is red',
              body,
            })
            core.notice(`live smoke red — opened #${made.number}`)

      - name: Stand the alarm down (live smoke is green again)
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
            const {data: open} = await github.rest.issues.listForRepo(
              {owner, repo, state: 'open', labels: 'live-red', per_page: 100})
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `Live smoke passed at ${new Date().toISOString()}. Closing.\n\nRun: ${runUrl}`,
              })
              await github.rest.issues.update(
                {owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'completed'})
              core.notice(`live smoke green — closed #${issue.number}`)
            }
