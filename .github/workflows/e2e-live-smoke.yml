# Playwright storefront smoke against the LIVE site.
#
# Why this is its own workflow rather than a job in ci.yml:
#
# It used to run on `push: main` alongside ci.yml's other jobs. Once Store.Web started deploying
# from GitHub on that same push, the two raced — Playwright would hit https://mumchimp.com while
# the Fly rolling update was still in flight, so a green run proved the OLD image worked and a red
# run usually meant "you caught a machine mid-roll", not a real defect. A gate that is green for
# the wrong reason is worse than no gate.
#
# `workflow_run` fixes the ordering properly: this only starts once "Deploy Store.Web" has
# COMPLETED, and the job guard below drops it unless that deploy actually succeeded (a failed
# deploy leaves the previous image serving, so smoking it would test code that never shipped).
#
# The daily schedule is not belt-and-braces, it covers a failure mode no push trigger ever could:
# this storefront breaks without anyone committing. The specs assert the home page lists at least
# one pack, and that depends on the live Store.Api catalogue and on Stripe — the 2 unbuyable packs
# found on 2026-07-31 were a data/config fault with no commit behind them. Deploys catch bad code;
# the schedule catches bad state.

name: Live storefront smoke

on:
  workflow_run:
    workflows: ["Deploy Store.Web"]
    types: [completed]
  schedule:
    # 07:00 UTC daily — before the UK working day, so a broken shelf is known before buyers arrive.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      update_visual_baselines:
        description: "Regenerate the visual baselines from the live site and commit them"
        type: boolean
        default: false

# One smoke at a time. Two overlapping runs against the same live site tell you nothing extra and
# make the report artifacts ambiguous about which run produced them.
concurrency:
  group: e2e-live-smoke
  cancel-in-progress: false

# THE ALERT NEEDS TO WRITE. Everything else here reads, so this block is the whole reason the
# workflow has any write scope at all: the failure step opens or comments on one issue, and the
# success step closes it. Nothing here can touch code.
permissions:
  contents: read
  issues: write

jobs:
  smoke:
    # A deploy that failed did not change the site, so there is nothing new to smoke; running
    # anyway would attribute a pre-existing failure to a deploy that never landed.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ${{ vars.CI_HEAVY_RUNS_ON || vars.CI_RUNS_ON || 'ubuntu-latest' }}

    defaults:
      run:
        working-directory: store_platform/src/Store.Web/

    steps:
      # On a workflow_run event the default checkout is the default branch, which is what we want:
      # the specs must match the code that was just deployed from main, not whatever branch
      # triggered anything else.
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: store_platform/src/Store.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Storefront smoke against live
        run: npm run test:e2e
        env:
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL || 'https://mumchimp.com' }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: store_platform/src/Store.Web/playwright-report/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────
  # ACCESSIBILITY, against the same live site the smoke just walked.
  #
  # Separate job, not a step in `smoke`, for one reason: they answer different questions and a
  # buyer-blocking break should not be hidden behind an axe finding, or the other way round. Both
  # run, both report.
  #
  # This is the RUNTIME half. eslint-plugin-jsx-a11y already fails the build on the static half
  # (eslint.config.mjs runs its full recommended set as errors), and it cannot see contrast, focus
  # order, duplicate landmarks, or an aria-labelledby pointing at an id that never rendered.
  # ──────────────────────────────────────────────────────────────────
  a11y:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ${{ vars.CI_HEAVY_RUNS_ON || vars.CI_RUNS_ON || 'ubuntu-latest' }}

    defaults:
      run:
        working-directory: store_platform/src/Store.Web/

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: store_platform/src/Store.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: axe-core against live
        run: npm run test:a11y
        env:
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL || 'https://mumchimp.com' }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: store_platform/src/Store.Web/playwright-report/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────
  # LIGHTHOUSE. Budgets for what a buyer's browser has to do, measured on the delivered site
  # rather than on a build artefact — bundle size is not the question, delivery is.
  #
  # The thresholds live in store_platform/src/Store.Web/lighthouserc.cjs and were set from a real
  # run. Raising one to make this green is the failure mode; the file says so at the top.
  # ──────────────────────────────────────────────────────────────────
  lighthouse:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ${{ vars.CI_HEAVY_RUNS_ON || vars.CI_RUNS_ON || 'ubuntu-latest' }}

    defaults:
      run:
        working-directory: store_platform/src/Store.Web/

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: store_platform/src/Store.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # lhci drives Chrome directly. Playwright's chromium is already a known-good download on
      # these runners, so it is reused rather than installing a second browser.
      - name: Install Chrome
        run: npx playwright install --with-deps chromium

      - name: Lighthouse budgets against live
        # CHROME_PATH MUST BE THE EXECUTABLE, AND IT IS ASKED FOR RATHER THAN SPELLED OUT.
        # It was `${{ github.workspace }}/.cache/ms-playwright` from 9d90427c (#398, 2026-08-19)
        # until 2026-08-21. That is a browsers ROOT DIRECTORY, not a binary, and not even the
        # right directory -- `npx playwright install` writes to `~/.cache/ms-playwright` unless
        # PLAYWRIGHT_BROWSERS_PATH says otherwise, and nothing here sets it. So lhci got a path
        # that was neither executable nor present, and every run since has died with
        # `Chrome installation not found / Healthcheck failed!` -- measured on runs 96265960654,
        # 96353533094, 96535652058 and 96705598103. NO BUDGET IN `lighthouserc.cjs` HAS EVER
        # BEEN EVALUATED: the step has never once reached Lighthouse.
        #
        # Playwright knows where it put the browser, including the version-stamped directory name
        # that changes on every playwright bump, so ask it. Hard-coding that path is how this
        # breaks again silently the next time the dependency moves.
        run: |
          set -euo pipefail
          CHROME_PATH="$(node -e "console.log(require('playwright-core').chromium.executablePath())")"
          echo "resolved CHROME_PATH=$CHROME_PATH"
          test -x "$CHROME_PATH"   # fail LOUDLY here, not 40 lines into an lhci healthcheck
          export CHROME_PATH
          npm run test:lighthouse
        env:
          LHCI_URL: ${{ vars.WEB_BASE_URL || 'https://mumchimp.com' }}

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: store_platform/src/Store.Web/.lighthouseci/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────
  # VISUAL BASELINES. Dispatch only, and only when explicitly asked for.
  #
  # A screenshot baseline is platform-specific: a shot taken on darwin never grades a run on
  # Linux, because the font stacks and the subpixel rendering differ. CI is Linux, so the
  # baselines CI compares against have to be SHOT on Linux, which is what this job is for.
  #
  # It commits, so it is fenced three ways: dispatch only, the boolean input must be true, and it
  # runs on no schedule and no push. A scheduled run that could write to the repo is a scheduled
  # run that can rewrite the thing it is supposed to be checking.
  #
  # Updating a baseline is a claim that the new look is CORRECT. Look at the diff as a picture
  # before merging it.
  # ──────────────────────────────────────────────────────────────────
  visual-baselines:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines }}
    runs-on: ${{ vars.CI_HEAVY_RUNS_ON || vars.CI_RUNS_ON || 'ubuntu-latest' }}
    permissions:
      contents: write

    defaults:
      run:
        working-directory: store_platform/src/Store.Web/

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: store_platform/src/Store.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Shoot the baselines
        run: npm run test:visual:update
        env:
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL || 'https://mumchimp.com' }}

      - name: Commit them
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only the snapshot directories. `git add -A` in this repo picks up tracked runtime
          # state under store/ and storage/ that the suite writes to.
          git add "e2e/**/*-snapshots/**" || true
          if git diff --cached --quiet; then
            echo "baselines unchanged"
            exit 0
          fi
          git commit -m "chore(web): refresh Playwright visual baselines on Linux"
          git push origin HEAD:${{ github.ref_name }}

  # ----------------------------------------------------------------------------------------
  # THE ALARM IS ITS OWN JOB, and that is the fix for a defect that ran silently for weeks.
  #
  # These two steps used to sit at the end of the `visual-baselines` job. That job only runs on
  # `workflow_dispatch` with `update_visual_baselines`, so on the daily schedule and on every
  # deploy it was SKIPPED, and a skipped job runs no steps. A red live smoke therefore told
  # nobody. That is the silence recorded in memory
  # `a-check-that-runs-after-deploy-cannot-prevent-a-deploy.md`. Measured 2026-08-19: five
  # consecutive live-smoke runs failed and not one issue was opened.
  #
  # It also inherited that job's `permissions: {contents: write}`. A JOB-level block REPLACES the
  # top-level one rather than adding to it, so the top-level `issues: write` was gone and all four
  # issues.* calls below would have returned 403 even on the one trigger that did run them.
  # tests/unit/test_a_workflow_permission_block_covers_its_api_calls.py refuses that class now.
  # ----------------------------------------------------------------------------------------
  alarm:
    needs: [smoke, a11y, lighthouse]
    # `always()` so it speaks when a check FAILED, which is the entire point. The second half
    # keeps it quiet when the deploy guard dropped all three: "no smoke ran" is not evidence the
    # site is green, and must not close an open issue.
    if: ${{ always() && !(needs.smoke.result == 'skipped'
                          && needs.a11y.result == 'skipped'
                          && needs.lighthouse.result == 'skipped') }}
    runs-on: ${{ vars.CI_LIGHT_RUNS_ON || vars.CI_RUNS_ON || 'ubuntu-latest' }}
    # It writes one issue and nothing else. No checkout, so no contents scope.
    permissions:
      issues: write

    steps:


      # ------------------------------------------------------------------------------------
      # THE ALERT. This workflow went red on 2026-08-19 and stayed red for 30 hours, and
      # nobody was told. The whole notification path was a non-zero exit and an artifact on a
      # run page nobody opens. The 07:00 UTC schedule makes that worse rather than better: it
      # exists to catch breakage with no commit behind it, so there is not even a push author
      # who might glance at the tick.
      #
      # ONE ISSUE, REUSED. A daily cron against a site that stays broken would otherwise open
      # 30 issues. The failure step searches for an open issue carrying the `live-red` label
      # and comments on it if one exists, so the issue becomes a running log of every failed
      # run rather than a pile of duplicates.
      #
      # AND IT CLOSES ITSELF. Self-healing first: the success step closes that issue when the
      # smoke passes again. That is what makes the signal readable without opening anything —
      # an OPEN `live-red` issue means the live storefront is red RIGHT NOW, and no open issue
      # means it is not. A state you have to interpret is a state nobody checks.
      #
      # Tracked as issue #415. Its sibling fence is the pre-deploy geometry gate in ci.yml's
      # `nextjs` job, which stops the defect shipping; this one is what speaks when a live
      # check goes red anyway.
      # ------------------------------------------------------------------------------------
      - name: Raise the alarm (live smoke is red)
        # `failure()` would read THIS job's status, and this job runs no checks of its own.
        # The verdict lives in the three jobs it needs.
        if: ${{ contains(needs.*.result, 'failure') }}
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
            const trigger = context.eventName === 'schedule'
              ? 'the 07:00 UTC schedule (no commit behind it — this is live STATE, not code)'
              : `a ${context.eventName} event`

            const {data: open} = await github.rest.issues.listForRepo(
              {owner, repo, state: 'open', labels: 'live-red', per_page: 1})

            const line =
              `Live smoke failed again at ${new Date().toISOString()}, from ${trigger}.\n\n` +
              `Run: ${runUrl}`

            if (open.length > 0) {
              await github.rest.issues.createComment(
                {owner, repo, issue_number: open[0].number, body: line})
              core.notice(`live smoke red — commented on #${open[0].number}`)
              return
            }

            const body = [
              '**The live storefront smoke is failing.** This issue was opened by',
              '`.github/workflows/e2e-live-smoke.yml` and will CLOSE ITSELF as soon as the smoke',
              'passes again, so while it is open, https://mumchimp.com is failing its checks now.',
              '',
              line,
              '',
              'The Playwright report is on that run as the `playwright-report` artifact.',
              '',
              'Two things this does NOT mean. It is not necessarily a bad deploy: the daily',
              'schedule catches faults with no commit behind them, such as the 2 unbuyable packs',
              'found on 2026-07-31, which were live data and config. And it is not a mid-roll',
              'false positive: the job guard drops any run whose deploy did not succeed.',
            ].join('\n')

            const {data: made} = await github.rest.issues.create({
              owner, repo, labels: ['live-red'],
              title: 'Live storefront smoke is red',
              body,
            })
            core.notice(`live smoke red — opened #${made.number}`)

      - name: Stand the alarm down (live smoke is green again)
        # Only a clean sweep stands the alarm down. A cancelled run proves nothing, and
        # closing the issue on it would report the site green on no evidence.
        if: ${{ !contains(needs.*.result, 'failure')
                && !contains(needs.*.result, 'cancelled') }}
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
            const {data: open} = await github.rest.issues.listForRepo(
              {owner, repo, state: 'open', labels: 'live-red', per_page: 100})
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `Live smoke passed at ${new Date().toISOString()}. Closing.\n\nRun: ${runUrl}`,
              })
              await github.rest.issues.update(
                {owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'completed'})
              core.notice(`live smoke green — closed #${issue.number}`)
            }
