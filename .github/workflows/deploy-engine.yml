# Deploy the engine (and the ops console inside it) to Fly from GitHub.
#
# WHY THIS EXISTS. The engine moved to Fly on 2026-08-18, and from that moment the only way to
# ship a change to it was someone typing `fly deploy` on the founder's laptop. On the same day a
# fix to the ops console sat finished and unshipped for hours for exactly that reason: the person
# who wrote it could not run the command, so the console kept serving copy that said it was on a
# private network while it answered on the open internet. A deploy that depends on one human at
# one keyboard is not automation, and the founder had already said twice that it must be:
# "everything has to be automated", "this is why we need to get on the automated deployment".
#
# Setup, once, by the repo owner - CI cannot mint this for itself:
#
#   flyctl tokens create deploy -a prospector-engine
#   gh secret set FLY_API_TOKEN_ENGINE                 # paste the token above
#
# A separate secret per app, matching deploy-api.yml: a Fly deploy token is scoped to the app it
# was minted for, so reusing the web or API token here fails at push time. An org-scoped token in
# FLY_API_TOKEN works for all three; this workflow falls back to it.
#
# WHAT THIS DEPLOY DOES TO THE RUNNING SYSTEM. The engine is ONE machine with one volume and the
# strategy is `immediate`, so the scheduler, consumer, watchdog and console all restart. That is
# the intended behaviour and is why deploy/engine/fly.toml pins one machine: the store is
# single-writer SQLite plus an append-only ledger. A rolling deploy would mean two engines
# briefly sharing one Stripe account, which is worse than a restart.

name: Deploy Engine

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run the checks and stop before deploying"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "prospector/**"
      - "scripts/**"
      - "deploy/engine/**"
      - "store_platform/src/Ops.Console/**"
      - "requirements.txt"
      - "config.yaml"
      - ".github/workflows/deploy-engine.yml"

# Never cancel a half-finished production deploy to start another. Queue instead.
concurrency:
  group: deploy-engine
  cancel-in-progress: false

env:
  FLY_APP: prospector-engine
  CONSOLE_URL: https://prospector-engine.fly.dev

jobs:
  # The image build runs `next build`, so a broken console fails the deploy on its own. What it
  # does NOT run is the console's own test suite, and that suite is the thing that pins the
  # sign-in limiter and the fail-closed default on a box that now answers the open internet.
  test:
    runs-on: ${{ vars.CI_HEAVY_RUNS_ON || vars.CI_RUNS_ON || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: store_platform/src/Ops.Console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      # `npx tsc` in a tree with no node_modules silently installs a decoy package called `tsc`
      # and reports nothing, so the install above is load-bearing, not a convenience.
      - run: npx tsc --noEmit
      - run: npx vitest run

  deploy:
    needs: test
    if: ${{ !inputs.dry_run }}
    runs-on: ${{ vars.CI_HEAVY_RUNS_ON || vars.CI_RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_ENGINE || secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          : "${FLY_API_TOKEN:?set repo secret FLY_API_TOKEN_ENGINE (flyctl tokens create deploy -a ${FLY_APP})}"
          # The build CONTEXT is the repository root, not deploy/engine/. Every COPY in
          # deploy/engine/Dockerfile is written repo-root-relative, because that is the only way
          # one Dockerfile can pull in both the Python engine and the Next.js console. A narrower
          # context fails with `failed to calculate checksum ... "/requirements.txt": not found`,
          # which reads like a missing file rather than a wrong context. It cost one cutover
          # attempt at 02:27 on 2026-08-18.
          #
          # --config and --dockerfile are both explicit so a stale REMOTE config cannot decide
          # what gets built. --remote-only because the runner does not need a Docker daemon.
          # --build-arg GIT_SHA is what lets the running engine name its own commit.
          # `COPY . /app` does not carry `.git`, so nothing inside the image knows what it
          # was built from unless the build is told. The Dockerfile writes it to
          # /app/GIT_SHA, and `scripts/live_checkout.py` reads that file back out of the
          # machine. Drop this flag and the probe answers "deployed commit (unknown)"
          # forever, which is the exact blindness it was written to end.
          flyctl deploy . \
            --config deploy/engine/fly.toml \
            --dockerfile deploy/engine/Dockerfile \
            --app "$FLY_APP" \
            --build-arg "GIT_SHA=${{ github.sha }}" \
            --strategy immediate \
            --remote-only \
            --yes

      # `flyctl deploy` exiting 0 means the machine took the image, not that this commit's code is
      # answering. Three requests settle it, none of which needs the console password:
      #
      #   /login 200                    - the console booted and Next is serving
      #   /api/ops/read/status 401      - it fails CLOSED, which is the only security property
      #                                   that matters now the door is the open internet
      #   /api/ops/client-error 405     - the route EXISTS. It answers 404 on any image built
      #                                   before 2026-08-18, so 405-not-404 is a clean binary
      #                                   answer to "did THIS commit ship?"
      - name: Prove this commit is the one answering
        run: |
          set -euo pipefail
          base="${CONSOLE_URL}"

          login=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 --retry 10 --retry-delay 6 \
                    --retry-all-errors "$base/login")
          echo "GET $base/login -> $login"
          [ "$login" = "200" ] || { echo "console did not serve the sign-in page after deploy"; exit 1; }

          guard=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$base/api/ops/read/status")
          echo "GET $base/api/ops/read/status (no cookie) -> $guard"
          [ "$guard" = "401" ] || { echo "console did not refuse an unauthenticated read"; exit 1; }

          probe=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$base/api/ops/client-error")
          echo "GET $base/api/ops/client-error -> $probe"
          case "$probe" in
            405) echo "crash-reporting route is live; this commit is the one answering" ;;
            404) echo "route missing - the machine is serving an older image"; exit 1 ;;
            *)   echo "unexpected status from the crash-reporting route"; exit 1 ;;
          esac
