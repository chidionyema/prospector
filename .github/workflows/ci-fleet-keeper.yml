# Put stopped CI runner machines back, on a schedule, with no agent involved.
#
# WHERE IT RUNS, AND WHY THAT CHANGED. This used to say `runs-on: ubuntu-latest`, deliberately,
# arguing that a self-hosted runner cannot start a dead self-hosted fleet. That argument was
# sound and it is now moot: a GitHub-hosted job cannot start on this account at all, and the
# founder has ruled that it never will — "we are not paying for github". Measured on this
# workflow's first ever scheduled run (2026-08-20 08:57, d443f0ab): zero steps, the job log
# 404s, conclusion `failure`, and the only record anywhere is the annotation, verbatim:
#
#   "The job was not started because recent account payments have failed or your spending
#    limit needs to be increased. Please check the 'Billing & plans' section in your settings"
#
# So the real choice was never hosted-versus-fleet. It was fleet-versus-nothing, and hourly red
# on main for a reason no code change can clear. It runs on the fleet now.
#
# WHAT THAT COSTS, exactly. The keeper reads and writes Fly's REST API at
# https://api.machines.dev/v1 (scripts/ci_fleet_keeper.py:67) — it never inspects the box it is
# running on, so a runner started from a stale image still heals the fleet correctly. The one
# case it can no longer catch is a TOTAL outage, where no machine is left to pick the job up.
# That case is covered by hand and always was: the ops console button, or
# `.venv/bin/python scripts/ci_fleet_keeper.py --start` from any checkout with FLY_API_TOKEN.
# Partial outages — some machines stopped, others alive — are the common case and are exactly
# what this now fixes unattended.
#
# WHY HOURLY AND NOT EVERY FEW MINUTES. It is no longer a spend decision, because the fleet is
# already paid for and idle between jobs. Hourly is kept because a stopped machine costs
# nothing until it is needed, and a keeper that runs every few minutes races the deploy script:
# `deploy/runners.sh up` uses --strategy immediate, and a keeper restarting machines mid-deploy
# would fight it.
#
# A RED RUN HERE MEANS CI CAPACITY IS DEGRADED. It does not mean a test failed. That
# distinction is the reason the 2026-08-19 outage cost hours: a machine killed mid-job surfaces
# as `The self-hosted runner lost communication with the server`, which reads like a broken
# test and is not one.
name: ci-fleet-keeper

on:
  schedule:
    - cron: "17 * * * *"   # not on the hour: :00 is the busiest minute on GitHub's scheduler
  workflow_dispatch:

# Never two keepers at once, and never cancel one mid-start: a cancelled run can leave the
# fleet half-started and the report describing a state that no longer exists.
concurrency:
  group: ci-fleet-keeper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  keep:
    # The fleet, like every other workflow here. No `|| 'ubuntu-latest'` fallback on purpose:
    # that fallback is not an escape hatch on this account, it is an instant failure with no
    # steps and no log, which reads like nothing at all. A job that cannot start is still a
    # FAILURE on main, and main is never allowed to be red. If the CI_*_RUNS_ON variables are
    # ever unset this fails loudly on an unknown label instead of quietly on a dead runner.
    runs-on: ${{ vars.CI_LIGHT_RUNS_ON || vars.CI_RUNS_ON || 'fly' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Start any machine below the declared floor
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          # Absent today. Without it the machine half still works and the registration half
          # reports that it was not graded, rather than reporting a clean fleet it never read.
          # Issue #436 tracks getting one.
          RUNNER_ADMIN_PAT: ${{ secrets.RUNNER_ADMIN_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/ci_fleet_keeper.py --start
