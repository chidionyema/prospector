# TEMPORARY. Delete before this branch merges.
#
# Runs ci.yml's python job, step for step, on the Fly container instead of a Mac. It exists to
# answer one question: can the Linux image actually run this suite green? It is pinned to the
# `fly` label so it can never take a Mac slot, and it only triggers on this branch and by hand,
# so it cannot touch anyone else's pull request.
#
# The two env values differ from ci.yml on purpose. ci.yml reads the repo variables
# CI_UV_CACHE_DIR and CI_VENV_ROOT, and both are absolute macOS paths under
# /Users/chidionyema. A Linux container cannot create those, so the trial uses paths under
# the runner's own home. Making ci.yml portable is a separate change on this branch.
name: fly-trial

on:
  workflow_dispatch:
  push:
    branches: [feat/ci-runners-on-fly]

concurrency:
  group: fly-trial-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"

jobs:
  python-on-fly:
    runs-on: fly
    timeout-minutes: 40
    env:
      UV_CACHE_DIR: /home/runner/.cache/uv
      VENV_ROOT: /home/runner/ci-venvs
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: false

      - name: Python ${{ env.PYTHON_VERSION }} in a shared venv
        run: |
          set -euo pipefail
          ROOT="${VENV_ROOT:-$PWD/.ci-venvs}"
          mkdir -p "$ROOT"
          KEY="py${PYTHON_VERSION}-$(shasum -a 256 requirements.txt | cut -c1-16)"
          VENV="$ROOT/$KEY"
          if [ ! -x "$VENV/bin/python" ]; then
            TMP="$ROOT/.building-$KEY-$$"
            rm -rf "$TMP"
            uv venv --relocatable --python "${PYTHON_VERSION}" "$TMP"
            VIRTUAL_ENV="$TMP" uv pip install -r requirements.txt
            mv -n "$TMP" "$VENV" 2>/dev/null || true
            rm -rf "$TMP"
            echo "built $VENV"
          else
            echo "reused $VENV"
          fi
          "$VENV/bin/python" -c 'import pytest' || { echo "shared venv is incomplete"; exit 1; }
          echo "$VENV/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VENV" >> "$GITHUB_ENV"
          "$VENV/bin/python" --version

      - name: Test suite
        run: |
          set -eu
          files=$(git ls-files 'tests' \
                  | grep -E '(^|/)test_[^/]+\.py$' \
                  | grep -v -e 'tests/test_ui_theme\.py$' -e 'tests/test_golden_set\.py$')
          count=$(printf '%s\n' "$files" | grep -c . || true)
          echo "$count test files"
          if [ "$count" -eq 0 ]; then
            echo "::error::collected no test files — the pattern is wrong"; exit 1
          fi
          python -m pytest -q $files -n 6 --tb=short -p no:warnings

      - name: Golden-set regression gate
        run: python -m pytest tests/test_golden_set.py -v --tb=short
