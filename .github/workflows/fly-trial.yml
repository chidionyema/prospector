# TEMPORARY. Delete before this branch merges.
#
# Runs ci.yml's python job, step for step, on the Fly container instead of a Mac. It exists to
# answer one question: can the Linux image actually run this suite green? It is pinned to the
# `fly` label so it can never take a Mac slot, and it only triggers on this branch and by hand,
# so it cannot touch anyone else's pull request.
#
# The two env values differ from ci.yml on purpose. ci.yml reads the repo variables
# CI_UV_CACHE_DIR and CI_VENV_ROOT, and both are absolute macOS paths under
# /Users/chidionyema. A Linux container cannot create those, so the trial uses paths under
# the runner's own home. Making ci.yml portable is a separate change on this branch.
name: fly-trial
'on':
  workflow_dispatch: null
  push:
    branches:
    - feat/ci-runners-on-fly
concurrency:
  group: fly-trial-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHON_VERSION: '3.14'
jobs:
  python-on-fly:
    runs-on: fly
    timeout-minutes: 40
    env:
      UV_CACHE_DIR: /home/runner/.cache/uv
      VENV_ROOT: /home/runner/ci-venvs
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: false
    - name: Python ${{ env.PYTHON_VERSION }} in a shared venv
      run: "set -euo pipefail\nROOT=\"${VENV_ROOT:-$PWD/.ci-venvs}\"\nmkdir -p \"$ROOT\"\nKEY=\"py${PYTHON_VERSION}-$(shasum\
        \ -a 256 requirements.txt | cut -c1-16)\"\nVENV=\"$ROOT/$KEY\"\nif [ ! -x \"$VENV/bin/python\"\
        \ ]; then\n  TMP=\"$ROOT/.building-$KEY-$$\"\n  rm -rf \"$TMP\"\n  uv venv --relocatable --python\
        \ \"${PYTHON_VERSION}\" \"$TMP\"\n  VIRTUAL_ENV=\"$TMP\" uv pip install -r requirements.txt\n\
        \  mv -n \"$TMP\" \"$VENV\" 2>/dev/null || true\n  rm -rf \"$TMP\"\n  echo \"built $VENV\"\nelse\n\
        \  echo \"reused $VENV\"\nfi\n\"$VENV/bin/python\" -c 'import pytest' || { echo \"shared venv\
        \ is incomplete\"; exit 1; }\necho \"$VENV/bin\" >> \"$GITHUB_PATH\"\necho \"VIRTUAL_ENV=$VENV\"\
        \ >> \"$GITHUB_ENV\"\n\"$VENV/bin/python\" --version\n"
    - name: Test suite
      run: "set -eu\nfiles=$(git ls-files 'tests' \\\n        | grep -E '(^|/)test_[^/]+\\.py$' \\\n \
        \       | grep -v -e 'tests/test_ui_theme\\.py$' -e 'tests/test_golden_set\\.py$')\ncount=$(printf\
        \ '%s\\n' \"$files\" | grep -c . || true)\necho \"$count test files\"\nif [ \"$count\" -eq 0 ];\
        \ then\n  echo \"::error::collected no test files \u2014 the pattern is wrong\"; exit 1\nfi\n\
        python -m pytest -q $files -n 6 --tb=short -p no:warnings\n"
    - name: Golden-set regression gate
      run: python -m pytest tests/test_golden_set.py -v --tb=short
  nextjs-on-fly:
    runs-on: fly
    timeout-minutes: 40
    defaults:
      run:
        working-directory: store_platform/src/Store.Web/
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: ${{ runner.environment == 'self-hosted' && '' || 'npm' }}
        cache-dependency-path: store_platform/src/Store.Web/package-lock.json
    - name: Cache Next.js build
      uses: actions/cache@v4
      with:
        path: store_platform/src/Store.Web/.next/cache
        key: next-${{ runner.os }}-${{ hashFiles('store_platform/src/Store.Web/package-lock.json') }}-${{
          github.sha }}
        restore-keys: 'next-${{ runner.os }}-${{ hashFiles(''store_platform/src/Store.Web/package-lock.json'')
          }}-

          next-${{ runner.os }}-

          '
    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit --no-fund
    - name: Typecheck
      run: npm run typecheck
    - name: Unit tests (vitest)
      run: npm test
    - name: Build
      run: npm run build
      env:
        NEXT_PUBLIC_API_URL: https://api.example.com
        NEXT_PUBLIC_SITE_URL: https://www.example.com
  ops-console-on-fly:
    runs-on: fly
    timeout-minutes: 40
    defaults:
      run:
        working-directory: store_platform/src/Ops.Console/
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: ${{ runner.environment == 'self-hosted' && '' || 'npm' }}
        cache-dependency-path: store_platform/src/Ops.Console/package-lock.json
    - name: Cache Next.js build
      uses: actions/cache@v4
      with:
        path: store_platform/src/Ops.Console/.next/cache
        key: ops-next-${{ runner.os }}-${{ hashFiles('store_platform/src/Ops.Console/package-lock.json')
          }}-${{ github.sha }}
        restore-keys: 'ops-next-${{ runner.os }}-${{ hashFiles(''store_platform/src/Ops.Console/package-lock.json'')
          }}-

          ops-next-${{ runner.os }}-

          '
    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit --no-fund
    - name: Typecheck
      run: npm run typecheck
    - name: Lint
      run: npm run lint
    - name: Unit tests (vitest)
      run: npm test
    - name: Build
      run: npm run build
  dotnet-on-fly:
    runs-on: fly
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Set up .NET ${{ env.DOTNET_VERSION }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    - name: Cache NuGet packages
      if: runner.environment != 'self-hosted'
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
        restore-keys: 'nuget-${{ runner.os }}-

          '
    - name: Restore dependencies
      run: dotnet restore store_platform/src/Store.Tests/Store.Tests.csproj
    - name: Build
      run: dotnet build store_platform/src/Store.Tests/Store.Tests.csproj --no-restore -m:1
    - name: Test
      run: dotnet test store_platform/src/Store.Tests/Store.Tests.csproj --no-build --verbosity normal
        -m:1
  engine-on-fly:
    runs-on: fly
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: false
    - name: Python ${{ env.PYTHON_VERSION }} in a shared venv
      run: "set -euo pipefail\nROOT=\"${VENV_ROOT:-$PWD/.ci-venvs}\"\nmkdir -p \"$ROOT\"\nKEY=\"py${PYTHON_VERSION}-$(shasum\
        \ -a 256 requirements.txt | cut -c1-16)\"\nVENV=\"$ROOT/$KEY\"\nif [ ! -x \"$VENV/bin/python\"\
        \ ]; then\n  TMP=\"$ROOT/.building-$KEY-$$\"\n  rm -rf \"$TMP\"\n  uv venv --relocatable --python\
        \ \"${PYTHON_VERSION}\" \"$TMP\"\n  VIRTUAL_ENV=\"$TMP\" uv pip install -r requirements.txt\n\
        \  mv -n \"$TMP\" \"$VENV\" 2>/dev/null || true\n  rm -rf \"$TMP\"\n  echo \"built $VENV\"\nelse\n\
        \  echo \"reused $VENV\"\nfi\n# Fail loudly rather than run the suite against a half-built tree.\n\
        \"$VENV/bin/python\" -c 'import pytest' || { echo \"shared venv is incomplete\"; exit 1; }\necho\
        \ \"$VENV/bin\" >> \"$GITHUB_PATH\"\necho \"VIRTUAL_ENV=$VENV\" >> \"$GITHUB_ENV\"\n\"$VENV/bin/python\"\
        \ --version\n"
    - name: Engine verification (import + lint + generation budget)
      run: ./scripts/verify_engine_change.sh --no-tick
    - name: The lane map still guards the engine
      run: python -m pytest tests/unit/test_popdd_gate_lanes.py -q --tb=short -p no:warnings
    env:
      UV_CACHE_DIR: /home/runner/.cache/uv
      VENV_ROOT: /home/runner/ci-venvs
