# Size the Fly CI runner pool to the queue, one event at a time.
#
# WHY THIS EXISTS. The pool was a constant. Measured 2026-08-19 10:50Z: 13 runs queued against
# three machines, and those three bill CPU and RAM around the clock whether or not anything is
# building -- about $145/month for capacity that is idle most of the day. A stopped Fly machine
# bills neither, so the pool can be both bigger when it matters and cheaper the rest of the time.
#
# WHY `ubuntu-latest` AND NOT A SELF-HOSTED RUNNER. This job starts the runners. Running it on
# one of them deadlocks the moment the pool is scaled to zero: the scaler waits for a runner and
# the runner waits for the scaler. GitHub-hosted minutes are the price of not having that
# failure mode, and the job is a few seconds long.
name: CI autoscale

# THIS WORKFLOW HAS NEVER RUN, AND NOTHING SAID SO. `on: workflow_job:` was here from the
# first commit. `workflow_job` is a webhook event, not a workflow trigger. GitHub created a run
# for every one of them and concluded it `failure` with ZERO jobs -- no log, no annotation, no
# red check on any pull request. Measured 2026-08-19: the last 30 runs of this workflow, 30
# failures, `total_count: 0` jobs on each. The pool it claims to size was sized by hand the
# whole time. `actionlint` now runs in CI's `guard` job so no workflow can ship unstartable
# again.
#
# AND IT STAYS MANUAL FOR NOW, ON PURPOSE. Fixing the trigger alone would make this WORSE than
# doing nothing. `deploy/runners.sh autoscale` protects an in-flight build by asking GitHub
# which runners are busy (`GET /repos/{o}/{r}/actions/runners`), and that endpoint needs repo
# ADMIN. `secrets.GITHUB_TOKEN` cannot have it at any `permissions:` setting, and this repo has
# no admin PAT secret (`gh secret list` 2026-08-19: FLY_API_TOKEN, FLY_API_TOKEN_API,
# FLY_API_TOKEN_ENGINE, and nothing else). With the busy list empty every started machine reads
# as idle, so the scale-down loop stops machines mid-build. That is not theory: machine
# floral-butterfly-8382 was stopped at 14:50:51Z with 15 minutes of PR #425's python job still
# to run, and the job died 26m8s in with steps 6-18 concluding `null`.
#
# So the trigger is `workflow_dispatch` -- valid, startable, and it fires only when a person
# asks. Automatic scaling turns back on when TWO things are true: PR #423 lands the scale-down
# safety in `deploy/runners.sh`, and a repo-admin PAT exists as a secret. Adding that PAT is a
# founder decision, tracked as an issue, not something a session should mint.
on:
  workflow_dispatch:

# The newest reading of the queue is the only one worth acting on, so a superseded scaler run is
# cancelled rather than queued behind. Scaling is idempotent, so losing an intermediate run
# cannot leave the pool in a wrong state.
concurrency:
  group: ci-autoscale
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Match started machines to the queue
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_ENGINE }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # `superfly/flyctl-actions/setup-flyctl` installs `flyctl` only, and the adapter calls
          # `fly`. Same shim as deploy/targets/fly.sh, same reason.
          if ! command -v fly >/dev/null 2>&1 && command -v flyctl >/dev/null 2>&1; then
            fly() { command flyctl "$@"; }
            export -f fly
          fi
          bash deploy/runners.sh autoscale
