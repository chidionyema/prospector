# Size the Fly CI runner pool to the queue, one event at a time.
#
# WHY THIS EXISTS. The pool was a constant. Measured 2026-08-19 10:50Z: 13 runs queued against
# three machines, and those three bill CPU and RAM around the clock whether or not anything is
# building -- about $145/month for capacity that is idle most of the day. A stopped Fly machine
# bills neither, so the pool can be both bigger when it matters and cheaper the rest of the time.
#
# WHY `workflow_run` AND NOT `workflow_job`. This workflow first shipped with `on: workflow_job`.
# There is no such trigger. `workflow_job` is a webhook event GitHub sends to apps; the list a
# workflow may subscribe to does not contain it. GitHub rejected the file at parse time, so every
# push created a run that failed before a single job existed. Measured 2026-08-19 on all five
# runs since the feature shipped:
#
#   gh api repos/chidionyema/prospector/actions/runs/32257716670/jobs --jq .total_count  ->  0
#   gh api repos/chidionyema/prospector/actions/workflows --jq '...name'  ->  the FILE PATH,
#   because GitHub falls back to the path when it cannot parse the file for a name.
#
# Five runs, five failures, zero jobs, and the pool never scaled once. Meanwhile 5 runs queued
# against 4 started machines while 8 paid-for machines sat stopped. Nothing noticed, because a
# failing workflow that starts no job writes no log to read.
# `scripts/ci_fleet_probe.py` is what notices now, and
# `tests/unit/test_workflow_triggers_are_real.py` is what stops the next invented trigger.
#
# `workflow_run` is the real trigger with the shape this needs: `requested` fires when a run is
# created, which is the moment its jobs start queueing, and `completed` fires when they stop.
# The scaler itself is a reconciler -- `deploy/runners.sh autoscale` reads the LIVE queue depth
# and the LIVE machine list rather than anything in the event -- so the event only has to wake
# it up, and a missed one costs nothing beyond a later reading.
#
# EVERY workflow in this repository is listed except this one. All of them run on the self-hosted
# pool (`vars.CI_HEAVY_RUNS_ON` / `vars.CI_LIGHT_RUNS_ON`), so all of them queue against it. This
# one is excluded because reacting to itself is a loop that never ends.
#
# WHY `ubuntu-latest` AND NOT A SELF-HOSTED RUNNER. This job starts the runners. Running it on
# one of them deadlocks the moment the pool is scaled to zero: the scaler waits for a runner and
# the runner waits for the scaler. GitHub-hosted minutes are the price of not having that
# failure mode, and the job is a few seconds long.
name: CI autoscale

on:
  workflow_run:
    workflows:
      - CI
      - Auto-merge green PRs
      - Cancel CI when a PR closes
      - Deploy Store.Api
      - Deploy Engine
      - Deploy Store.Web
      - Live storefront smoke
      - Escape hatch drill
      - weekly estate review
    types: [requested, completed]
  workflow_dispatch:

# The newest reading of the queue is the only one worth acting on, so a superseded scaler run is
# cancelled rather than queued behind. Scaling is idempotent, so losing an intermediate run
# cannot leave the pool in a wrong state. It also caps the hosted minutes this costs: a burst of
# ten queued jobs collapses to one scaler run, not ten.
concurrency:
  group: ci-autoscale
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Match started machines to the queue
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_ENGINE }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # `superfly/flyctl-actions/setup-flyctl` installs `flyctl` only, and the adapter calls
          # `fly`. Same shim as deploy/targets/fly.sh, same reason.
          if ! command -v fly >/dev/null 2>&1 && command -v flyctl >/dev/null 2>&1; then
            fly() { command flyctl "$@"; }
            export -f fly
          fi
          bash deploy/runners.sh autoscale
