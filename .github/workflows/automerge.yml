# Merge a pull request as soon as its CI run goes green, then start what the merge should
# have started.
#
# WHY THIS EXISTS. Founder, 2026-08-18: "we need auto merge if checks pass". Until now every
# merge needed a person to watch a queue and type `gh pr merge`, so finished green PRs sat open
# for hours.
#
# WHY NOT GITHUB'S OWN AUTO-MERGE. `gh pr merge --auto` refuses here with "Protected branch
# rules not configured for this branch". Native auto-merge only arms when something is BLOCKING
# the merge, and the only things that can block are required checks or required reviews, both of
# which come from branch protection. This account cannot create branch protection: both
# /branches/main/protection and /rulesets answer 403 "Upgrade to GitHub Pro or make this
# repository public" (measured 2026-08-17 and again 2026-08-18). The repository switch is
# already on (allow_auto_merge: true); it is the rules that cannot exist. So the wait-for-green
# lives here instead.
#
# WHY OCTOKIT AND NOT THE gh CLI. The first version of this file shelled out to `gh`. Our
# self-hosted runners do not have it: run 32176571212 printed `gh: command not found`, and
# because that first call ended in `|| true` the job swallowed it, reported "nothing to merge"
# and finished GREEN having merged nothing. A workflow that silently does nothing is worse than
# one that fails. actions/github-script runs on the node the runner already ships for JS
# actions, so it needs no CLI, no jq, and no PATH assumptions -- and an API error throws and
# fails the job where it can be seen.
#
# WHY THE MERGE ALONE IS NOT ENOUGH. A push made with the default GITHUB_TOKEN does not start
# new workflow runs. So the merge commit this workflow creates would run no CI on main -- main's
# green record would simply stop -- and would not run deploy-engine.yml, so production would
# quietly stop receiving merged code. GitHub documents exactly two exceptions:
# `workflow_dispatch` and `repository_dispatch` DO create a run when triggered with
# GITHUB_TOKEN. So after a merge lands this workflow dispatches main's CI, and dispatches the
# engine deploy when the merged files are ones deploy-engine.yml itself watches.
#
# WHY A GREEN PR IS NOT ENOUGH ON ITS OWN. A PR run proves the PR's own merge ref, which is the
# base main had WHEN THE RUN STARTED. Two branches can each be green against an older main and
# still break main when both land: nothing ever ran their combination. Measured 2026-08-19: main
# went red on three tests, each introduced by a separate PR (#372, #373, #377) that was green on
# its own base, and every open PR then inherited those three failures. Seventeen pull requests
# read as broken because of a merge order nobody checked. So this workflow now refuses to merge a
# PR that sits behind main. It updates the branch instead and dispatches CI on it, and the run
# that comes back tests the actual combination. That dispatch is why the job also accepts
# `workflow_dispatch` runs below: a run this workflow started must be able to finish the merge,
# and a GITHUB_TOKEN push starts nothing by itself.
name: Auto-merge green PRs

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write # to dispatch main's CI and the engine deploy after the merge
  # An explicit permissions block sets every scope it does NOT list to `none`. The stranded-PR
  # sweep reads GET /commits/<sha>/check-runs, which needs this one, and without it that call
  # returned 403 "Resource not accessible by integration" -- measured 2026-08-19T20:53:41Z,
  # after the merge of #451 had already landed.
  checks: read
  # `issues.addLabels` is how a stuck PR gets the `needs-rebase` label -- the only place the
  # problem is visible where a person looks. Both calls sit inside a try, so a missing scope
  # does not fail the job: it warns, and the label silently never appears. That is worse than
  # a crash, because the workflow keeps reporting success while its visibility mechanism is off.
  issues: write

# One merge at a time. Two merges racing onto main is how a green PR lands on top of a commit
# its own CI run never saw.
concurrency:
  group: automerge
  cancel-in-progress: false

jobs:
  merge:
    # A FAILED RUN MUST REACH THIS JOB TOO, AND ONLY FOR THE UPDATE PATH. Until 2026-08-19 this
    # read `conclusion == 'success'`, which made the rescue unreachable for exactly the pull
    # requests that needed it. A PR behind main inherits main's failures, so its run concludes
    # FAILURE, so this job never ran, so the branch was never updated, so it stayed red. Thirteen
    # open PRs sat in that loop on 2026-08-19 while main was red on a single test none of them
    # wrote. The merge is still gated on green below, on `proved`, and nothing red can land.
    if: >-
      (github.event.workflow_run.conclusion == 'success' ||
       github.event.workflow_run.conclusion == 'failure') &&
      (github.event.workflow_run.event == 'pull_request' ||
       (github.event.workflow_run.event == 'workflow_dispatch' &&
        github.event.workflow_run.triggering_actor.login == 'github-actions[bot]'))
    runs-on: ${{ vars.CI_LIGHT_RUNS_ON || vars.CI_RUNS_ON || 'ubuntu-latest' }}
    steps:
      - name: Merge every open PR this run proved green
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {owner, repo} = context.repo
            const sha = context.payload.workflow_run.head_sha
            // The ONLY thing that may authorise a merge. A failed run still gets to update a
            // branch that sits behind main, because that update IS the repair. It never gets to
            // land code.
            const proved = context.payload.workflow_run.conclusion === 'success'

            // The same paths each deploy workflow watches on push. Kept in step with those files:
            // add a path there and not here and a merge that should deploy will not.
            //
            // ALL THREE DEPLOYS BELONG HERE, NOT JUST THE ENGINE. Until 2026-08-19 only the engine
            // was dispatched, so every web and API change this workflow merged reached main and
            // stopped there. Measured that morning: PR #363 merged at 06:58 touching
            // store_platform/src/Store.Web/**, and no deploy-web run existed for it. deploy-web had
            // last run on a push at 2026-08-18T13:33. The storefront in production was a day behind
            // main and nothing said so, because the merge was green and CI on main was green.
            const DEPLOY = {
              'deploy-engine.yml': /^(prospector\/|scripts\/|deploy\/engine\/|store_platform\/src\/Ops\.Console\/|requirements\.txt$|config\.yaml$|\.github\/workflows\/deploy-engine\.yml$)/,
              'deploy-web.yml': /^(store_platform\/src\/Store\.Web\/|store_platform\/deploy\/fly\/web\.fly\.toml$|store_platform\/scripts\/deploy_web\.sh$|store_platform\/scripts\/predeploy_guard\.sh$|\.github\/workflows\/deploy-web\.yml$)/,
              'deploy-api.yml': /^(store_platform\/src\/Store\.Api\/|store_platform\/src\/Store\.Catalog\/|store_platform\/deploy\/fly\/api\.fly\.toml$|\.github\/workflows\/deploy-api\.yml$)/,
            }
            const HOLD = new Set(['hold', 'do-not-merge', 'wip'])

            // The PRs whose HEAD is the exact commit CI just passed. Matching on the sha, not
            // on a PR number carried through the event, is what keeps this honest: a PR pushed
            // to since the run started no longer matches, so a green verdict can never merge
            // code that verdict did not cover.
            const {data: found} =
              await github.rest.repos.listPullRequestsAssociatedWithCommit(
                {owner, repo, commit_sha: sha})
            const prs = found.filter(p => p.state === 'open')
            if (prs.length === 0) {
              core.info(`no open PR has ${sha} at its head - nothing to merge`)
              return
            }

            let merged = false
            const stuck = []
            const toDeploy = new Set()
            for (const pr of prs) {
              const labels = pr.labels.map(l => l.name)
              core.info(`PR #${pr.number}: draft=${pr.draft} base=${pr.base.ref} ` +
                        `labels=${labels.join(',') || 'none'}`)
              if (pr.draft)                        { core.info('  skipping: still a draft'); continue }
              if (pr.base.ref !== 'main')          { core.info(`  skipping: targets ${pr.base.ref}`); continue }
              if (labels.some(n => HOLD.has(n)))   { core.info('  skipping: held by a label'); continue }

              // BEHIND MAIN IS A REFUSAL, NOT A DETAIL. `pulls.merge` happily lands a stale
              // branch: its `sha` guard only checks the head did not MOVE, never that the base
              // did. compareCommits is the explicit question -- how many commits does main have
              // that this head does not -- rather than `mergeable_state`, which GitHub computes
              // lazily and reports `unknown` on a first read.
              const {data: cmp} = await github.rest.repos.compareCommits(
                {owner, repo, base: 'main', head: pr.head.sha})
              if (cmp.behind_by > 0) {
                // NOTHING HERE PUSHES TO SOMEBODY ELSE'S BRANCH ANY MORE.
                //
                // This called pulls.updateBranch, which pushes `Merge branch 'main' into
                // <branch>` onto every open pull request whenever main moves. That rewrites the
                // head of a pull request nobody touched. A moved head is no longer inside
                // whatever branch was cut to close it, so the pull request stays open after its
                // own content has merged -- and a batch cut to clear a backlog sets this off
                // with its own merge, so the batch can never finish the job it was cut for.
                //
                // Measured 2026-08-20. #480 merged to main at 0fa8f9a6. Four minutes later:
                //   26d5a7ec  github-actions[bot]  03:38:04  Merge branch 'main' into feat/deploy-every-service-from-the-console  (#477)
                //   f53bf864  github-actions[bot]  03:38:08  Merge branch 'main' into integrate/2026-08-20-eleven                 (#510)
                // Both dropped out of the branch that contained them. No person touched either.
                //
                // Founder rule, 2026-08-20: a branch merges main into ITSELF before its pull
                // request is raised. That is the author's job. This workflow only merges.
                core.info(`  behind main by ${cmp.behind_by} - the author updates it, not us`)
                stuck.push(`#${pr.number} (${cmp.behind_by} behind main - merge main into it and push)`)
                continue
              }

              // Up to date with main and still red. The update path above could not help it, and
              // green is the only thing that may merge, so this is where a red PR stops. Said out
              // loud, because a job that returns silently is how a stuck PR becomes invisible.
              if (!proved) {
                core.info(`  up to date with main and its CI run failed - not merging #${pr.number}`)
                continue
              }

              const files = await github.paginate(github.rest.pulls.listFiles,
                                                  {owner, repo, pull_number: pr.number, per_page: 100})
              try {
                // `sha` here is GitHub's own head assertion, checked at the moment of the
                // merge: if someone pushed after CI ran, this fails instead of landing a
                // commit CI never saw.
                await github.rest.pulls.merge(
                  {owner, repo, pull_number: pr.number, merge_method: 'squash', sha})
                core.info(`  merged #${pr.number}`)
                merged = true
                for (const [wf, re] of Object.entries(DEPLOY)) {
                  if (files.some(f => re.test(f.filename))) toDeploy.add(wf)
                }
                try {
                  await github.rest.git.deleteRef(
                    {owner, repo, ref: `heads/${pr.head.ref}`})
                } catch (e) {
                  core.warning(`branch ${pr.head.ref} not deleted: ${e.message}`)
                }
              } catch (e) {
                // A GREEN PULL REQUEST THAT DID NOT MERGE IS THE FAILURE THIS JOB EXISTS TO
                // PREVENT. Until 2026-08-19 this was a core.warning, so the job finished GREEN
                // having merged nothing -- the same defect the header describes for `gh:
                // command not found`, in the one branch nobody had revisited. Measured that
                // morning: PR #374 passed every check and sat open for hours with
                // mergeStateStatus DIRTY. Auto-merge could never fire, and the only thing that
                // noticed was a person reading the field by hand.
                //
                // Two refusals, and only one of them self-corrects. 409 means the head moved
                // after CI ran: the next green run merges it, so that stays a warning. Anything
                // else -- 405 "Pull Request is not mergeable" is the conflict case -- needs a
                // person to rebase, and nothing else in the estate is watching for it.
                if (e.status === 409) {
                  core.warning(`#${pr.number} moved after CI ran; the next green run merges it`)
                  continue
                }
                core.error(`could not merge #${pr.number}: ${e.message}`)
                stuck.push(`#${pr.number} (${e.message})`)
                // The label is what makes it visible where a person actually looks: it shows in
                // `gh pr list` and on the PR itself, and setting it twice is a no-op, so a PR
                // pushed to repeatedly does not collect a pile of comments. It is deliberately
                // NOT in HOLD above -- it must not stop the merge once the rebase lands.
                try {
                  await github.rest.issues.addLabels(
                    {owner, repo, issue_number: pr.number, labels: ['needs-rebase']})
                } catch (le) {
                  core.warning(`could not label #${pr.number}: ${le.message}`)
                }
              }
            }

            // Before the `!merged` return, or a run where NOTHING merged would report the
            // failure to nobody -- which is the exact shape of the bug being fixed.
            if (stuck.length) {
              core.setFailed(
                `green pull request(s) CI proved but could not be merged: ${stuck.join('; ')}. ` +
                `Rebase them on main; a green PR that cannot land is invisible work.`)
            }

            if (!merged) return

            // THE SWEEP IS GONE, BECAUSE ITS ONLY ACTION WAS THE PUSH REMOVED ABOVE.
            //
            // It looked for pull requests that were green but had fallen behind main, and
            // called pulls.updateBranch on up to SWEEP_MAX of them. Same defect as the
            // behind-main path above, aimed at three more branches per merge.
            //
            // It also merged work that no CI run had proved green AT ITS HEAD. That is how
            // #500 landed unproven on 2026-08-20 and was reverted by main-admission-guard
            // twelve minutes later, deleting merged work.
            //
            // A pull request that falls behind main is now its author's to update, which is
            // the founder's rule of 2026-08-20: merge main into your branch before raising the
            // pull request.

            // Start what the merge push could not (see the header). workflow_dispatch is the
            // documented exception that works with GITHUB_TOKEN.
            core.info('dispatching CI on main')
            await github.rest.actions.createWorkflowDispatch(
              {owner, repo, workflow_id: 'ci.yml', ref: 'main'})
            if (toDeploy.size === 0) {
              core.info('merged files touch nothing any deploy workflow watches — no deploy')
              return
            }
            // deploy-web.yml takes a target as well as dry_run. Its own default is prod, but a
            // dispatch that omits an input gets the workflow default, and relying on a default in
            // another file is how a production deploy quietly becomes a test one. Pass it.
            const INPUTS = {
              'deploy-engine.yml': {dry_run: 'false'},
              'deploy-web.yml': {target: 'prod', dry_run: 'false'},
              'deploy-api.yml': {dry_run: 'false'},
            }
            for (const wf of toDeploy) {
              core.info(`merged files touch what ${wf} watches — dispatching it`)
              await github.rest.actions.createWorkflowDispatch(
                {owner, repo, workflow_id: wf, ref: 'main', inputs: INPUTS[wf]})
            }
