# Merge a pull request as soon as its CI run goes green, then start what the merge should
# have started.
#
# WHY THIS EXISTS. Founder, 2026-08-18: "we need auto merge if checks pass". Until now every
# merge needed a person to watch a queue and type `gh pr merge`, so finished green PRs sat open
# for hours.
#
# WHY NOT GITHUB'S OWN AUTO-MERGE. `gh pr merge --auto` refuses here with "Protected branch
# rules not configured for this branch". Native auto-merge only arms when something is BLOCKING
# the merge, and the only things that can block are required checks or required reviews, both of
# which come from branch protection. This account cannot create branch protection: both
# /branches/main/protection and /rulesets answer 403 "Upgrade to GitHub Pro or make this
# repository public" (measured 2026-08-17 and again 2026-08-18). The repository switch is
# already on (allow_auto_merge: true); it is the rules that cannot exist. So the wait-for-green
# lives here instead.
#
# WHY THE MERGE ALONE IS NOT ENOUGH. A push made with the default GITHUB_TOKEN does not start
# new workflow runs. So the merge commit this workflow creates would run no CI on main -- main's
# green record would simply stop -- and would not run deploy-engine.yml, so production would
# quietly stop receiving merged code.
#
# The fix needs no secret and no personal token. GitHub documents exactly two exceptions to that
# rule: `workflow_dispatch` and `repository_dispatch` DO create a run when triggered with
# GITHUB_TOKEN ("Triggering a workflow from a workflow", Actions docs). So after a merge lands,
# this workflow dispatches main's CI, and dispatches the engine deploy when the merged files are
# ones deploy-engine.yml itself watches. Same two runs a human merge would have produced.
name: Auto-merge green PRs

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write # to dispatch main's CI and the engine deploy after the merge

# One merge at a time. Two merges racing onto main is how a green PR lands on top of a commit
# its own CI run never saw.
concurrency:
  group: automerge
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ${{ vars.CI_LIGHT_RUNS_ON || vars.CI_RUNS_ON || 'ubuntu-latest' }}
    steps:
      - name: Merge every open PR this run proved green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Find the PRs whose head is the exact commit CI just passed. Matching on the sha, not
          # on a PR number carried through the event, is what keeps this honest: a PR that has
          # been pushed to since the run started no longer matches, so a green verdict can never
          # merge code that verdict did not cover.
          prs=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" \
                  --jq '.[] | select(.state == "open") | .number' || true)
          if [ -z "$prs" ]; then
            echo "no open PR has $HEAD_SHA at its head - nothing to merge"
            exit 0
          fi

          merged=0
          deploy=0

          for pr in $prs; do
            info=$(gh pr view "$pr" --repo "$REPO" --json isDraft,baseRefName,labels)
            draft=$(echo "$info" | jq -r '.isDraft')
            base=$(echo "$info" | jq -r '.baseRefName')
            labels=$(echo "$info" | jq -r '[.labels[].name] | join(",")')
            echo "PR #$pr: draft=$draft base=$base labels=${labels:-none}"

            if [ "$draft" = "true" ]; then
              echo "  skipping: still a draft"
              continue
            fi
            if [ "$base" != "main" ]; then
              echo "  skipping: targets $base, not main"
              continue
            fi
            case ",${labels}," in
              *,hold,*|*,do-not-merge,*|*,wip,*)
                echo "  skipping: held by a label"
                continue
                ;;
            esac

            # Read the file list BEFORE merging: once the branch is deleted the PR still
            # answers, but this ordering keeps the deploy decision independent of that.
            files=$(gh api "repos/$REPO/pulls/$pr/files" --paginate --jq '.[].filename' || true)

            # The head sha is asserted a second time, by GitHub, at the moment of the merge.
            # Between the checks above and this line someone can push; --match-head-commit makes
            # the merge fail rather than land a commit CI never ran on.
            if gh pr merge "$pr" --repo "$REPO" --squash --delete-branch \
                 --match-head-commit "$HEAD_SHA"; then
              echo "  merged #$pr"
              merged=1
              # The same paths deploy-engine.yml watches on push. Kept in step with that file:
              # if a path is added there and not here, a merge that should deploy will not.
              if printf '%s\n' "$files" | grep -qE '^(prospector/|scripts/|deploy/engine/|store_platform/src/Ops\.Console/|requirements\.txt$|config\.yaml$|\.github/workflows/deploy-engine\.yml$)'; then
                deploy=1
              fi
            else
              echo "::warning::could not merge #$pr (conflict, or it moved). Left open."
            fi
          done

          [ "$merged" = "1" ] || exit 0

          # Start what the merge push could not (see the header). workflow_dispatch is the
          # documented exception that works with GITHUB_TOKEN.
          echo "dispatching CI on main"
          gh workflow run ci.yml --repo "$REPO" --ref main \
            || echo "::warning::could not dispatch CI on main"

          if [ "$deploy" = "1" ]; then
            echo "merged files touch the engine — dispatching the engine deploy"
            gh workflow run deploy-engine.yml --repo "$REPO" --ref main -f dry_run=false \
              || echo "::warning::could not dispatch deploy-engine"
          else
            echo "merged files touch nothing deploy-engine.yml watches — no deploy"
          fi
