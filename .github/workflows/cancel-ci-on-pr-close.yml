name: Cancel CI when a PR closes

# THE ROOT CAUSE THIS FIXES.
#
# GitHub does not cancel a pull request's CI when the pull request merges or closes. The run
# stays queued, forever, waiting for a runner to test a commit nobody is waiting on. With four
# self-hosted runner instances sharing one machine and jobs that take twenty minutes, every
# merged PR leaves a ghost holding a slot.
#
# Measured 2026-08-17: 12 runs queued, 9 of them belonging to PRs that had already merged. Two
# had been queued for 264 hours. The live PRs sat behind all of it, so `main` stayed red for
# want of a runner rather than for want of a fix. Cancelling them by hand is cleanup; it does
# not stop the next merge from doing the same thing.
#
# `ci.yml`'s concurrency block cannot help here. It groups on `github.ref`, so it only ever
# supersedes a run with a NEWER run on the same branch. A merged PR produces no newer run --
# there is nothing to supersede it with, so it is never collected.
#
# WHY IT STOPPED USING THE gh CLI (2026-08-18). It never cancelled a single run. Our
# self-hosted runners do not have the GitHub CLI installed, so every invocation printed
# `gh: command not found` -- twice, once per status -- and the `|| true` on the list call turned
# that into an empty id list. The loop then had nothing to iterate, the job exited 0, and the
# check went green. Proof: run 32169451195, `line 6: gh: command not found`. The ghost runs this
# workflow exists to collect were still being collected by hand.
#
# actions/github-script talks to the API through octokit on the node the runner already ships
# for JavaScript actions. No CLI, no jq, no PATH assumptions -- and an API error throws and
# fails the job instead of being hidden.

on:
  pull_request:
    types: [closed]

permissions:
  actions: write          # the whole point: cancel runs
  contents: read
  pull-requests: write    # to say on the pull request WHY it cancelled, and what it kept

jobs:
  cancel:
    # Runs wherever the rest of CI runs. It was pinned to `ubuntu-latest` on the argument that a
    # job which FREES self-hosted runners should not queue behind the backlog it clears. That
    # argument assumed hosted runners were available. They are not — this account cannot start
    # them, so every invocation failed instead of cancelling anything, and the red check made
    # every pull request in the repo non-green.
    #
    # Delayed beats dead. This is one API call, so it clears its own backlog the moment a slot
    # opens, and `${{ vars.CI_RUNS_ON }}` is `self-hosted` today. The fallback stays hosted so
    # the workflow still works in a fork or once hosted minutes come back.
    runs-on: ${{ vars.CI_LIGHT_RUNS_ON || vars.CI_RUNS_ON || 'ubuntu-latest' }}
    steps:
      - name: Cancel queued and in-progress runs for this PR's branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {owner, repo} = context.repo
            const branch = context.payload.pull_request.head.ref
            // THIS run's id. It is on the PR's branch and it is in_progress while it executes,
            // so the query below returns it and the job would cancel itself. Measured on PR
            // #308: the log read `cancelled in_progress run 32094965534`, its own id, and the
            // PR then carried a red `cancel` check that no re-run could clear, because this
            // workflow only fires on `pull_request: closed`. Every closed PR was reddened by
            // its own cleanup.
            const self = context.runId

            // A MERGED pull request's run at its MERGED HEAD is evidence, not waste.
            //
            // Measured 2026-08-20, and it destroyed merged work. #500 merged at 03:05. This
            // workflow ran and cancelled its two CI runs:
            //
            //   03:12:58  cancelled queued run 32326602598 (CI)
            //   03:12:59  cancelled in_progress run 32326599613 (CI)
            //   03:12:59  cancelled 2 run(s) on feat/agent-estate-backup
            //
            // Four minutes later main-admission-guard looked for a green CI run at that same
            // head, found only the two this job had just cancelled, and reverted the merge:
            //
            //   Reverted by main-admission-guard: #500 was merged without a green CI run at its
            //   head 1886e967 (CI there: cancelled, cancelled)
            //
            // Two workflows, each doing exactly what it was written to do, deleting a merged
            // pull request between them. Neither said a word on the pull request.
            //
            // So a run at the merged head SURVIVES. Everything on an older sha is still
            // cancelled, and that is where the wasted runner-hours actually were -- a superseded
            // sha can never be anybody's evidence. A pull request closed WITHOUT merging keeps
            // the old behaviour entirely: nothing will ever ask it for proof.
            const merged = context.payload.pull_request.merged === true
            const headSha = context.payload.pull_request.head.sha

            let cancelled = 0
            const kept = []
            // Both states, because a run already executing on a merged PR is just as wasteful
            // as a queued one -- it holds a runner for its full twenty minutes to answer a dead
            // question.
            for (const status of ['queued', 'in_progress']) {
              const runs = await github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,
                {owner, repo, branch, status, per_page: 100})
              for (const run of runs) {
                if (run.id === self) {
                  core.info(`not cancelling this job's own run ${run.id}`)
                  continue
                }
                if (merged && run.head_sha === headSha) {
                  core.info(`KEEPING ${status} run ${run.id} (${run.name}): it is at the merged ` +
                            `head ${headSha.slice(0, 8)}, and main-admission-guard needs it green`)
                  kept.push(`${run.name} ([${run.id}](${run.html_url}))`)
                  continue
                }
                try {
                  await github.rest.actions.cancelWorkflowRun(
                    {owner, repo, run_id: run.id})
                  core.info(`cancelled ${status} run ${run.id} (${run.name})`)
                  cancelled++
                } catch (e) {
                  // Never fail the job on one cancel. A run that finished between the list and
                  // the cancel answers 409, and that is success by any measure that matters.
                  core.info(`could not cancel ${run.id} (already finished?): ${e.message}`)
                }
              }
            }
            core.info(`cancelled ${cancelled} run(s) on ${branch}, kept ${kept.length}`)

            // Founder directive 2026-08-20: "we have processes doing stuff without stating
            // clearly why", "like blocking, reverting, merging", "the whole loop happens in the
            // dark". This job cancels other people's builds and, until today, said so only in
            // its own log -- which nobody opens, because the check is green. It says it on the
            // pull request now, and only when it actually did something.
            if (cancelled || kept.length) {
              const lines = [`**cancel-ci-on-pr-close:** this pull request ${merged ? 'merged' : 'closed'}, so its builds were tidied up.`, '']
              if (cancelled) {
                lines.push(`Cancelled **${cancelled}** run(s) on \`${branch}\` that were still queued or running against a superseded commit. They were answering a question nobody is waiting on, and each one held a self-hosted runner for up to twenty minutes.`)
              }
              if (kept.length) {
                lines.push('', `Kept, deliberately: ${kept.join(', ')} — at the merged head \`${headSha.slice(0, 8)}\`. \`main-admission-guard\` reverts a merge that has no green CI run at its head, so cancelling this would undo the merge. That happened to #500 today.`)
              }
              lines.push('', `Decided by [this run](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}).`)
              try {
                await github.rest.issues.createComment({
                  owner, repo,
                  issue_number: context.payload.pull_request.number,
                  body: lines.join('\n'),
                })
              } catch (e) {
                core.warning(`could not comment: ${e.message}`)
              }
            }
